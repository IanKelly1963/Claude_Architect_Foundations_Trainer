    {k:"A", text:"They convey the distinction, not just instances."},
    {k:"B", text:"They are processed with higher weight than instructions."},
    {k:"C", text:"They bypass the model's ordinary instruction following."},
    {k:"D", text:"They are cached and reused across requests."}
  ],
  correct:["A"],
  explain:{
    why:"Well-chosen examples show the principle separating the cases, so novel instances on either side of that principle are handled correctly. A list only covers what it lists.",
    distractors:{
      B:"There is no weighting mechanism that privileges examples.",
      C:"Examples work through instruction following rather than around it.",
      D:"Caching affects cost rather than generalisation."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.2-o", domain:4, ts:"4.2", scenario:3, type:"single",
  stem:"A research synthesis agent formats findings inconsistently despite a detailed style guide in the prompt. What is the most effective addition?",
  options:[
    {k:"A", text:"One worked example of a formatted finding."},
    {k:"B", text:"A restatement of the style guide at the end."},
    {k:"C", text:"A request to follow the style guide exactly."},
    {k:"D", text:"A shorter style guide."}
  ],
  correct:["A"],
  explain:{
    why:"A worked instance shows the shape unambiguously, which is what a description of the shape has already failed to do.",
    distractors:{
      D:"A shorter guide may be clearer and is worth doing, but it is still description rather than demonstration.",
      B:"Repetition raises salience without closing the gap.",
      C:"'Exactly' does not resolve what the guide left open to interpretation."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.2-p", domain:4, ts:"4.2", scenario:6, type:"multi",
  stem:"Which two properties make a few-shot example set effective? (Select 2.)",
  options:[
    {k:"A", text:"Coverage of the structural variety the model will meet."},
    {k:"B", text:"Reasoning showing why the chosen handling was correct."},
    {k:"C", text:"All examples drawn from the most common case."},
    {k:"D", text:"Examples longer than the inputs they illustrate."}
  ],
  correct:["A","B"],
  explain:{
    why:"Variety defines the space the model generalises over, and visible reasoning conveys the principle rather than a surface pattern.",
    distractors:{
      C:"Concentrating on the common case is what produces good performance there and poor performance everywhere else.",
      D:"Length is irrelevant, and very long examples crowd out the actual input."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.2-q", domain:4, ts:"4.2", scenario:5, type:"single",
  stem:"A reviewer misses test-coverage gaps inside functions that have some tests. What kind of example would help?",
  options:[
    {k:"A", text:"A tested function with one untested branch."},
    {k:"B", text:"A wholly untested function, marked as a gap."},
    {k:"C", text:"A fully tested function, marked as acceptable."},
    {k:"D", text:"A coverage report showing the branch percentage."}
  ],
  correct:["A"],
  explain:{
    why:"The missed case is precisely a partly-tested function, so the example has to show that shape being treated as a gap.",
    distractors:{
      B:"Wholly untested functions are already being caught, so this reinforces what works.",
      C:"An acceptable example is useful for contrast but does not demonstrate the missed case.",
      D:"A percentage says coverage is incomplete without identifying which branch."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.2-r", domain:4, ts:"4.2", scenario:1, type:"single",
  stem:"An engineer proposes replacing all escalation criteria with twenty few-shot examples. What is the objection?",
  options:[
    {k:"A", text:"Examples illustrate criteria; they do not replace them."},
    {k:"B", text:"Twenty examples exceed the model's example limit."},
    {k:"C", text:"Examples cannot express escalation decisions."},
    {k:"D", text:"Criteria and examples cannot appear in the same prompt."}
  ],
  correct:["A"],
  explain:{
    why:"Stated criteria give the general rule; examples calibrate it on the hard cases. Removing the rule leaves the model inferring policy from instances, and it may infer the wrong one.",
    distractors:{
      B:"There is no fixed limit, though twenty is expensive on every request.",
      C:"Examples express escalation decisions well, which is why they belong alongside criteria.",
      D:"The two are routinely and effectively combined."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.2-s", domain:4, ts:"4.2", scenario:6, type:"single",
  stem:"Which example set best supports extraction from documents with varied citation styles?",
  options:[
    {k:"A", text:"One inline-citation and one bibliography document."},
    {k:"B", text:"Four inline-citation documents."},
    {k:"C", text:"One document with no citations at all."},
    {k:"D", text:"A description of both citation styles."}
  ],
  correct:["A"],
  explain:{
    why:"Two examples spanning the structural variety teach that the same information appears in different forms, which is the generalisation required.",
    distractors:{
      B:"Four of one style teaches that style thoroughly and the other not at all.",
      C:"A document with no citations demonstrates neither style.",
      D:"Description is what has already proved insufficient."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.2-t", domain:4, ts:"4.2", scenario:5, type:"single",
  stem:"A prompt contains examples that conflict with its written instructions. Which tends to win?",
  options:[
    {k:"A", text:"The examples, so conflicts must be removed."},
    {k:"B", text:"The instructions, since they are stated as rules."},
    {k:"C", text:"Whichever appears later in the prompt."},
    {k:"D", text:"Neither; the model refuses to proceed."}
  ],
  correct:["A"],
  explain:{
    why:"Demonstrated behaviour is a strong signal, so examples that contradict the instructions tend to be followed. The practical lesson is to keep them consistent.",
    distractors:{
      B:"Stating something as a rule does not outweigh showing the opposite being done.",
      C:"Position has some effect but does not reliably decide the conflict.",
      D:"The model proceeds and produces something, which is what makes the conflict dangerous."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.3-g", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"Extraction JSON parsed from text fails roughly 4% of the time on trailing commas and markdown fences. What removes this class of failure?",
  options:[
    {k:"A", text:"Define the contract as a tool with a JSON schema."},
    {k:"B", text:"Instruct the model to emit raw JSON only."},
    {k:"C", text:"Add a repair pass for common syntax errors."},
    {k:"D", text:"Set temperature to zero."}
  ],
  correct:["A"],
  explain:{
    why:"Filling a defined structure removes the possibility of malformed output entirely, rather than reducing how often it occurs.",
    distractors:{
      C:"A repair pass fixes the common cases and leaves ambiguous malformations, so a residual remains.",
      B:"Instructions lower the rate without eliminating it, which is the 4% you are trying to remove.",
      D:"Determinism does not imply well-formedness; the model can deterministically emit a fenced block."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-h", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"After moving to schema-constrained tool use, line items still fail to sum to the stated total. What does this show?",
  options:[
    {k:"A", text:"Schemas constrain structure, not relationships."},
    {k:"B", text:"The schema is not marked strict."},
    {k:"C", text:"Numeric fields should be strings."},
    {k:"D", text:"Tool use is unsuitable for numeric extraction of any kind."}
  ],
  correct:["A"],
  explain:{
    why:"Every field can be a valid number while the arithmetic between them is wrong. Cross-field consistency is a semantic property that no schema expresses.",
    distractors:{
      B:"Strictness governs conformance to declared types, not arithmetic between fields.",
      C:"Making numbers strings removes type safety and changes nothing about the sum.",
      D:"Tool use is the right mechanism; it simply does not cover semantics."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-i", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"A required `termination_date` is invented for contracts that are open-ended. What is the fix?",
  options:[
    {k:"A", text:"Make the field nullable so absence is expressible."},
    {k:"B", text:"Instruct the model never to guess dates."},
    {k:"C", text:"Add a confidence score for the field."},
    {k:"D", text:"Verify each extracted date against the document text afterwards."}
  ],
  correct:["A"],
  explain:{
    why:"A required field creates pressure to supply something. Allowing null gives the model a correct way to say the contract has no termination date.",
    distractors:{
      B:"The instruction contradicts the schema requirement, and the schema is the stronger constraint.",
      C:"A confidence score annotates the invented value without removing it.",
      D:"Verification catches some fabrications after paying to produce them."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-j", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"New document categories keep appearing and are forced into the nearest existing enum value, corrupting routing. What schema change helps?",
  options:[
    {k:"A", text:"An `other` value plus a free-text detail field."},
    {k:"B", text:"Removing the enum and accepting any string."},
    {k:"C", text:"Expanding the enum to thirty foreseeable values."},
    {k:"D", text:"A boolean indicating whether the value fits well."}
  ],
  correct:["A"],
  explain:{
    why:"This keeps the closed set that routing depends on while giving unrecognised types an honest home, and the detail field tells you which values to promote next.",
    distractors:{
      C:"Thirty is still closed, so the thirty-first type recreates the problem.",
      B:"Free-form strings destroy the routing guarantee and produce many spellings of one type.",
      D:"A fit flag records the problem without providing a correct value."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-k", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"Where do rules for interpreting ambiguous source formats belong?",
  options:[
    {k:"A", text:"In the prompt, alongside the schema."},
    {k:"B", text:"In the schema's `pattern` field."},
    {k:"C", text:"In a downstream normalisation service."},
    {k:"D", text:"Nowhere; a typed field resolves it."}
  ],
  correct:["A"],
  explain:{
    why:"The schema constrains the output shape but says nothing about how to read an ambiguous input such as `03/04/2026`. That convention has to be stated where the model can apply it.",
    distractors:{
      B:"`pattern` validates a string against an expression; it does not resolve which reading was intended.",
      C:"Downstream normalisation cannot recover the ambiguity once the original context is gone.",
      D:"A date type constrains the format without deciding between two readings."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-l", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"Which `tool_choice` guarantees structured output when the document type is unknown?",
  options:[
    {k:"A", text:"`any`"},
    {k:"B", text:"`auto`"},
    {k:"C", text:"`none`"},
    {k:"D", text:"A forced named tool"}
  ],
  correct:["A"],
  explain:{
    why:"It requires a tool call while leaving the schema choice to the model, which is what an unknown document type needs.",
    distractors:{
      D:"Forcing one schema misclassifies every document of another type.",
      B:"`auto` permits a text reply, losing the guarantee.",
      C:"`none` forbids tools entirely."
    }
  },
  refs:[R_TOVR] },

{ id:"d4-4.3-m", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"How should a genuinely ambiguous field be distinguished from an absent one?",
  options:[
    {k:"A", text:"An `unclear` enum value, separate from null."},
    {k:"B", text:"Null for both, since neither is reliable."},
    {k:"C", text:"The most likely reading, with a note."},
    {k:"D", text:"An array of all plausible readings."}
  ],
  correct:["A"],
  explain:{
    why:"They need different handling: an ambiguous field has content a reviewer can adjudicate, an absent one does not. Keeping them distinct lets review routing work.",
    distractors:{
      B:"Collapsing them loses the signal that a human could resolve this case by reading.",
      C:"A silent best guess is the fabrication risk the schema design is meant to avoid.",
      D:"An array complicates the contract and pushes the decision downstream, where there is less context."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-n", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"A schema marks 18 of 20 fields required, and hallucinated values appear in roughly one document in six. What is the most likely relationship?",
  options:[
    {k:"A", text:"Required fields pressure the model to supply something."},
    {k:"B", text:"Twenty fields is beyond what one call can extract."},
    {k:"C", text:"Required fields are validated more loosely."},
    {k:"D", text:"The two are unrelated."}
  ],
  correct:["A"],
  explain:{
    why:"When a field must be present and the document does not contain it, producing a plausible value is the only way to satisfy the contract. Nullable fields remove that pressure.",
    distractors:{
      B:"Twenty fields is well within a single extraction's capability.",
      C:"Required fields are validated for presence and type like any other.",
      D:"The relationship is direct and is the standard explanation for this pattern."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-o", domain:4, ts:"4.3", scenario:6, type:"multi",
  stem:"Which two schema choices reduce fabricated values? (Select 2.)",
  options:[
    {k:"A", text:"Making fields nullable where the source may omit them."},
    {k:"B", text:"Providing an `unclear` value for ambiguous cases."},
    {k:"C", text:"Marking every field required for completeness."},
    {k:"D", text:"Removing enums so any value is acceptable."}
  ],
  correct:["A","B"],
  explain:{
    why:"Both give the model a truthful way to represent what it found, which removes the incentive to invent something that satisfies the contract.",
    distractors:{
      C:"Universal requirement is the main driver of fabrication.",
      D:"Free-form values reduce validation errors while making bad data harder to detect."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-p", domain:4, ts:"4.3", scenario:5, type:"single",
  stem:"A CI job needs findings as structured objects rather than prose. Which approach is most reliable?",
  options:[
    {k:"A", text:"A tool whose schema defines the finding shape."},
    {k:"B", text:"A prompt describing the desired JSON shape in detail."},
    {k:"C", text:"A markdown template parsed afterwards."},
    {k:"D", text:"A regular expression applied over the model's prose response."}
  ],
  correct:["A"],
  explain:{
    why:"A schema makes the shape a contract the response must satisfy, so downstream parsing stops depending on how the model phrased things.",
    distractors:{
      B:"A description is followed most of the time, which leaves a residual the pipeline must handle.",
      C:"Templates are conventions rather than constraints and drift as wording changes.",
      D:"Regular expressions over prose are the fragility being removed."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-q", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"What does a strict JSON schema via tool use guarantee, and what does it not?",
  options:[
    {k:"A", text:"Shape and types, but not that the values are right."},
    {k:"B", text:"Both shape and semantic correctness."},
    {k:"C", text:"That every field was located in the right part of the document."},
    {k:"D", text:"Neither; schemas are advisory."}
  ],
  correct:["A"],
  explain:{
    why:"Conformance is structural. A correctly typed, correctly shaped record can still contain a value read from the wrong part of the document.",
    distractors:{
      B:"No schema can express whether a value was read correctly.",
      C:"Locating a value correctly is precisely what a schema cannot check; a field read from the wrong table still conforms.",
      D:"Schema conformance under tool use is enforced rather than advisory."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-r", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"Why extract `calculated_total` alongside `stated_total`?",
  options:[
    {k:"A", text:"A discrepancy between them becomes checkable."},
    {k:"B", text:"It doubles the chance that one of the values is correct."},
    {k:"C", text:"Schemas require a derived field for each stated one."},
    {k:"D", text:"It lets the model choose the more plausible value."}
  ],
  correct:["A"],
  explain:{
    why:"Capturing both the document's figure and the one implied by the line items turns a semantic check into a comparison of two extracted fields, and it also surfaces arithmetic errors in the source.",
    distractors:{
      B:"Two values do not improve the odds; the point is that disagreement is informative.",
      C:"No such schema requirement exists.",
      D:"The model should not silently pick; the discrepancy is the signal to preserve."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-s", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"A team wants one extraction call to also decide which downstream queue a document goes to. What is the cleanest schema approach?",
  options:[
    {k:"A", text:"A routing field with a closed enum plus an `other` escape."},
    {k:"B", text:"A free-text field naming the queue."},
    {k:"C", text:"A separate model call after extraction."},
    {k:"D", text:"Infer the queue downstream from the extracted fields."}
  ],
  correct:["A"],
  explain:{
    why:"A closed enum is what downstream routing can rely on, and the escape value keeps unrecognised cases visible rather than forcing them into a wrong queue.",
    distractors:{
      D:"Downstream inference duplicates a judgement the extractor is better placed to make, having read the document.",
      B:"Free text produces queue names that do not exist or vary in spelling.",
      C:"A second call costs a round trip for a decision the first call can make."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.3-t", domain:4, ts:"4.3", scenario:6, type:"single",
  stem:"Which statement about `tool_choice` and structured output is correct?",
  options:[
    {k:"A", text:"`auto` may return text, so it cannot guarantee structured output."},
    {k:"B", text:"`auto` guarantees a tool call when a schema is defined."},
    {k:"C", text:"`any` forces a specific named tool."},
    {k:"D", text:"Forced selection permits a text response alongside the call."}
  ],
  correct:["A"],
  explain:{
    why:"Under `auto` the model may judge that no tool is needed and answer in prose, which is exactly the outcome a structured pipeline cannot accept.",
    distractors:{
      B:"Defining a schema does not change whether a call is required.",
      C:"`any` requires some call but leaves the choice open; forcing a named tool is a different setting.",
      D:"Forced selection requires that tool to be called."
    }
  },
  refs:[R_TOVR] },

/* ---- Domain 4 expansion: task statements 4.4, 4.5 and 4.6 ---- */

{ id:"d4-4.4-g", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"Validation rejects an extraction because a date arrived as `15/03/2026` where an ISO string was expected. Will a retry with the error attached succeed?",
  options:[
    {k:"A", text:"Usually; the value is present and only its form is wrong."},
    {k:"B", text:"No; format errors indicate the field is absent."},
    {k:"C", text:"Only if the schema is relaxed to accept both forms."},
    {k:"D", text:"Only if the document is re-scanned at higher quality."}
  ],
  correct:["A"],
  explain:{
    why:"The information was found; it was simply expressed in the wrong shape. Told exactly what the validator objected to, the model can re-emit the same data correctly.",
    distractors:{
      C:"Relaxing the schema removes the error by accepting inconsistent data, which defeats the normalisation the schema exists to provide.",
      B:"The value is plainly present, so absence is not the failure.",
      D:"Scan quality is irrelevant when the value was read correctly."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-h", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"An extraction fails validation because `parent_company` is empty, and investigation shows it appears only in a corporate registry you do not supply. What should the pipeline do?",
  options:[
    {k:"A", text:"Stop retrying and route the document for enrichment."},
    {k:"B", text:"Retry with a stronger instruction that the field is required."},
    {k:"C", text:"Retry with an example of a correctly extracted parent company."},
    {k:"D", text:"Relax the schema so the field is optional and continue."}
  ],
  correct:["A"],
  explain:{
    why:"No reformulation can produce information that is not in the source. Recognising this and sending the document somewhere the fact can be looked up is the only path that ends well.",
    distractors:{
      D:"Making it optional does stop the failure, but it silently ships records missing a field the business needs.",
      B:"Emphasis pressures the model to invent a plausible parent company.",
      C:"An example teaches the format, not this document's missing content."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-i", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"What should a retry request contain for the model to self-correct effectively?",
  options:[
    {k:"A", text:"The document, the failed output and the errors."},
    {k:"B", text:"The document, plus an instruction to try harder this time."},
    {k:"C", text:"The failed output and the schema."},
    {k:"D", text:"The document alone, so that the model starts entirely fresh."}
  ],
  correct:["A"],
  explain:{
    why:"Correction needs all three: the source to re-read, the attempt to correct, and a precise statement of what was wrong with it.",
    distractors:{
      C:"Without the document the model cannot check its values against anything.",
      D:"Starting fresh discards the information about what failed, so the same error is likely.",
      B:"Effort instructions carry no information about the defect."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-j", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"A source document states a total in two places with different values. What extraction design surfaces this rather than hiding it?",
  options:[
    {k:"A", text:"A `conflict_detected` flag plus both values."},
    {k:"B", text:"Take whichever value sits nearer the document's end."},
    {k:"C", text:"Take the value that appears more often."},
    {k:"D", text:"Fail the document and route it to manual entry."}
  ],
  correct:["A"],
  explain:{
    why:"An explicit flag with both values preserves what the source actually says, so a reviewer can adjudicate with full information rather than inheriting a silent guess.",
    distractors:{
      D:"Failing the whole document discards every correctly extracted field over one conflicted value.",
      B:"Position is not evidence of correctness; a later figure can equally be a typo.",
      C:"A repeated error is still an error."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-k", domain:4, ts:"4.4", scenario:5, type:"single",
  stem:"Developers dismiss many findings and you cannot tell which code shapes trigger the bad ones. What addition to the finding schema helps?",
  options:[
    {k:"A", text:"A `detected_pattern` field naming the construct."},
    {k:"B", text:"A free-text field explaining the reasoning."},
    {k:"C", text:"A timestamp for each finding."},
    {k:"D", text:"A severity label."}
  ],
  correct:["A"],
  explain:{
    why:"A named construct makes dismissals groupable, so you can see that a particular idiom accounts for most of them and fix that criterion specifically.",
    distractors:{
      B:"Free text cannot be aggregated across thousands of findings without heavy processing.",
      C:"Timestamps support trend analysis rather than attribution to code shapes.",
      D:"Severity is already known and does not identify the trigger."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-l", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"A pipeline retries every validation failure up to five times. Cost is high and the success rate on retries is 30%. What would improve it most?",
  options:[
    {k:"A", text:"Retry only categories retries can fix."},
    {k:"B", text:"Increase the retry limit to ten."},
    {k:"C", text:"Retry with higher temperature for variety."},
    {k:"D", text:"Retry with a larger model."}
  ],
  correct:["A"],
  explain:{
    why:"The 70% that never succeed are mostly missing-information failures, which no retry can resolve. Classifying first means the budget goes only where it can pay off.",
    distractors:{
      B:"More attempts at unfixable failures multiplies the waste.",
      C:"Variance does not conjure absent information and destabilises fields that were correct.",
      D:"A stronger model still cannot read what is not in the document."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-m", domain:4, ts:"4.4", scenario:6, type:"multi",
  stem:"Which two validation failures are usually fixable by retry with feedback? (Select 2.)",
  options:[
    {k:"A", text:"A nested object returned as flat top-level keys."},
    {k:"B", text:"A number returned as a formatted string."},
    {k:"C", text:"A field the document genuinely does not contain."},
    {k:"D", text:"A field whose value lives in a system not provided."}
  ],
  correct:["A","B"],
  explain:{
    why:"Both are representation errors: the data was found and only its shape is wrong, which a precise error message lets the model correct.",
    distractors:{

      D:"The information is outside the model's context entirely, so no retry can reach it."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-n", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"Which failure is a semantic error rather than a schema error?",
  options:[
    {k:"A", text:"A shipping address in the billing field."},
    {k:"B", text:"A missing required property."},
    {k:"C", text:"A string where an integer was declared."},
    {k:"D", text:"An enum value outside the permitted set."}
  ],
  correct:["A"],
  explain:{
    why:"Both fields are valid strings and the record conforms perfectly. The error is that the value was taken from the wrong part of the document, which no schema can detect.",
    distractors:{

      C:"Type mismatch is exactly what schema validation catches.",
      D:"Enum membership is a declared constraint."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-o", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"After adding retry-with-feedback, some documents loop through all retries and still fail with the same error. What should the pipeline record?",
  options:[
    {k:"A", text:"The failure category, so unfixable classes can be excluded."},
    {k:"B", text:"Only the final error, since intermediates are redundant."},
    {k:"C", text:"Nothing; repeated failures are self-evident."},
    {k:"D", text:"The full text of every attempt for manual comparison."}
  ],
  correct:["A"],
  explain:{
    why:"Categorised failures are what let you notice that a whole class never succeeds, and then stop spending retries on it. That is the feedback loop closing.",
    distractors:{
      D:"Full transcripts are useful for one-off debugging but do not aggregate into a decision.",
      B:"The final error alone loses whether the attempts were converging or identical.",
      C:"Without a record there is no way to see the pattern across documents."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-p", domain:4, ts:"4.4", scenario:5, type:"single",
  stem:"A CI reviewer's structured findings lack any field identifying what triggered them. What analysis becomes impossible?",
  options:[
    {k:"A", text:"Which code shapes generate the false positives."},
    {k:"B", text:"Counting findings per pull request."},
    {k:"C", text:"Measuring the dismissal rate overall."},
    {k:"D", text:"Sorting findings by severity."}
  ],
  correct:["A"],
  explain:{
    why:"Aggregate rates tell you there is a problem; attribution tells you which criterion to fix. Without a trigger field the dismissals cannot be grouped by cause.",
    distractors:{
      B:"Counting needs only the findings themselves.",
      C:"An overall rate is computable from outcomes alone.",
      D:"Severity is a separate field and remains sortable."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-q", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"Why is a self-correction loop preferable to relaxing the schema when validation fails often?",
  options:[
    {k:"A", text:"Relaxing accepts bad data; correcting fixes it."},
    {k:"B", text:"Relaxing costs more tokens than retrying."},
    {k:"C", text:"Relaxed schemas cannot be used together with tool use."},
    {k:"D", text:"Correction always succeeds on the first retry attempt."}
  ],
  correct:["A"],
  explain:{
    why:"A looser schema makes the error disappear by admitting the malformed record downstream, where the problem resurfaces as bad data nobody flagged.",
    distractors:{
      B:"Relaxing is cheaper in tokens, which is part of its appeal and why the data-quality argument matters.",
      C:"Any valid schema works with tool use, strict or permissive.",
      D:"Correction often needs more than one attempt and sometimes cannot succeed at all."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-r", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"A validator checks only that required fields are present. Extraction quality is poor despite everything passing. What is missing?",
  options:[
    {k:"A", text:"Checks between values."},
    {k:"B", text:"Stricter type declarations."},
    {k:"C", text:"More required fields."},
    {k:"D", text:"A larger validation sample."}
  ],
  correct:["A"],
  explain:{
    why:"Presence says a field was filled, not that it was filled correctly. Cross-field checks such as totals summing or dates ordering are what catch a plausible but wrong record.",
    distractors:{
      C:"More required fields increases the pressure to fabricate rather than improving quality.",
      B:"Types are already being enforced by the schema and were not the failure.",
      D:"A larger sample measures the problem better without detecting it in any individual record."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-s", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"What is the practical benefit of distinguishing retryable from non-retryable validation failures?",
  options:[
    {k:"A", text:"Retry budget goes only where it can succeed."},
    {k:"B", text:"Retryable failures can be handled with a cheaper model."},
    {k:"C", text:"Non-retryable failures can be ignored entirely."},
    {k:"D", text:"The schema can be simplified."}
  ],
  correct:["A"],
  explain:{
    why:"Retries are not free, and a missing-information failure will consume the entire budget to arrive at the same result. Classifying first directs the spend at the failures that respond.",
    distractors:{
      C:"Non-retryable failures still need handling, usually enrichment or human review.",
      B:"Model choice is independent of the failure category.",
      D:"The schema is unchanged by how failures are classified."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.4-t", domain:4, ts:"4.4", scenario:6, type:"single",
  stem:"An extraction returns a total of 12,400 where the line items sum to 11,900. What should the pipeline do?",
  options:[

    {k:"B", text:"Overwrite the stated total with the computed one."},
    {k:"C", text:"Retry until the two agree."},
    {k:"D", text:"Accept the stated total, since the document is authoritative."}
  ],
  correct:["A"],
  explain:{
    why:"The mismatch may be an extraction error or an error in the document itself, and only a human reading it can tell. Recording both preserves the evidence for that decision.",
    distractors:{
      B:"Silently overwriting hides a genuine discrepancy in the source.",
      C:"Retrying until agreement selects for a consistent answer rather than a correct one.",
      D:"Source documents contain arithmetic errors, so authority is not a safe assumption."
    }
  },
  refs:[R_STRUCT] },

{ id:"d4-4.5-g", domain:4, ts:"4.5", scenario:6, type:"single",
  stem:"You must guarantee results within 30 hours using an API whose worst case is 24. What submission cadence works?",
  options:[
    {k:"A", text:"Every 4 hours."},
    {k:"B", text:"Once daily."},
    {k:"C", text:"Every 30 hours."},
    {k:"D", text:"Once weekly with priority flags."}
  ],
  correct:["A"],
  explain:{
    why:"Total latency is queue wait plus processing. A four-hour cadence caps the wait at four, giving a 28-hour worst case inside the SLA.",
    distractors:{
      B:"A document arriving just after submission waits nearly 24 hours, then up to 24 more.",
      C:"A 30-hour cadence exhausts the SLA before processing begins.",
      D:"Weekly submission misses the SLA by days, and there are no priority flags."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-h", domain:4, ts:"4.5", scenario:6, type:"single",
  stem:"Of 500 batched documents, 12 failed for exceeding the context limit. What is the correct recovery?",
  options:[

  correct:["A"],
  explain:{

    distractors:{

      D:"Silently dropping 2.4% of the corpus is a data quality failure with a straightforward fix available."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-i", domain:4, ts:"4.5", scenario:5, type:"single",

      D:"Nightly generation is read the next morning and tolerates the window."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-j", domain:4, ts:"4.5", scenario:6, type:"single",

    {k:"D", text:"No; batch does not accept tool definitions at all."}

{ id:"d4-4.5-k", domain:4, ts:"4.5", scenario:6, type:"single",
  stem:"Before batching 80,000 documents with a new prompt, what is the most valuable preparation?",
  options:[

    {k:"D", text:"Run the whole corpus synchronously to validate."}

  correct:["A"],
  explain:{
    why:"A systematic prompt flaw discovered after 80,000 documents means paying for the corpus twice and waiting through two windows. A sample finds it for almost nothing.",
    distractors:{

      C:"Resubmission is available, and is exactly the cost the sample avoids.",
      D:"Running everything synchronously discards the 50% saving and is the most expensive option."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-l", domain:4, ts:"4.5", scenario:5, type:"single",
  stem:"What is `custom_id` for?",

    {k:"B", text:"Setting processing priority within a batch."},
    {k:"C", text:"Grouping requests onto one worker."},
    {k:"D", text:"Selecting which model handles the request."}
  ],
  correct:["A"],
  explain:{
    why:"Results are not guaranteed to return in submission order, so the identifier is how each response is matched to its request and how failures are identified.",
    distractors:{

      C:"It does not influence scheduling or worker assignment.",
      D:"Model selection is a per-request parameter, not the identifier."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-m", domain:4, ts:"4.5", scenario:5, type:"single",

  correct:["A"],
  explain:{

  },
  refs:[R_BATCH] },

{ id:"d4-4.5-n", domain:4, ts:"4.5", scenario:5, type:"multi",

    {k:"D", text:"Responses returned in submission order."}

{ id:"d4-4.5-o", domain:4, ts:"4.5", scenario:5, type:"single",
  stem:"A team reports that batches usually finish in 20 minutes and proposes using batch for a user-facing feature. What is the flaw?",

    distractors:{

      B:"There is no technical prohibition; the objection is about the latency guarantee.",
      D:"Usage data is returned."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-p", domain:4, ts:"4.5", scenario:5, type:"single",

    distractors:{

      B:"The limit is far above 1,000.",

    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-q", domain:4, ts:"4.5", scenario:5, type:"single",
  stem:"Which factor should drive the choice between batch and synchronous processing?",
  options:[
    {k:"A", text:"Whether anything is blocked on the result."},
    {k:"B", text:"The number of requests involved."},
    {k:"C", text:"Whether the prompts use tools."},
    {k:"D", text:"The size of each individual document."}
  ],
  correct:["A"],
  explain:{
    why:"Latency tolerance is the discriminator. Everything else being equal, work nobody waits on should take the cheaper path.",
    distractors:{
      C:"Tool use does constrain batch, but it is a secondary consideration once latency has decided the question.",
      B:"Volume affects cost rather than which API is appropriate.",
      D:"Document size affects chunking rather than the batch decision."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-r", domain:4, ts:"4.5", scenario:5, type:"single",
  stem:"After a batch completes, 40 requests have no corresponding response. What is the first thing to check?",

    distractors:{

      B:"Load affects timing rather than causing responses to vanish.",
      D:"There is no per-batch token budget that silently drops requests."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-s", domain:4, ts:"4.5", scenario:5, type:"single",
  stem:"A pipeline submits one document per batch, several thousand times a day. What is wrong with this?",

      B:"Single-request batches are permitted.",
      D:"One key serves all batches."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.5-t", domain:4, ts:"4.5", scenario:5, type:"single",
  stem:"How should a batch pipeline handle a mix of successes and failures?",

    {k:"A", text:"Process the successes and resubmit only the failures."},

    {k:"D", text:"Process only if the success rate exceeds 95%."}

  correct:["A"],
  explain:{

    distractors:{

      C:"Waiting for perfection stalls the pipeline on documents that may never succeed.",
      D:"An arbitrary threshold blocks useful results and does not address the failures."
    }
  },
  refs:[R_BATCH] },

{ id:"d4-4.6-g", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"A generation session is asked to review its own output and reports no issues. An independent instance finds three. What explains the difference?",
  options:[
    {k:"A", text:"The generating session re-accepts its own justifications."},
    {k:"B", text:"The independent instance used a larger context window."},
    {k:"C", text:"The generating session had already exhausted its context."},
    {k:"D", text:"Self-review is disabled within a generation session."}
  ],
  correct:["A"],
  explain:{
    why:"Every decision in the code was made for a reason the session still holds, so reviewing from inside that frame confirms rather than questions. A fresh instance sees only the code.",
    distractors:{
      C:"Remaining capacity is a practical factor but the bias persists with plenty of context left.",
      B:"Window size is a configuration choice available to either.",
      D:"Nothing disables it; it simply performs poorly."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-h", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"A 14-file review produces detailed feedback on some files and superficial comments on others, plus contradictory findings. What restructuring addresses this?",
  options:[
    {k:"A", text:"Per-file passes plus a separate integration pass."},
    {k:"B", text:"A model with a larger context window."},
    {k:"C", text:"Requiring developers to submit smaller pull requests."},
    {k:"D", text:"Three passes, reporting only findings seen twice."}
  ],
  correct:["A"],
  explain:{
    why:"Uneven depth across one diff is attention dilution. Per-file passes give each file the same focus, and a dedicated integration pass covers what only appears across boundaries.",
    distractors:{
      B:"The files already fit; attention quality and capacity are different things.",
      C:"This moves the burden to developers without improving the system.",
      D:"Consensus filtering suppresses subtle bugs caught in only one pass."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-i", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"What should a verification pass that reports confidence alongside each finding be used for?",
  options:[
    {k:"A", text:"Routing findings to the right level of reviewer."},
    {k:"B", text:"Discarding findings below a threshold."},
    {k:"C", text:"Ranking findings by severity."},
    {k:"D", text:"Deciding whether to run the review again."}
  ],
  correct:["A"],
  explain:{
    why:"Confidence is useful for directing attention rather than filtering. Uncertain findings go to someone more experienced instead of being thrown away.",
    distractors:{
      B:"Discarding on an uncalibrated score loses true positives along with false ones.",
      C:"Confidence is about whether a finding is real; severity is about its impact if it is.",
      D:"Re-running does not resolve uncertainty about a specific finding."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-j", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"An integration pass is added but receives only the diff. Cross-file breakage still slips through. Why?",
  options:[
    {k:"A", text:"Unchanged callers do not appear in a diff."},
    {k:"B", text:"Integration passes cannot detect signature changes."},
    {k:"C", text:"The pass runs before any of the per-file passes."},
    {k:"D", text:"Diffs omit file paths needed for cross-referencing."}

  correct:["A"],
  explain:{

    distractors:{
      B:"Signature mismatches are among the easiest cross-file checks when the call sites are visible.",
      C:"Ordering affects use of per-file findings, not whether callers are visible.",
      D:"Diffs include paths; the problem is which files are included at all."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-k", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"Why does adding extended thinking to a self-review not substitute for an independent instance?",
  options:[
    {k:"A", text:"It deepens reasoning without removing the commitment."},
    {k:"B", text:"Extended thinking cannot be used for review tasks."},
    {k:"C", text:"It consumes the context the review needs."},
    {k:"D", text:"It applies only to the first turn of a session."}
  ],
  correct:["A"],
  explain:{
    why:"The bias comes from having already decided, not from thinking too little. More careful reasoning within the same frame tends to produce a better-argued version of the same conclusion.",
    distractors:{
      C:"Context cost is real but secondary; the bias would remain with ample room.",
      B:"It is perfectly usable for review.",
      D:"It is not restricted to the first turn."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-l", domain:4, ts:"4.6", scenario:5, type:"multi",
  stem:"Which two make up a complete multi-pass review architecture for a large diff? (Select 2.)",
  options:[
    {k:"A", text:"Per-file passes for local issues."},
    {k:"B", text:"An integration pass for cross-file data flow."},
    {k:"C", text:"A consensus vote across repeated full passes."},
    {k:"D", text:"A summary pass consolidating the findings."}

  correct:["A","B"],

      D:"Consolidation is presentation; it finds nothing the passes did not."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-m", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"A team runs three review passes and reports only findings appearing in two. Real bugs start slipping through. Why?",
  options:[
    {k:"A", text:"Subtle bugs are often caught in only one pass."},
    {k:"B", text:"Three passes exceeds the recommended maximum for a review."},
    {k:"C", text:"Passes interfere when run against the same diff."},
    {k:"D", text:"Consensus filtering requires an even number of passes."}
  ],
  correct:["A"],
  explain:{
    why:"Requiring agreement selects for the obvious. The findings that need a reviewer most are exactly the ones a given pass may or may not notice, and those fail the two-of-three test.",
    distractors:{
      B:"There is no such maximum.",
      C:"Independent passes do not interfere with one another.",
      D:"Odd numbers are the usual choice for voting; the flaw is voting at all here."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-n", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"What does an independent review instance lack that makes it a better reviewer?",
  options:[
    {k:"A", text:"The reasoning that produced the code."},
    {k:"B", text:"Access to the repository."},
    {k:"C", text:"Knowledge of the language."},
    {k:"D", text:"The project's coding standards."}
  ],
  correct:["A"],
  explain:{
    why:"What is absent is the chain of justifications. Without it there is nothing to defend, so questionable decisions are evaluated rather than assumed settled.",
    distractors:{
      B:"Repository access is a configuration choice and is usually desirable.",
      C:"Language knowledge is required for any useful review.",
      D:"Standards should be supplied, typically through CLAUDE.md."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-o", domain:4, ts:"4.6", scenario:3, type:"single",
  stem:"A research pipeline has the synthesis agent check its own citations. Errors persist. What would improve it?",
  options:[
    {k:"A", text:"A separate verification pass without the synthesis reasoning."},
    {k:"B", text:"An instruction to check citations twice."},
    {k:"C", text:"A larger model for synthesis."},
    {k:"D", text:"Citations checked before synthesis rather than after."}
  ],
  correct:["A"],
  explain:{
    why:"The same bias applies to citations as to code: the agent that chose them re-accepts its choices. A separate pass evaluates each claim-source pair on its own terms.",
    distractors:{
      D:"Pre-synthesis checking is worth doing, but it cannot verify citations that synthesis itself introduces or reattributes.",
      B:"Repetition within the same frame reproduces the same acceptances.",
      C:"Capability does not remove the attachment to one's own prior choices."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-p", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"Which is the strongest reason to split a review by file rather than by concern?",
  options:[
    {k:"A", text:"Each file gets the same depth of attention."},
    {k:"B", text:"Concern-based passes cannot be automated reliably."},
    {k:"C", text:"Files are smaller than concerns."},
    {k:"D", text:"Concerns overlap and produce duplicate findings."}
  ],
  correct:["A"],
  explain:{
    why:"The defect being solved is uneven attention across a large diff, and giving each file its own pass is what equalises it.",
    distractors:{
      D:"Overlap between concerns is a real drawback and a reasonable secondary argument, but it is not the primary reason for splitting by file.",
      B:"Concern-based passes automate perfectly well.",
      C:"Size varies in both directions and is not the operative property."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-q", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"After splitting into per-file passes, the same style issue is reported in nine files. What would improve the output?",
  options:[
    {k:"A", text:"Consolidate repeated findings into one with all locations."},
    {k:"B", text:"Report only the first occurrence and drop the rest."},
    {k:"C", text:"Return to a single pass over all files."},
    {k:"D", text:"Suppress style findings entirely."}
  ],
  correct:["A"],
  explain:{
    why:"The finding is real in all nine places, so nothing should be discarded. Grouping them presents one actionable item with a complete list of sites.",
    distractors:{
      B:"Dropping eight real occurrences leaves work undone and the reader unaware of the scope.",
      C:"Reverting reintroduces the uneven depth the split fixed.",
      D:"Suppressing a whole category to fix a presentation problem is disproportionate."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-r", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"A single-pass review of 20 files flags a pattern as a problem in one file and approves identical code in another. What does this indicate?",
  options:[
    {k:"A", text:"Attention is unevenly distributed across the diff."},
    {k:"B", text:"The two files differ in ways not visible in the diff."},
    {k:"C", text:"The model is applying different standards deliberately."},
    {k:"D", text:"The review ran twice with different settings."}
  ],
  correct:["A"],
  explain:{
    why:"Contradictory treatment of identical code within one pass is the clearest signature of attention dilution, and it is what per-file passes exist to remove.",
    distractors:{
      B:"Surrounding context can genuinely change whether a pattern is a problem, which is worth checking, but identical code treated inconsistently points at attention first.",
      C:"There is no basis for a deliberate distinction between identical code.",
      D:"A single pass produced both findings."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-s", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"What is the cost of a multi-pass architecture that a team should weigh?",
  options:[
    {k:"A", text:"More calls and more findings to consolidate."},
    {k:"B", text:"Reduced ability to detect local issues."},
    {k:"C", text:"Loss of cross-file coverage."},
    {k:"D", text:"Incompatibility with structured output."}
  ],
  correct:["A"],
  explain:{
    why:"Splitting multiplies the number of requests and produces findings that need deduplicating and ordering. That overhead is the honest trade against better attention.",
    distractors:{
      B:"Local detection improves, since each file gets a focused pass.",
      C:"Cross-file coverage is preserved by the integration pass.",
      D:"Each pass can return structured findings normally."
    }
  },
  refs:[R_PROMPT] },

{ id:"d4-4.6-t", domain:4, ts:"4.6", scenario:5, type:"single",
  stem:"When is a single review pass the right choice?",
  options:[
    {k:"A", text:"When the diff is small enough to attend to evenly."},
    {k:"B", text:"When the diff spans many unrelated modules."},
    {k:"C", text:"When cross-file consistency is the main risk."},
    {k:"D", text:"When findings must be highly consistent."}
  ],
  correct:["A"],
  explain:{
    why:"Decomposition has real overhead, and on a small diff there is no attention problem to solve, so a single pass is cheaper and simpler.",
    distractors:{
      B:"Many unrelated modules is precisely where attention spreads thin.",
      C:"Cross-file risk argues for a dedicated integration pass.",
      D:"Consistency is what a single pass over a large diff fails to deliver."
    }
  },
  refs:[R_PROMPT] },

/* ---------------- Domain 5: Context Management & Reliability ---------------- */

{ id:"d5-5.1-a", domain:5, ts:"5.1", scenario:1, type:"single",
  stem:"In long support conversations your agent summarises earlier turns to control context. By turn 20 it has lost the exact refund amount, the order date and the customer's stated expectation of a full refund, and offers a partial credit instead. What is the fix?",
  options:[
    {k:"A", text:"Extract transactional facts into a persistent case-facts block outside the summarised history."},
    {k:"B", text:"Summarise less aggressively so more of the original conversation survives."},
    {k:"C", text:"Instruct the summariser to preserve all numbers, dates and customer statements verbatim when it compresses the history."},
    {k:"D", text:"Move to a model with a larger context window so summarisation is unnecessary."}
  ],
  correct:["A"],
  explain:{
    why:"Summarisation is lossy precisely where precision matters. Keeping amounts, dates, order numbers and stated expectations in a structured block that is never summarised makes those facts immune to compression while still allowing the narrative to be condensed.",
    distractors:{
      B:"Less aggressive summarisation delays the loss without preventing it, and gives up the context savings that motivated it.",
      C:"This helps somewhat but is still a probabilistic instruction applied to every summarisation pass, so facts degrade gradually over twenty turns.",
      D:"A larger window postpones the problem to a longer conversation, and does nothing about the summarisation already in place."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d5-5.1-b", domain:5, ts:"5.1", scenario:3, type:"single",
  stem:"Your synthesis agent reliably incorporates findings from the start and end of the aggregated input but frequently omits findings from the middle. What mitigations address this directly?",
  options:[
    {k:"A", text:"Place a key-findings summary first and organise details under explicit section headers."},
    {k:"B", text:"Sort the findings by relevance so the most important come first, then truncate the tail."},
    {k:"C", text:"Reduce the total number of findings passed so everything fits comfortably."},
    {k:"D", text:"Repeat the middle findings again at the end of the input so that they also appear in a well-attended position."}
  ],
  correct:["A"],
  explain:{
    why:"This is the lost-in-the-middle effect. A summary at the front puts every key point in a reliably-attended position, and explicit section headers give the model structural anchors for locating detail in the body.",
    distractors:{
      B:"Truncation discards real findings, which is a worse failure than under-weighting them.",
      C:"Passing fewer findings loses coverage, and the position effect will still apply within whatever remains.",
      D:"Duplicating content inflates the input and creates ambiguity about whether the repeated items are distinct findings."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d5-5.1-c", domain:5, ts:"5.1", scenario:1, type:"single",
  stem:"Each `lookup_order` call returns more than 40 fields, of which about 5 matter for a return. Across a long conversation these accumulate and crowd out earlier context. What is the appropriate intervention?",
  options:[
    {k:"A", text:"Trim tool outputs to the relevant fields before they enter context."},
    {k:"B", text:"Summarise the conversation more frequently in order to reclaim the space."},
    {k:"C", text:"Call `lookup_order` less often by caching its results in the prompt."},
    {k:"D", text:"Accept the accumulation, since the extra fields might be needed later."}
  ],
  correct:["A"],
  explain:{
    why:"Tool results consume context out of all proportion to their relevance. Trimming at the point of entry, for instance in a PostToolUse hook, prevents 35 irrelevant fields per call from ever accumulating.",
    distractors:{
      B:"Summarising more often compresses the valuable conversational history to make room for irrelevant tool fields, which is precisely backwards.",
      C:"Caching in the prompt keeps the same bloated payload in context; it reduces calls, not size.",
      D:"Speculative retention is what created the problem, and the rare later need can be met with another call."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d5-5.1-d", domain:5, ts:"5.1", scenario:3, type:"single",
  stem:"Your synthesis agent has a limited context budget, and upstream agents return long prose passages with their full reasoning chains. What change helps most?",
  options:[
    {k:"A", text:"Have upstream agents return structured key facts, citations and relevance scores."},
    {k:"B", text:"Have the synthesis agent summarise each upstream output as it receives it."},
    {k:"C", text:"Truncate each upstream output to a fixed character limit before it is passed on to the synthesis agent."},
    {k:"D", text:"Pass upstream outputs one at a time so only one is in context at any moment."}
  ],
  correct:["A"],
  explain:{
    why:"Fixing this at the producer is far more efficient than at the consumer. Structured facts with citations carry the information synthesis actually needs at a fraction of the tokens, and preserve attribution as a bonus.",
    distractors:{
      B:"The verbose content must enter context before it can be summarised, so the budget is spent regardless.",
      C:"Fixed-length truncation cuts arbitrarily and will remove a conclusion as readily as filler.",
      D:"Synthesis requires seeing findings together to combine them; serialising them defeats the purpose."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d5-5.1-e", domain:5, ts:"5.1", scenario:3, type:"single",
  stem:"Downstream synthesis keeps misinterpreting subagent findings because it cannot tell when data was collected or which document a figure came from. What requirement addresses this?",
  options:[
    {k:"A", text:"Require subagents to include dates, source locations and methodological context."},
    {k:"B", text:"Require the synthesis agent to ask the coordinator whenever provenance is unclear."},
    {k:"C", text:"Require subagents to return findings in chronological order of collection."},
    {k:"D", text:"Require the coordinator to append a consolidated source list to the end of every synthesis prompt it issues."}
  ],
  correct:["A"],
  explain:{
    why:"Metadata has to travel with each finding. If it is captured at the point of collection and carried in the structured output, downstream agents can interpret and attribute correctly without asking anyone.",
    distractors:{
      B:"Round-tripping to the coordinator for provenance adds latency, and the coordinator does not have information the subagent failed to capture.",
      C:"Ordering conveys sequence, not which finding came from which source or when the data itself was collected.",
      D:"An unattached source list leaves the model to guess which source supports which claim, which is the mapping that was lost."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.1-f", domain:5, ts:"5.1", scenario:1, type:"single",
  stem:"A customer session covers three separate issues over many turns and the agent keeps conflating their order numbers and amounts. What structural change helps?",
  options:[
    {k:"A", text:"Persist structured per-issue data into a separate context layer keyed by issue."},
    {k:"B", text:"Ask the customer to confirm which issue each message refers to."},
    {k:"C", text:"Handle only one issue per conversation and open a separate new conversation for each of the others."},
    {k:"D", text:"Increase summarisation frequency so older issues are compressed away."}
  ],
  correct:["A"],
  explain:{
    why:"Keeping each issue's facts in its own structured record removes the ambiguity that causes conflation, because the agent no longer has to infer from narrative context which order number belongs to which complaint.",
    distractors:{
      B:"Pushing disambiguation onto the customer degrades the experience for a problem the system created.",
      C:"Splitting into separate conversations directly harms first-contact resolution.",
      D:"Compressing older issues loses their facts entirely, which is worse than conflating them."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d5-5.2-a", domain:5, ts:"5.2", scenario:1, type:"single",
  stem:"Your agent achieves 55% first-contact resolution against an 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to handle complex situations requiring policy exceptions itself. What is the most effective improvement?",
  options:[
    {k:"A", text:"Add explicit escalation criteria with few-shot examples of escalate versus resolve."},
    {k:"B", text:"Have the agent self-report a numeric confidence score before each response and route to humans whenever it falls below a set threshold."},
    {k:"C", text:"Deploy a separate classifier trained on historical tickets to predict which requests need escalation."},
    {k:"D", text:"Implement sentiment analysis and escalate automatically when negative sentiment exceeds a threshold."}
  ],
  correct:["A"],
  explain:{
    why:"The root cause is unclear decision boundaries, and explicit criteria plus contrastive examples address that directly. It is also the proportionate first step, before adding infrastructure.",
    distractors:{
      B:"Self-reported confidence is poorly calibrated. This agent is already confidently wrong on the hard cases, which is exactly where the score would fail.",
      C:"A trained classifier requires labelled data and ML infrastructure, and is over-engineered before prompt optimisation has been tried.",
      D:"Sentiment does not correlate with case complexity, which is the actual variable. It solves a different problem."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d5-5.2-b", domain:5, ts:"5.2", scenario:1, type:"single",
  stem:"A customer's first message reads: 'I don't want to talk to a bot. Put me through to a person.' The issue appears to be a simple address change. What should the agent do?",
  options:[
    {k:"A", text:"Escalate to a human immediately, honouring the explicit request without first attempting to investigate."},
    {k:"B", text:"Resolve the address change first, since it is simple, then offer escalation if the customer is still dissatisfied."},
    {k:"C", text:"Explain that it can handle address changes quickly and proceed unless the customer objects again."},
    {k:"D", text:"Ask the customer why they prefer a human, to determine whether escalation is warranted."}
  ],
  correct:["A"],
  explain:{
    why:"An explicit request for a human is one of the legitimate escalation triggers and should be honoured immediately. Simplicity of the underlying issue does not override a customer stating what they want.",
    distractors:{
      B:"Resolving first ignores the request that was made. The customer asked for a person before describing the issue.",
      C:"Proceeding unless they object again makes the customer refuse twice, which is precisely the friction that generates complaints.",
      D:"Interrogating a customer about their stated preference is poor service and delays a request that should simply be honoured."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d5-5.2-c", domain:5, ts:"5.2", scenario:1, type:"single",
  stem:"A customer asks you to match a competitor's lower price. Your policy document covers price adjustments on your own site within 14 days but says nothing about competitor matching. What should the agent do?",
  options:[
    {k:"A", text:"Escalate, because the policy is silent on this request and a gap requires human judgement."},
    {k:"B", text:"Decline, since anything not explicitly permitted by policy should be refused."},
    {k:"C", text:"Apply the own-site adjustment policy by analogy, since the situations are similar."},
    {k:"D", text:"Approve the match, since customer satisfaction is the overriding objective."}
  ],
  correct:["A"],
  explain:{
    why:"A policy gap is a distinct escalation trigger from case complexity. The request is simple to understand but nobody has decided whether it is permitted, and that decision is not the agent's to invent.",
    distractors:{
      B:"Defaulting to refusal turns every unaddressed situation into a rejection, and may contradict what the business would actually want.",
      C:"Reasoning by analogy from an adjacent policy is the agent making policy, which is exactly what it should not do.",
      D:"Approving without authority creates a precedent and a financial commitment the agent is not empowered to make."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d5-5.2-d", domain:5, ts:"5.2", scenario:1, type:"single",
  stem:"`get_customer` returns three accounts matching the name and partial postcode the customer supplied. What should the agent do?",
  options:[
    {k:"A", text:"Ask the customer to supply an additional identifier, such as an order number or email address."},
    {k:"B", text:"Select the account with the most recent activity, as it is most likely the active one."},
    {k:"C", text:"Select the account whose details most closely match, and note the uncertainty in the response."},
    {k:"D", text:"Escalate to a human, since ambiguous identity requires manual verification."}
  ],
  correct:["A"],
  explain:{
    why:"Multiple matches call for clarification rather than a heuristic choice. Asking for one more identifier is quick, resolves the ambiguity definitively, and avoids acting on the wrong account.",
    distractors:{
      B:"Recency is a guess. Acting on the wrong account risks exposing one customer's data or refunding another's order.",
      C:"A closest match is still a guess, and a noted caveat does not undo a refund sent to the wrong person.",
      D:"Escalation is disproportionate when a single clarifying question resolves it, and it harms first-contact resolution."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d5-5.2-e", domain:5, ts:"5.2", scenario:1, type:"single",
  stem:"A visibly frustrated customer describes a delayed order that your agent can fully resolve with a standard reshipment. They have not asked for a human. What is the appropriate response?",
  options:[
    {k:"A", text:"Acknowledge the frustration and offer the resolution, escalating only if they insist."},
    {k:"B", text:"Escalate immediately, since frustration signals the case needs human handling."},
    {k:"C", text:"Resolve the issue without acknowledging the frustration at all, on the basis that the outcome is what really matters."},
    {k:"D", text:"Ask whether they would prefer to speak to a human before doing anything else."}
  ],
  correct:["A"],
  explain:{
    why:"Frustration is not a complexity signal. When the issue is squarely within the agent's capability, acknowledging how the customer feels and then resolving it is the better outcome, with escalation held in reserve if they ask.",
    distractors:{
      B:"Escalating on sentiment sends resolvable cases to humans and is the specific anti-pattern this objective warns against.",
      C:"Ignoring evident frustration reads as tone-deaf even when the outcome is correct.",
      D:"Offering escalation unprompted invites it, adding a handoff to a case that could have been closed in one contact."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d5-5.2-f", domain:5, ts:"5.2", scenario:1, type:"multi",
  stem:"Which two are legitimate escalation triggers? (Select 2.)",
  options:[
    {k:"A", text:"The customer explicitly asks to speak with a human."},
    {k:"B", text:"The policy is silent or ambiguous on the customer's specific request."},
    {k:"C", text:"The customer's message expresses strong negative sentiment."},
    {k:"D", text:"The model's self-reported confidence for this case falls below 0.7."}
  ],
  correct:["A","B"],
  explain:{
    why:"An explicit request and a genuine policy gap are both cases where the agent should not proceed alone: one because the customer decided, the other because nobody has decided. Inability to make meaningful progress is the third legitimate trigger.",
    distractors:{
      C:"Sentiment does not track complexity. Frustrated customers frequently have simple, quickly-resolved problems.",
      D:"Self-reported confidence is poorly calibrated, and an agent that mishandles hard cases is typically confident about them."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d5-5.3-a", domain:5, ts:"5.3", scenario:3, type:"single",
  stem:"The web search subagent times out while researching a complex topic. You are designing how that failure reaches the coordinator. Which approach best enables intelligent recovery?",
  options:[
    {k:"A", text:"Return structured error context: failure type, attempted query, partial results, alternatives."},
    {k:"B", text:"Retry internally with exponential backoff and return a generic 'search unavailable' status to the coordinator once all retries are exhausted."},
    {k:"C", text:"Catch the timeout within the subagent and return an empty result set marked successful."},
    {k:"D", text:"Propagate the timeout to a top-level handler that terminates the entire research workflow."}
  ],
  correct:["A"],
  explain:{
    why:"Structured error context is what lets the coordinator decide well: retry with a narrower query, try a different source, or proceed with partial results and annotate the gap. Each option requires knowing what failed and what was already obtained.",
    distractors:{
      B:"The internal retries are fine; discarding the context is not. A generic status hides everything the coordinator would use to choose a recovery.",
      C:"Marking failure as success is the silent-suppression anti-pattern. The coordinator concludes the topic was researched and found nothing.",
      D:"Terminating the whole workflow over one subagent's timeout discards all the other completed research."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.3-b", domain:5, ts:"5.3", scenario:3, type:"single",
  stem:"Why is returning an empty result set marked successful the worst of the common error-handling choices?",
  options:[
    {k:"A", text:"It prevents any recovery from happening and silently ships incomplete research as though it were complete."},
    {k:"B", text:"It causes the coordinator to retry indefinitely, since empty results trigger automatic re-delegation."},
    {k:"C", text:"It violates the MCP protocol, which requires the `isError` flag on every response."},
    {k:"D", text:"It consumes more context than a structured error, because empty arrays still serialise."}
  ],
  correct:["A"],
  explain:{
    why:"An error reported as success removes any chance of recovery, and the resulting report claims coverage of a topic that was never actually searched. A visible failure is far safer than an invisible one.",
    distractors:{
      B:"There is no automatic re-delegation on empty results; the coordinator accepts the success and moves on, which is the problem.",
      C:"`isError` is required only on actual errors, and the protocol violation is not why this is dangerous.",
      D:"Context cost is trivial and entirely beside the point."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.3-c", domain:5, ts:"5.3", scenario:3, type:"single",
  stem:"One of six topic areas could not be researched because its sources were unavailable. The other five are well covered. How should the synthesis output handle this?",
  options:[
    {k:"A", text:"Include coverage annotations distinguishing well-supported findings from gaps."},
    {k:"B", text:"Omit the sixth topic silently, on the basis that a report should present only the findings it can properly support."},
    {k:"C", text:"Fill the sixth topic from the model's background knowledge, marked as provisional."},
    {k:"D", text:"Fail the report and re-run the entire research pipeline from the start."}
  ],
  correct:["A"],
  explain:{
    why:"An explicit coverage annotation is honest and actionable: the reader knows which conclusions rest on evidence and which area remains open, and can decide whether the gap matters.",
    distractors:{
      B:"Silent omission misleads the reader into thinking the report is comprehensive, which is the failure mode the annotation exists to prevent.",
      C:"Background knowledge produces unsourced claims in a report whose value is that it is cited, and 'provisional' is easily lost downstream.",
      D:"Re-running everything discards five well-researched areas to retry one whose sources may still be unavailable."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.3-d", domain:5, ts:"5.3", scenario:3, type:"single",
  stem:"A subagent encounters a transient rate limit, backs off, retries and succeeds. Separately it hits a permission error it cannot resolve. What should it propagate?",
  options:[
    {k:"A", text:"Only the permission error, with what was attempted and any partial results."},
    {k:"B", text:"Both errors, so the coordinator has a complete picture of everything that went wrong."},
    {k:"C", text:"Neither, returning only the data it managed to gather."},
    {k:"D", text:"Only the rate limit, since transient failures indicate systemic problems the coordinator should know about."}
  ],
  correct:["A"],
  explain:{
    why:"The principle is local recovery for what can be resolved, propagation for what cannot. The rate limit was handled and needs no coordinator decision; the permission error blocks work and does.",
    distractors:{
      B:"Reporting the resolved rate limit adds noise to the coordinator's context and may trigger unnecessary recovery for something already fixed.",
      C:"Suppressing the permission error hides a genuine gap, so the coordinator believes coverage is complete.",
      D:"This is inverted: the transient error was resolved, and the unresolved permission error is the one requiring a decision."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.3-e", domain:5, ts:"5.3", scenario:3, type:"single",
  stem:"A coordinator receives 'search unavailable' from a subagent. Which recovery decision can it NOT make on that information alone?",
  options:[
    {k:"A", text:"Whether to retry with a narrower query, the query being unknown."},
    {k:"B", text:"Whether to log the failure for later analysis."},
    {k:"C", text:"Whether to mark the overall run as degraded."},
    {k:"D", text:"Whether to notify a human operator that one of the subagents has failed during the run."}
  ],
  correct:["A"],
  explain:{
    why:"An intelligent retry needs to know what was tried, why it failed and what if anything came back. A bare status supports only crude reactions, which is exactly why structured error context matters.",
    distractors:{
      B:"Logging requires only that something failed, which the status does convey.",
      C:"Marking the run degraded is a coarse decision the status supports.",
      D:"Notifying an operator likewise needs only the fact of failure."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.3-f", domain:5, ts:"5.3", scenario:3, type:"single",
  stem:"A subagent's query executes successfully against the source repository and matches zero documents. How should this be reported?",
  options:[
    {k:"A", text:"As a successful result containing zero matches, distinguished from an access failure."},
    {k:"B", text:"As an error, since returning nothing means the subagent did not fulfil its task."},
    {k:"C", text:"As a transient failure, so that the coordinator retries the query in case the search index was mid-update."},
    {k:"D", text:"As a partial result, leaving the coordinator to decide whether it was a failure."}
  ],
  correct:["A"],
  explain:{
    why:"A query that ran correctly and matched nothing is a valid, informative answer: there is no evidence in that source. Reporting it as success with zero matches is what lets the coordinator distinguish it from 'we could not look'.",
    distractors:{
      B:"The subagent did its job. Calling a genuine null result an error triggers pointless recovery for a query that will keep returning nothing.",
      C:"Speculating about an index update turns a definitive answer into wasted retries.",
      D:"'Partial' implies something was retrieved and something was not, which misrepresents a complete query with an empty result."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d5-5.4-a", domain:5, ts:"5.4", scenario:4, type:"single",
  stem:"Three hours into exploring a large codebase, the agent starts giving inconsistent answers and referring to 'typical repository patterns' rather than the specific classes it identified earlier. What is happening and what helps?",
  options:[
    {k:"A", text:"Context degradation; have the agent keep a scratchpad file and consult it later."},
    {k:"B", text:"The model is fatigued by the long session; restarting it with the same approach will restore the earlier accuracy."},
    {k:"C", text:"The repository changed during the session; re-read every file to refresh the analysis."},
    {k:"D", text:"The temperature setting has drifted upward over the session; reset it to a lower value."}
  ],
  correct:["A"],
  explain:{
    why:"Referring to typical patterns rather than specific discovered classes is the signature of findings having fallen out of context. A scratchpad on disk persists them independently of the context window, and can be consulted whenever needed.",
    distractors:{
      B:"Models do not fatigue, and restarting with the same approach reproduces the same degradation a few hours later.",
      C:"Nothing suggests the code changed, and re-reading everything would consume the context that is already under pressure.",
      D:"Temperature does not drift during a session; it is whatever each request specifies."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d5-5.4-b", domain:5, ts:"5.4", scenario:4, type:"single",
  stem:"You need to answer 'where are all the test files?' and 'what does the refund flow depend on?' while keeping the main agent focused on high-level architecture. What is the right structure?",
  options:[
    {k:"A", text:"Spawn a subagent per question, so only the answers return to the main context."},
    {k:"B", text:"Have the main agent answer both directly, then run `/compact` afterwards."},
    {k:"C", text:"Answer both questions in a separate session and paste the results back into the main conversation."},
    {k:"D", text:"Defer both questions until the architectural work is complete."}
  ],
  correct:["A"],
  explain:{
