  stem:"A search subagent hits a transient network error, retries twice with backoff, and succeeds on the third attempt. What should it report to the coordinator?",
  options:[
    {k:"A", text:"The successful results, having resolved the transient failure locally without escalating it."},
    {k:"B", text:"The results plus a full log of both failed attempts, so the coordinator has complete visibility."},
    {k:"C", text:"A structured error describing the two failures, since the coordinator owns all error handling."},
    {k:"D", text:"Nothing until the coordinator asks, to avoid unsolicited status messages."}
  ],
  correct:["A"],
  explain:{
    why:"Subagents should recover locally from transient failures and propagate only what they cannot resolve. The failure was handled, the data is complete, and burdening the coordinator with resolved noise is exactly what local recovery is meant to prevent.",
    distractors:{
      B:"Detailed logs of resolved retries consume coordinator context to no decision-making purpose. Observability of this belongs in telemetry, not in the agent's context window.",
      C:"There is no error to report. The operation succeeded, and reporting an error would trigger unnecessary coordinator recovery.",
      D:"Withholding completed results stalls the pipeline; the coordinator is waiting on this."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.3-a", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"Your synthesis agent needs to verify claims while combining findings. Currently it returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis. This adds 2-3 round trips per task and 40% latency. Evaluation shows 85% of verifications are simple fact-checks (dates, names, statistics) and 15% need deeper investigation. What is the most effective approach?",
  options:[
    {k:"A", text:"Give the synthesis agent a scoped `verify_fact` tool, routing complex cases via the coordinator."},
    {k:"B", text:"Have the synthesis agent accumulate all verification needs and return them as one batch to the coordinator at the end of its pass."},
    {k:"C", text:"Give the synthesis agent access to all web search tools so it can handle any verification directly."},
    {k:"D", text:"Have the web search agent proactively cache extra context around each source, anticipating what synthesis might need."}
  ],
  correct:["A"],
  explain:{
    why:"This applies least privilege precisely: the synthesis agent gets exactly the capability the 85% case needs, and the existing coordination path is preserved for the 15% that genuinely needs investigation.",
    distractors:{
      B:"Batching creates blocking dependencies, because later synthesis steps often depend on facts verified earlier. You cannot defer a verification whose answer changes what you write next.",
      C:"Handing over the full search toolset over-provisions the agent and breaks separation of concerns; a synthesis agent with search tools starts doing research instead of synthesising.",
      D:"Speculative caching cannot reliably predict which claims will need checking, so it fetches a great deal that is never used and still misses what is."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.3-b", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"An agent that previously had 4 tools now has 18 after a merge of several capability sets. Tool selection accuracy has dropped noticeably. What principle explains this?",
  options:[
    {k:"A", text:"Selection reliability degrades as the tool set grows and decision complexity increases."},
    {k:"B", text:"Tool definitions beyond the first ten are truncated from the request payload."},
    {k:"C", text:"Larger tool sets require proportionally larger context windows, and the available context window has now been exhausted by them."},
    {k:"D", text:"Tools added after initialisation are not indexed for selection until the session restarts."}
  ],
  correct:["A"],
  explain:{
    why:"Choosing correctly among 18 options is a harder discrimination problem than choosing among 4, particularly when several have adjacent purposes. Scoping each agent to the tools its role actually needs is the standard remedy.",
    distractors:{
      B:"Tool definitions are not silently truncated. All of them are sent.",
      C:"Eighteen tool definitions are small relative to a context window; this is a discrimination problem, not a capacity one.",
      D:"There is no such indexing delay; tools are available once configured and discovered."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.3-c", domain:2, ts:"2.3", scenario:6, type:"single",
  stem:"You have several extraction schemas and do not know which document type will arrive. You need the model to always produce structured output rather than conversational text. Which `tool_choice` setting fits?",
  options:[
    {k:"A", text:"`\"any\"`, which requires a tool call but lets the model choose which schema fits."},
    {k:"B", text:"`\"auto\"`, which lets the model decide whether a tool call is warranted."},
    {k:"C", text:"`{\"type\":\"tool\",\"name\":\"extract_invoice\"}`, forcing the most common schema on every document."},
    {k:"D", text:"`\"none\"`, which returns plain text that you then parse into the appropriate schema yourself."}
  ],
  correct:["A"],
  explain:{
    why:"`any` guarantees a tool call, so you always get schema-conformant structured output, while leaving the choice of which extraction schema to the model, which is what you want when the document type is unknown.",
    distractors:{
      B:"`auto` permits a plain text response, which is exactly the outcome you are trying to eliminate.",
      C:"Forcing one named schema misclassifies every document that is not that type, and forcing an invoice schema onto a contract produces garbage.",
      D:"`none` forbids tool calls entirely, returning you to parsing free text, which is the problem structured output solves."
    }
  },
  refs:[{label:"API: Tool use overview", url:"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}] },

{ id:"d2-2.3-d", domain:2, ts:"2.3", scenario:6, type:"single",
  stem:"Your pipeline must always run `extract_metadata` before any enrichment tool. Which `tool_choice` configuration guarantees the first call is that tool?",
  options:[
    {k:"A", text:"`{\"type\":\"tool\",\"name\":\"extract_metadata\"}` on the first request, then a looser setting on follow-up turns."},
    {k:"B", text:"`\"any\"` on the first request, since it forces a tool call and metadata extraction is the obvious first step."},
    {k:"C", text:"`\"auto\"` with a system prompt instruction that metadata extraction must always come first."},
    {k:"D", text:"Listing `extract_metadata` first in the tools array, since the model calls tools in declaration order."}
  ],
  correct:["A"],
  explain:{
    why:"Forced tool selection names the exact tool the model must call, which is the only configuration that guarantees a specific tool runs first. Subsequent steps then proceed in follow-up turns with a less restrictive setting.",
    distractors:{
      B:"`any` guarantees some tool is called but not which one, so an enrichment tool could still run first.",
      C:"This is prompt-based guidance for something that needs a guarantee, and carries the usual non-zero failure rate.",
      D:"Declaration order does not determine call order. The model chooses based on the task and descriptions."
    }
  },
  refs:[{label:"API: Tool use overview", url:"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}] },

{ id:"d2-2.3-e", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"A document-analysis subagent has a general-purpose `fetch_url` tool and has begun pulling in blog posts and forum threads alongside the peer-reviewed sources it was meant to analyse. What is the cleanest correction?",
  options:[
    {k:"A", text:"Replace `fetch_url` with a constrained `load_document`."},
    {k:"B", text:"Add a system prompt rule listing domains the subagent is not allowed to fetch from."},
    {k:"C", text:"Keep `fetch_url` and filter low-quality sources out of the synthesis step instead."},
    {k:"D", text:"Remove the tool entirely and have the coordinator fetch every document on the subagent's behalf."}
  ],
  correct:["A"],
  explain:{
    why:"Replacing an over-broad tool with a constrained one that validates its input enforces the boundary at the point of use. The subagent keeps the capability it needs and structurally cannot reach beyond its remit.",
    distractors:{
      B:"A denylist is unbounded and always incomplete; the next unlisted forum passes straight through.",
      C:"Filtering downstream means you have already paid to fetch and analyse material you will discard, and low-quality sources may still influence the analysis.",
      D:"Routing every fetch through the coordinator adds a round trip to a high-frequency operation the subagent legitimately needs."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.3-f", domain:2, ts:"2.3", scenario:2, type:"single",
  stem:"Which `tool_choice` value allows the model to respond with plain text instead of calling a tool?",
  options:[
    {k:"A", text:"`\"auto\"`"},
    {k:"B", text:"`\"any\"`"},
    {k:"C", text:"`{\"type\":\"tool\",\"name\":\"...\"}`"},
    {k:"D", text:"All three permit a plain text response."}
  ],
  correct:["A"],
  explain:{
    why:"`auto` leaves the decision to the model, so it may answer conversationally when it judges no tool is needed. That flexibility is useful in chat, and a liability when you require structured output.",
    distractors:{
      B:"`any` requires that some tool be called, so a plain text response is not an option.",
      C:"Forced selection requires that specific tool be called; text-only is not permitted.",
      D:"Only `auto` permits it, which is the distinction the question turns on."
    }
  },
  refs:[{label:"API: Tool use overview", url:"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}] },

{ id:"d2-2.4-a", domain:2, ts:"2.4", scenario:4, type:"single",
  stem:"Your team needs a shared MCP server available to everyone who clones the repository, authenticating with a token that must not be committed. How should you configure it?",
  options:[
    {k:"A", text:"In project-scoped `.mcp.json`, referencing the token as `${GITHUB_TOKEN}` via expansion."},
    {k:"B", text:"In each developer's `~/.claude.json`, with the token pasted in directly, since that file is never committed to the repository."},
    {k:"C", text:"In project-scoped `.mcp.json` with the token inline, adding `.mcp.json` to `.gitignore`."},
    {k:"D", text:"In a `.env` file at the repository root, which Claude Code reads automatically for MCP configuration."}
  ],
  correct:["A"],
  explain:{
    why:"Project scope in `.mcp.json` is what shares a server with the team through version control, and environment variable expansion keeps the secret out of the committed file. `${VAR}` and `${VAR:-default}` are both supported.",
    distractors:{
      B:"Per-developer configuration is not shared, so every new team member must set the server up by hand, and the token still sits in plaintext.",
      C:"Gitignoring `.mcp.json` defeats its purpose entirely; the file exists to be committed so the team gets the same tools.",
      D:"A `.env` file at the repository root is not a Claude Code MCP configuration mechanism."
    }
  },
  refs:[{label:"Claude Code: MCP", url:"https://code.claude.com/docs/en/mcp"}] },

{ id:"d2-2.4-b", domain:2, ts:"2.4", scenario:4, type:"single",
  stem:"A developer wants to try an experimental MCP server on their own machine without affecting teammates. Where should it go?",
  options:[
    {k:"A", text:"In their own user configuration in `~/.claude.json`, which is private to them."},
    {k:"B", text:"In the project's `.mcp.json`, with a comment marking it as experimental."},
    {k:"C", text:"In `.claude/settings.json`, which is the designated location for personal and experimental MCP server definitions."},
    {k:"D", text:"In the project's `CLAUDE.md`, documented as an optional server teammates may skip."}
  ],
  correct:["A"],
  explain:{
    why:"Personal and experimental servers belong in the developer's own configuration, which is private and not distributed to the team.",
    distractors:{
      B:"Anything in `.mcp.json` is committed and reaches everyone, and JSON has no comment syntax anyway.",
      C:"`.claude/settings.json` is for project settings, not personal MCP server definitions, and it is typically committed.",
      D:"CLAUDE.md is instructional context. It does not configure servers."
    }
  },
  note:"The exam frames this as project versus user scope. Current Claude Code documents three scopes, and the default for a personal server added with `claude mcp add` is actually **local** scope, stored per-project inside `~/.claude.json`. **User** scope, also in `~/.claude.json`, makes it available across all your projects. Both are private to you, which is the distinction being tested.",
  refs:[{label:"Claude Code: MCP", url:"https://code.claude.com/docs/en/mcp"}] },

{ id:"d2-2.4-c", domain:2, ts:"2.4", scenario:4, type:"single",
  stem:"Your agent burns many tool calls exploring which issues exist in a tracker before it can act on any of them. What MCP capability reduces this exploratory overhead?",
  options:[
    {k:"A", text:"MCP resources, which expose a content catalogue of what is available."},
    {k:"B", text:"MCP prompts, which pre-fill the agent's system prompt with the current issue list each time it connects."},
    {k:"C", text:"Increasing `MAX_MCP_OUTPUT_TOKENS` so each exploratory call returns more per request."},
    {k:"D", text:"Caching tool results locally so repeated exploration of the same tracker is free."}
  ],
  correct:["A"],
  explain:{
    why:"Resources are designed to expose content catalogues, such as issue summaries, documentation hierarchies or database schemas, giving the agent visibility into what exists without a sequence of discovery calls.",
    distractors:{
      B:"MCP prompts are reusable prompt templates, not a mechanism for injecting a live data catalogue.",
      C:"Raising the output cap makes each exploratory call larger, which consumes more context rather than removing the exploration.",
      D:"Caching helps on repeats within the same data, but the first exploration still costs full price and stale caches introduce their own problems."
    }
  },
  refs:[{label:"Claude Code: MCP", url:"https://code.claude.com/docs/en/mcp"}] },

{ id:"d2-2.4-d", domain:2, ts:"2.4", scenario:3, type:"single",
  stem:"You need Jira integration for your agent. A well-maintained community MCP server for Jira exists. What is the recommended approach?",
  options:[
    {k:"A", text:"Use the existing community server, reserving custom builds for team-specific workflows."},
    {k:"B", text:"Build a custom server, since community servers cannot be trusted with production credentials."},
    {k:"C", text:"Build a custom server, since community tool descriptions are never detailed enough for reliable selection."},
    {k:"D", text:"Use the community server but wrap every one of its tools in your own proxy tools with your own descriptions."}
  ],
  correct:["A"],
  explain:{
    why:"For standard integrations, an existing server is the pragmatic choice. Custom effort is better spent on workflows specific to your team, which no community server will cover.",
    distractors:{
      B:"Credential handling is a matter of review and configuration, not a reason to rebuild every standard integration from scratch.",
      C:"If a description is thin you can improve how the tool is presented; that does not justify reimplementing the whole server.",
      D:"A full proxy layer is most of the work of a custom server, with an extra indirection to maintain on top."
    }
  },
  refs:[{label:"Claude Code: MCP", url:"https://code.claude.com/docs/en/mcp"}] },

{ id:"d2-2.4-e", domain:2, ts:"2.4", scenario:2, type:"single",
  stem:"You have three MCP servers configured across different scopes. When are their tools available to the agent?",
  options:[
    {k:"A", text:"Tools from all of the configured servers are discovered at connection time and are available at once."},
    {k:"B", text:"Only the highest-precedence scope's servers connect; the others are ignored."},
    {k:"C", text:"Servers connect lazily, one at a time, when the agent first requests a tool whose name matches that server."},
    {k:"D", text:"Only servers explicitly enabled in the current session's settings connect."}
  ],
  correct:["A"],
  explain:{
    why:"Configured servers connect and their tools are discovered at connection time, so the agent sees the full combined tool set at once. This is also why over-provisioning servers degrades tool selection.",
    distractors:{
      B:"Scope precedence resolves duplicate server names; it does not suppress servers from other scopes.",
      C:"Discovery happens at connection, not on demand by name.",
      D:"Configured servers connect by default; project-scoped ones require a one-time approval, not per-session enabling."
    }
  },
  refs:[{label:"Claude Code: MCP", url:"https://code.claude.com/docs/en/mcp"}] },

{ id:"d2-2.4-f", domain:2, ts:"2.4", scenario:4, type:"single",
  stem:"In `.mcp.json`, you write `\"url\": \"${API_BASE_URL}/mcp\"` but `API_BASE_URL` is not set on a teammate's machine. What happens, and what is the better practice?",
  options:[
    {k:"A", text:"It still loads with a missing-variable warning and the literal text unexpanded; add a fallback."},
    {k:"B", text:"Claude Code refuses to start until the variable is set, which is the intended forcing function."},
    {k:"C", text:"The variable expands to an empty string silently, producing a relative URL that resolves against the project root instead of the intended remote host."},
    {k:"D", text:"Environment variable expansion is not supported in the `url` field, only in `env`, so the server is skipped."}
  ],
  correct:["A"],
  explain:{
    why:"An unset variable with no default leaves the placeholder text in place and surfaces a warning rather than failing hard. The `${VAR:-default}` form gives a sensible fallback so the server starts with the value you intended.",
    distractors:{
      B:"Claude Code does not refuse to start; it warns and carries on.",
      C:"It does not expand to empty. The unexpanded `${VAR}` text is used as-is.",
      D:"Expansion is supported in `url`, `command`, `args`, `env` and `headers`."
    }
  },
  refs:[{label:"Claude Code: MCP", url:"https://code.claude.com/docs/en/mcp"}] },

{ id:"d2-2.5-a", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"You need to find every call site of a function named `calculateTax` across an unfamiliar TypeScript repository. Which built-in tool is the right starting point?",
  options:[
    {k:"A", text:"Grep, which searches file contents for the pattern."},
    {k:"B", text:"Glob, which matches file paths against a supplied pattern."},
    {k:"C", text:"Read, applied to each file in the repository in turn."},
    {k:"D", text:"Bash, running a recursive directory listing to locate candidate files."}
  ],
  correct:["A"],
  explain:{
    why:"The target is content: an identifier appearing inside files. Grep searches file contents, which is exactly the operation needed to locate callers.",
    distractors:{
      B:"Glob matches filenames and paths. It cannot see inside a file, and the function name has no relationship to the filenames.",
      C:"Reading every file exhausts context and is enormously slower than a content search.",
      D:"A directory listing enumerates paths, not contents, so it does not answer the question either."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.5-b", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"You want to locate every React test file in a codebase where tests sit beside the components they cover. Which tool and pattern?",
  options:[
    {k:"A", text:"Glob with the pattern `**/*.test.tsx`, which matches at any directory depth."},
    {k:"B", text:"Grep for the string `describe(` across the repository."},
    {k:"C", text:"Glob with `tests/**/*`, since test files live in a tests directory."},
    {k:"D", text:"Read on the project configuration to find the configured test directory."}
  ],
  correct:["A"],
  explain:{
    why:"This is a filename pattern problem, which is what Glob is for, and `**/*.test.tsx` matches the naming convention at any depth regardless of which component directory a test sits in.",
    distractors:{
      B:"Searching for `describe(` finds files containing that call, which will include helpers and miss tests using other structures. Filename matching is both more precise and cheaper here.",
      C:"The premise states tests sit beside their components, so a `tests/` directory pattern matches almost nothing.",
      D:"Configuration may name a pattern, but reading it is an extra step that still leaves you needing Glob to enumerate the matches."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.5-c", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"An Edit call fails because the anchor text appears four times in the file. What is the reliable fallback?",
  options:[
    {k:"A", text:"Read the full file, then Write it back with the modification applied."},
    {k:"B", text:"Retry the same Edit; the failure is usually a transient matching issue."},
    {k:"C", text:"Use Bash with `sed -i` to perform the replacement on the first occurrence."},
    {k:"D", text:"Delete the file and Write a fresh version from memory of its contents."}
  ],
  correct:["A"],
  explain:{
    why:"Edit relies on a unique text match. When uniqueness cannot be achieved, Read followed by Write is the documented fallback: you have the exact current contents and write back exactly what you intend.",
    distractors:{
      B:"The failure is deterministic. The anchor is still ambiguous on retry.",
      C:"Editing the first occurrence blindly is likely to change the wrong one of the four, and sidesteps the tooling's safety.",
      D:"Writing from memory rather than from an actual Read risks losing content that was never in context."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.5-d", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"An agent asked to understand how authentication works in a 4,000-file repository begins by reading every file under `src/`. It exhausts its context before reaching any conclusion. What is the correct strategy?",
  options:[
    {k:"A", text:"Grep for entry points, then Read selectively to follow imports and trace the flow."},
    {k:"B", text:"Read all of the files but summarise each one to a single line before moving on to the next."},
    {k:"C", text:"Read the files in alphabetical order and stop as soon as the context window reaches 80% of capacity."},
    {k:"D", text:"Request a larger context window model and repeat the same exhaustive read."}
  ],
  correct:["A"],
  explain:{
    why:"Understanding is built incrementally. Grep locates the entry points, then targeted reads follow the actual import chain, so only files on the relevant path enter context.",
    distractors:{
      B:"Reading everything still costs the full read, and summarising as you go loses the detail you will need when tracing a specific flow.",
      C:"Alphabetical order has no relationship to relevance, so you fill context with whatever happens to sort first.",
      D:"A bigger window postpones exhaustion without making the approach any less wasteful, and dilutes attention across thousands of irrelevant files."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d2-2.5-e", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"A utility is re-exported through several wrapper modules, so searching for its original name finds only the definition. How should you trace its real usage?",
  options:[
    {k:"A", text:"First identify all the names it is re-exported under, then search for each one."},
    {k:"B", text:"Search for the original name with a case-insensitive flag to catch any renamed or re-cased variants of it."},
    {k:"C", text:"Read every file that imports from the wrapper module's directory."},
    {k:"D", text:"Search for the file path of the original definition, since imports reference paths."}
  ],
  correct:["A"],
  explain:{
    why:"Re-exports rename the binding, so callers reference a name the original search never looked for. Enumerating the export names first and then searching for each one follows the actual chain.",
    distractors:{
      B:"Case-insensitivity catches capitalisation differences, not genuinely different identifiers introduced by a re-export.",
      C:"Importing from that directory does not imply using this particular utility, so this both over-matches and misses transitive re-exports.",
      D:"Callers typically import from the wrapper's path, not the original definition's, so path search misses exactly the usages you want."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d2-2.5-f", domain:2, ts:"2.5", scenario:4, type:"multi",
  stem:"Which two statements about the built-in file tools are correct? (Select 2.)",
  options:[
    {k:"A", text:"Grep searches file contents; Glob matches file paths."},
    {k:"B", text:"Edit requires a unique text match to locate the change site."},
    {k:"C", text:"Glob searches file contents when given a regular expression."},
    {k:"D", text:"Write requires that the target file already exist."}
  ],
  correct:["A","B"],
  explain:{
    why:"These are the core distinctions. Grep is a content search and Glob is a path matcher, and Edit anchors on text that must be unique within the file or the operation fails.",
    distractors:{
      C:"Glob only ever matches paths. It has no visibility into file contents whatever pattern you give it.",
      D:"Write creates a new file when none exists; that is how new files get made."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

/* ---- Domain 2 expansion: task statements 2.1 and 2.2 ---- */

{ id:"d2-2.1-g", domain:2, ts:"2.1", scenario:1, type:"single",
  stem:"Your `refund_order` description reads 'Issues a refund for an order.' The agent calls it for exchanges, store credit and partial adjustments. What should the description add?",
  options:[
    {k:"A", text:"The boundary: what it does not cover, and which tool handles those cases."},
    {k:"B", text:"A worked example showing the exact JSON payload the tool expects."},
    {k:"C", text:"The average latency and the backend service it calls."},
    {k:"D", text:"A warning that misuse may result in incorrect financial transactions."}
  ],
  correct:["A"],
  explain:{
    why:"The agent is reaching for this tool because nothing tells it where the tool stops. Naming the excluded cases and where they belong turns an open-ended description into a decision boundary.",
    distractors:{
      B:"A payload example helps the agent call the tool correctly once chosen, but the failure here is choosing it at all.",
      C:"Latency and backend details are operational trivia that consume description tokens without informing the choice.",
      D:"A severity warning may make the agent hesitate, but hesitation is not the same as knowing which alternative to use."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-h", domain:2, ts:"2.1", scenario:3, type:"single",
  stem:"Two tools, `search_code` and `find_symbol`, both search a repository. The agent picks between them at roughly chance. Their descriptions are each one sentence and accurate. What is the most likely remaining problem?",
  options:[
    {k:"A", text:"Neither description says when to prefer it over the other."},
    {k:"B", text:"The two tool names are too similar and should be renamed."},
    {k:"C", text:"Two search tools is inherently ambiguous and one should be removed."},
    {k:"D", text:"The descriptions are too short to be parsed reliably."}
  ],
  correct:["A"],
  explain:{
    why:"Accuracy is not the same as differentiation. Both descriptions can be true while leaving the model no basis for choosing, which is what an explicit comparison against the named alternative supplies.",
    distractors:{
      B:"Renaming helps when names actively mislead, but these names are already distinct and reasonably descriptive.",
      C:"Two search tools with genuinely different behaviour is a sound design; the problem is that the difference is not written down.",
      D:"Length is not the issue. A single well-aimed sentence naming the boundary would resolve it."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-i", domain:2, ts:"2.1", scenario:3, type:"single",
  stem:"A `fetch_source` tool accepts URLs, local paths and document IDs. Its description lists all three. The agent frequently passes the wrong kind of identifier. What would help most?",
  options:[
    {k:"A", text:"Splitting it into separate tools, one per identifier kind."},
    {k:"B", text:"Adding a `type` parameter the agent must set alongside the identifier."},
    {k:"C", text:"Accepting all three and detecting the kind inside the tool."},
    {k:"D", text:"Listing the three forms in the description with example values for each."}
  ],
  correct:["A"],
  explain:{
    why:"One tool covering three input kinds forces the agent to make a classification decision on every call. Separate tools move that decision into tool selection, where the description can make it explicit.",
    distractors:{
      D:"Examples do reduce the error rate and are worth adding, but the agent still has to classify correctly on every call rather than being guided by the choice of tool.",
      B:"A `type` parameter relocates the same classification into an argument the agent may also get wrong.",
      C:"Silent detection hides errors rather than preventing them, and an ambiguous identifier will be resolved the wrong way without anyone noticing."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-j", domain:2, ts:"2.1", scenario:6, type:"single",
  stem:"An extraction agent has `parse_invoice` and `parse_receipt`. Documents that are arguably either are routed inconsistently. What is the most useful addition to the descriptions?",
  options:[
    {k:"A", text:"A rule for the ambiguous case, stating which tool wins and why."},
    {k:"B", text:"A statement noting that the two tools have overlapping applicability."},
    {k:"C", text:"An instruction to try one and fall back to the other on failure."},
    {k:"D", text:"A confidence threshold below which the agent should not call either."}
  ],
  correct:["A"],
  explain:{
    why:"Genuine ambiguity in the domain does not go away, so the description has to decide it. A stated tie-break makes routing deterministic for exactly the documents that were varying.",
    distractors:{
      B:"Acknowledging overlap describes the problem to the model without resolving it.",
      C:"Try-and-fall-back doubles cost on ambiguous documents and relies on the first attempt failing loudly, which parsing often does not.",
      D:"An abstention threshold sends genuinely processable documents to a human and leaves the routing rule undefined."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-k", domain:2, ts:"2.1", scenario:1, type:"single",
  stem:"After rewriting tool descriptions, selection improves from 60% to 85% but plateaus. The remaining errors all involve one tool whose description is thorough. What should you examine next?",
  options:[
    {k:"A", text:"The system prompt, for wording that pulls the agent toward that tool."},
    {k:"B", text:"The tool's input schema, which may be rejecting valid calls."},
    {k:"C", text:"The order of tools in the request payload."},
    {k:"D", text:"The model temperature, which may be too high for consistent selection."}
  ],
  correct:["A"],
  explain:{
    why:"Descriptions are the primary signal but not the only one. A system prompt instruction that mentions the same concept can create an association strong enough to override a well-written description.",
    distractors:{
      B:"Schema rejections surface as tool errors after selection, not as the wrong tool being chosen.",
      C:"Ordering within the tools array is not a reliable selection mechanism and is unlikely to explain a concentrated pattern.",
      D:"Temperature adds variance across the board rather than a bias toward one particular tool."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-l", domain:2, ts:"2.1", scenario:1, type:"single",
  stem:"Which description would most reliably steer an agent away from a tool it should not use for a given request?",
  options:[
    {k:"A", text:"'Use for X. Do not use for Y; use `tool_y` instead.'"},
    {k:"B", text:"'Use for X. This tool is not suitable for all cases.'"},
    {k:"C", text:"'Handles X requests efficiently and accurately.'"},
    {k:"D", text:"'Use for X. Consider whether another tool may be more appropriate.'"}
  ],
  correct:["A"],
  explain:{
    why:"An explicit exclusion paired with the named alternative gives the model somewhere to go. It converts 'not this' into 'that', which is what makes the redirection actually happen.",
    distractors:{
      D:"Inviting consideration is better than silence, but it leaves the alternative unnamed and the decision unresolved.",
      B:"An unspecified unsuitability tells the model a boundary exists without saying where it is.",
      C:"Praise for the tool's qualities adds no boundary at all and may make over-selection more likely."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-m", domain:2, ts:"2.1", scenario:3, type:"single",
  stem:"A team writes 400-word descriptions for each of their 12 tools, covering history, implementation notes and edge cases. Selection accuracy does not improve and token cost rises sharply. What went wrong?",
  options:[
    {k:"A", text:"Length was added without adding discriminating information."},
    {k:"B", text:"Descriptions over 200 words are truncated before reaching the model."},
    {k:"C", text:"Twelve tools is beyond the point where descriptions have any effect."},
    {k:"D", text:"Implementation notes are not permitted in tool descriptions."}
  ],
  correct:["A"],
  explain:{
    why:"What improves selection is information that distinguishes this tool from its neighbours. History and implementation notes are true but shared or irrelevant, so they cost tokens on every request and change nothing.",
    distractors:{
      B:"Descriptions are not truncated at a word count; the whole text is sent.",
      C:"Twelve tools is a size where good descriptions still help considerably, though selection does get harder as the set grows.",
      D:"Nothing forbids implementation notes; they are simply the wrong content for the job."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-n", domain:2, ts:"2.1", scenario:1, type:"single",
  stem:"Your `escalate_to_human` tool is described as 'Escalates the conversation to a human agent.' The agent calls it whenever a customer sounds annoyed. Which change addresses this most directly?",
  options:[
    {k:"A", text:"State the conditions that warrant escalation, and that sentiment is not one."},
    {k:"B", text:"Add a required `reason` parameter the agent must fill in."},
    {k:"C", text:"Rename the tool to `escalate_policy_exception`."},
    {k:"D", text:"Remove the tool and have the coordinator decide escalation centrally."}
  ],
  correct:["A"],
  explain:{
    why:"The description says what the tool does but nothing about when it applies, so the agent supplies its own criterion. Naming the legitimate triggers and ruling out sentiment corrects it at the point of decision.",
    distractors:{
      B:"A reason field records the justification without constraining it, so the agent writes 'customer frustrated' and proceeds.",
      C:"A narrower name helps, but it also implies policy exceptions are the only trigger, which excludes a direct customer request.",
      D:"Centralising the decision is a defensible architecture, but it is a large change to fix a description that never stated its criteria."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-o", domain:2, ts:"2.1", scenario:6, type:"multi",
  stem:"Which two changes are most likely to improve selection between two similar extraction tools? (Select 2.)",
  options:[
    {k:"A", text:"Naming, in each description, the case that belongs to the other tool."},
    {k:"B", text:"Adding two or three example inputs to each description."},
    {k:"C", text:"Increasing the number of tools so each is narrower."},
    {k:"D", text:"Making both tools return an identical output schema."}
  ],
  correct:["A","B"],
  explain:{
    why:"Both give the model a basis for discriminating: an explicit boundary tells it where one tool ends, and concrete examples let it match a real request against the intended use.",
    distractors:{
      C:"More tools makes the overall selection problem harder, even if each individual tool is easier to describe.",
      D:"A shared output schema simplifies downstream handling but removes a cue that helped distinguish the tools."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-p", domain:2, ts:"2.1", scenario:4, type:"single",
  stem:"An MCP tool `semantic_search` is well described and genuinely better than Grep for the task, but the agent still reaches for Grep. Descriptions have been checked. What else should you consider?",
  options:[
    {k:"A", text:"Whether the description says what it does that Grep cannot."},
    {k:"B", text:"Whether MCP tools are given a lower selection priority than the built-in tools."},
    {k:"C", text:"Whether Grep should be removed from this agent's tool set."},
    {k:"D", text:"Whether the MCP server is connected at the time of selection."}
  ],
  correct:["A"],
  explain:{
    why:"A description can be thorough about the tool in isolation and still not explain why it beats the familiar alternative. The comparison is what changes the choice.",
    distractors:{
      C:"Removing Grep would force the issue, but it is a blunt fix that also removes a tool with legitimate uses.",
      B:"There is no built-in priority ordering; both are candidates on the same footing.",
      D:"A disconnected server would mean the tool was absent entirely rather than passed over."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.1-q", domain:2, ts:"2.1", scenario:3, type:"single",
  stem:"A tool's description promises 'returns relevant excerpts', but it actually returns whole documents. Agents built on it consistently overrun their context. Where is the defect?",
  options:[
    {k:"A", text:"In the description, which misstates what the tool returns."},
    {k:"B", text:"In the agent, which should trim results after receiving them."},
    {k:"C", text:"In the context window, which should be enlarged to accommodate the output."},
    {k:"D", text:"In the coordinator, which should invoke the tool less frequently."}
  ],
  correct:["A"],
  explain:{
    why:"Descriptions set expectations for both selection and downstream design. A tool that returns far more than it claims will be chosen in situations it cannot serve, and every consumer plans around the wrong output size.",
    distractors:{
      B:"Trimming afterwards is a reasonable mitigation and worth doing, but it is compensating for a contract that is simply inaccurate.",
      C:"Enlarging the window accommodates the surprise rather than removing it, and the cost recurs on every call.",
      D:"Calling it less often reduces exposure while leaving the misleading contract in place for everyone else."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-r", domain:2, ts:"2.1", scenario:1, type:"single",
  stem:"You are writing a description for `get_customer`, which accepts an email, a phone number or an account ID. What belongs in it?",
  options:[
    {k:"A", text:"The accepted identifier forms, and what happens when several customers match."},
    {k:"B", text:"The database table it queries and its indexing strategy."},
    {k:"C", text:"A note that customer data is sensitive and should be handled carefully."},
    {k:"D", text:"The historical reason the tool accepts three identifier types."}
  ],
  correct:["A"],
  explain:{
    why:"The agent needs to know what it may pass in and what an ambiguous result means, because multiple matches require asking for another identifier rather than guessing.",
    distractors:{
      C:"Sensitivity is a real concern, but it belongs in policy and enforcement rather than in the text that drives tool selection.",
      B:"Storage details are invisible to the agent and cannot inform any decision it makes.",
      D:"History explains the design to maintainers and costs tokens on every request to the model."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-s", domain:2, ts:"2.1", scenario:5, type:"single",
  stem:"A CI agent has `run_tests`, `run_lint` and `run_build`. It occasionally calls `run_build` when asked to check for type errors. Which description change is most targeted?",
  options:[
    {k:"A", text:"That `run_lint` covers type checking and `run_build` does not."},
    {k:"B", text:"Merging the three into one `run_checks` tool with a mode parameter."},
    {k:"C", text:"Adding a system prompt rule that type errors are always a lint concern."},
    {k:"D", text:"Reordering the tools so `run_lint` appears first."}
  ],
  correct:["A"],
  explain:{
    why:"The confusion is about which tool owns type checking, and that is a boundary question. Saying so in both descriptions resolves it from either direction.",
    distractors:{
      B:"Merging removes the choice but replaces it with a mode argument the agent can get equally wrong.",
      C:"A prompt rule can work, but it puts tool-boundary knowledge somewhere other than the tool definitions, where it is easy to lose.",
      D:"Position in the array is not a reliable selection signal."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.1-t", domain:2, ts:"2.1", scenario:3, type:"single",
  stem:"Why are tool descriptions described as the primary mechanism for selection, rather than tool names?",
  options:[
    {k:"A", text:"A name is a label; the description states applicability and boundaries."},
    {k:"B", text:"Names are not sent to the model, only descriptions are."},
    {k:"C", text:"Names are limited in length and cannot be made descriptive."},
    {k:"D", text:"Names are used only for logging and are ignored during inference."}
  ],
  correct:["A"],
  explain:{
    why:"A good name narrows the space, but only the description can say what the tool handles, what it excludes and how it differs from a neighbour. That is the information a choice requires.",
    distractors:{
      B:"Names are sent and do contribute; they are simply too compressed to carry a boundary.",
      C:"Names can be quite descriptive, though a name long enough to express a boundary would be unwieldy.",
      D:"Names are very much used during inference; the model calls the tool by name."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.2-g", domain:2, ts:"2.2", scenario:1, type:"single",
  stem:"A refund tool returns `isError: true` with the message 'Refund failed: customer not eligible'. The agent retries three times before telling the customer there was a system problem. What is missing?",
  options:[
    {k:"A", text:"A category and retryable flag."},
    {k:"B", text:"A longer, more descriptive error message."},
    {k:"C", text:"A retry limit configured in the agent loop."},
    {k:"D", text:"An error code the agent can look up in documentation."}
  ],
  correct:["A"],
  explain:{
    why:"'Failed' covers both a policy decision and a broken backend, and the agent has to choose between retrying and explaining. Category and retryability make that choice deterministic.",
    distractors:{
      B:"Better prose helps the customer-facing explanation but still leaves the retry decision to inference.",
      C:"A limit stops the loop after three attempts, which is what already happened; the customer still gets the wrong explanation.",
      D:"A lookup code moves the classification into documentation the agent has not been given."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-h", domain:2, ts:"2.2", scenario:3, type:"single",
  stem:"A search tool returns `isError: true` when a query legitimately matches nothing. What is the consequence for a research coordinator?",
  options:[
    {k:"A", text:"A definitive negative result is treated as a failure and retried pointlessly."},
    {k:"B", text:"The coordinator terminates the whole workflow on the first empty topic."},
    {k:"C", text:"The result is silently dropped and never reaches the coordinator."},
    {k:"D", text:"The search tool is disabled for the remainder of the session."}
  ],
  correct:["A"],
  explain:{
    why:"'No matches' is a valid, informative answer. Dressing it as an error invites retries that will keep returning nothing, and may push the coordinator to fabricate coverage from another source.",
    distractors:{
      B:"Terminating everything is one possible coordinator policy, but the general and more common consequence is wasted retries.",
      C:"An error result is delivered to the coordinator rather than dropped; the problem is how it is labelled.",
      D:"Nothing disables a tool on error; it remains available for the next call."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.2-i", domain:2, ts:"2.2", scenario:1, type:"single",
  stem:"Classify this failure: an MCP tool call fails because the upstream service returned HTTP 503.",
  options:[
    {k:"A", text:"Transient, retryable with backoff."},
    {k:"B", text:"Validation, non-retryable until the input changes."},
    {k:"C", text:"Business, non-retryable and explainable to the customer."},
    {k:"D", text:"Permission, non-retryable until access is granted."}
  ],
  correct:["A"],
  explain:{
    why:"A 503 says the service is temporarily unable to handle the request. The request itself was fine, so backing off and retrying is the appropriate response.",
    distractors:{
      B:"Validation failures come from the request being malformed, which a 503 does not indicate.",
      C:"A business error is a policy outcome about the operation rather than an availability problem.",
      D:"Permission failures return 401 or 403 and would not resolve on retry with the same credentials."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-j", domain:2, ts:"2.2", scenario:6, type:"single",
  stem:"An extraction tool rejects a document because a required field is missing from the request. Your error response marks it retryable. What happens?",
  options:[
    {k:"A", text:"The agent retries an identical malformed call until it gives up."},
    {k:"B", text:"The agent corrects the request automatically on the second attempt."},
    {k:"C", text:"The tool queues the request until the missing field becomes available."},
    {k:"D", text:"The retry succeeds, since transient classification triggers a different code path."}
  ],
  correct:["A"],
  explain:{
    why:"Retryable tells the agent the same call may succeed later. A malformed request will fail identically every time, so the flag converts a fixable mistake into a loop.",
    distractors:{
      B:"Nothing in a retryable flag prompts correction; if anything it signals that no change is needed.",
      C:"Queueing is not implied by retryability and is not a behaviour the tool provides here.",
      D:"Classification is metadata for the agent, not a switch that alters how the tool executes."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-k", domain:2, ts:"2.2", scenario:1, type:"single",
  stem:"A business-rule rejection returns `retriable: false` and the message 'Policy violation, code RF-17'. The agent relays that verbatim to the customer. What should the response also carry?",
  options:[
    {k:"A", text:"A customer-friendly explanation the agent can pass on directly."},
    {k:"B", text:"The full policy text so the agent can quote the relevant clause."},
    {k:"C", text:"A link to the internal policy management system."},
    {k:"D", text:"The identity of the rule author for follow-up questions."}
  ],
  correct:["A"],
  explain:{
    why:"The agent is the last hop before the customer, so the error has to contain something a customer can understand. Otherwise an internal code reaches them unchanged.",
    distractors:{
      B:"Full policy text is a lot of context per error and invites the agent to interpret clauses it should not be interpreting.",
      C:"An internal link is meaningless to the customer and a small information leak.",
      D:"Rule ownership matters for internal escalation, not for the reply the customer receives."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-l", domain:2, ts:"2.2", scenario:3, type:"single",
  stem:"A subagent's tool times out. The subagent retries twice, succeeds, and returns results. What should it tell the coordinator about the timeouts?",
  options:[
    {k:"A", text:"Nothing; the failure was resolved locally and needs no coordinator decision."},
    {k:"B", text:"The full retry log, so the coordinator has complete visibility."},
    {k:"C", text:"A warning, so the coordinator can decide whether to trust the results."},
    {k:"D", text:"An error alongside the results, so the run is marked degraded."}
  ],
  correct:["A"],
  explain:{
    why:"Propagate what the coordinator must act on. A resolved transient failure requires no decision, and reporting it spends context on noise while inviting unnecessary recovery.",
    distractors:{
      C:"The results are complete and correct, so trust is not in question; the retries succeeded.",
      B:"Retry detail belongs in telemetry, where it supports operational analysis without consuming the coordinator's context.",
      D:"Marking a successful run degraded would misrepresent its coverage in the final report."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.2-m", domain:2, ts:"2.2", scenario:1, type:"single",
  stem:"A file-read tool returns the same generic error for 'file not found', 'permission denied' and 'path is a directory'. How does this affect the agent?",
  options:[
    {k:"A", text:"It cannot choose between fixing the path, escalating, or listing."},
    {k:"B", text:"It stops using the tool entirely after the first failure."},
    {k:"C", text:"It treats the file as empty and proceeds without noticing."},
    {k:"D", text:"It retries indefinitely, since no error is marked terminal."}
  ],
  correct:["A"],
  explain:{
    why:"Each of those three causes has a different remedy, and all three are recoverable. A single message collapses them, so the agent guesses which recovery to attempt.",
    distractors:{
      D:"Retrying is one guess it might make, but the general problem is that no recovery can be chosen on the information given.",
      B:"Abandoning the tool is unusual behaviour and not the typical consequence of an ambiguous error.",
      C:"An explicit error, however vague, is not the same as an empty result, so the agent knows something failed."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-n", domain:2, ts:"2.2", scenario:5, type:"single",
  stem:"Which error response best supports an agent deciding what to do next?",
  options:[
    {k:"A", text:"`{errorCategory, isRetryable, message}`"},
    {k:"B", text:"`{error: 'Request could not be completed at this time'}`"},
    {k:"C", text:"`{error: true, code: 5031, trace: '...'}`"},
    {k:"D", text:"`{status: 'failed', retry: 'maybe'}`"}
  ],
  correct:["A"],
  explain:{
    why:"It answers the three questions the agent has: what kind of failure, whether another attempt could succeed, and what actually happened. Each field maps onto a decision.",
    distractors:{
      B:"Polite and human-readable, but it conveys neither category nor retryability, so the agent still has to guess.",
      C:"A numeric code and stack trace serve an engineer reading logs, not an agent choosing a recovery.",
      D:"'Maybe' is not a decision the agent can act on, and no category is given."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-o", domain:2, ts:"2.2", scenario:1, type:"multi",
  stem:"Which two error categories should normally be marked non-retryable? (Select 2.)",
  options:[
    {k:"A", text:"A business-rule violation, such as a refund outside the return window."},
    {k:"B", text:"A validation failure caused by a malformed argument."},
    {k:"C", text:"A gateway timeout from an overloaded upstream service."},
    {k:"D", text:"A rate limit response asking the caller to slow down."}
  ],
  correct:["A","B"],
  explain:{
    why:"Both fail deterministically. The policy will still be violated and the argument will still be malformed on a second identical attempt, so retrying spends calls to reach the same answer.",
    distractors:{
      C:"An overloaded service is the archetypal transient failure and often succeeds after a short backoff.",
      D:"A rate limit is explicitly an invitation to retry later, provided the caller backs off."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-p", domain:2, ts:"2.2", scenario:3, type:"single",
  stem:"A subagent cannot reach a source repository at all. It returns `{results: [], status: 'ok'}`. What is the consequence for the final report?",
  options:[
    {k:"A", text:"The topic appears researched and empty, when it was never actually searched."},
    {k:"B", text:"The coordinator retries the subagent repeatedly until it returns a non-empty result set."},
    {k:"C", text:"The synthesis step raises an error on receiving an empty result set."},
    {k:"D", text:"The report is annotated as having incomplete coverage for that topic."}
  ],
  correct:["A"],
  explain:{
    why:"Reporting failure as success is the most dangerous of the error anti-patterns, because it removes any chance of recovery and produces a report that silently claims coverage it does not have.",
    distractors:{
      B:"A success status gives the coordinator no reason to retry anything.",
      C:"An empty result is a legitimate outcome, so synthesis has no basis for treating it as an error.",
      D:"Coverage annotation requires knowing the topic failed, which this response conceals."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.2-q", domain:2, ts:"2.2", scenario:5, type:"single",
  stem:"A CI tool returns an error when the linter finds violations. The agent reports 'the linter failed to run'. What is the design mistake?",
  options:[
    {k:"A", text:"Findings are being signalled as tool failure rather than as results."},
    {k:"B", text:"The linter should not be exposed as a tool at all."},
    {k:"C", text:"The error message is not detailed enough about the violations."},
    {k:"D", text:"The agent should simply be instructed that linter errors always mean violations."}
  ],
  correct:["A"],
  explain:{
    why:"A linter that finds problems has done its job. Returning that as an error conflates 'the tool did not work' with 'the tool worked and found something', which is exactly the distinction the error flag exists to preserve.",
    distractors:{
      C:"More detail in the message would help the report read better while leaving the category wrong.",
      D:"A special-case instruction papers over a contract that is simply inverted, and every new consumer has to learn the same exception.",
      B:"Exposing a linter as a tool is entirely reasonable; the problem is what it returns."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-r", domain:2, ts:"2.2", scenario:3, type:"single",
  stem:"An engineer proposes that the MCP server retry internally on transient failures, so the agent never sees them. What is the trade-off?",
  options:[
    {k:"A", text:"It simplifies the agent but hides latency and removes its options."},
    {k:"B", text:"It violates the MCP specification, which forbids server-side retries."},
    {k:"C", text:"It has no downside and should always be preferred."},
    {k:"D", text:"It prevents the agent from ever receiving any successful results."}
  ],
  correct:["A"],
  explain:{
    why:"Internal retries are often the right call for brief blips. The cost is that a call may now block for a long time, and the agent loses the option to try a different source instead of waiting.",
    distractors:{
      C:"Silent retries have a real cost in latency and lost optionality, so 'always' is too strong.",
      B:"Nothing in the protocol forbids a server retrying its own upstream.",
      D:"Successful results are returned normally; only the intermediate failures are hidden."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-s", domain:2, ts:"2.2", scenario:1, type:"single",
  stem:"Why does a uniform 'Operation failed' response prevent good agent behaviour, even when it is accurate?",
  options:[
    {k:"A", text:"Recovery depends on the failure kind, which the message omits."},
    {k:"B", text:"The agent cannot parse failure messages that lack structured fields."},
    {k:"C", text:"Uniform messages are rejected by the MCP transport layer."},
    {k:"D", text:"The agent will interpret any unstructured failure message as a success and continue."}
  ],
  correct:["A"],
  explain:{
    why:"Truthfulness is not the issue; usefulness is. Retry, correct-and-resubmit, explain-to-the-customer and escalate are four different responses, and choosing between them requires knowing which failure occurred.",
    distractors:{
      B:"The agent reads prose perfectly well; the message simply does not contain the distinguishing information.",
      C:"The transport carries whatever content the server returns.",
      D:"An error flag is still set, so the agent knows the call failed."
    }
  },
  refs:[R_MCP] },

{ id:"d2-2.2-t", domain:2, ts:"2.2", scenario:6, type:"single",
  stem:"An extraction subagent fails on 3 of 50 documents and returns only the 47 successes. The coordinator reports 100% completion. What should the subagent have returned?",
  options:[
    {k:"A", text:"The 47 results plus an explicit record of the 3 failures and why."},
    {k:"B", text:"An error for the whole batch, since it did not fully succeed."},
    {k:"C", text:"The 47 results, with the remaining 3 retried silently until they succeed."},
    {k:"D", text:"Placeholder records for the 3, so downstream counts stay consistent."}
  ],
  correct:["A"],
  explain:{
    why:"Partial success is the normal outcome of batch work, and it is only usable if the gaps are visible. Naming the three and the reason lets the coordinator decide between retrying, escalating and proceeding.",
    distractors:{
      B:"Failing the whole batch discards 47 good extractions over 3 problems.",
      C:"Indefinite silent retries block the batch on documents that may never succeed.",
      D:"Placeholders keep the arithmetic tidy while corrupting the data, which is worse than a visible gap."
    }
  },
  refs:[R_MCP] },

/* ---- Domain 2 expansion: task statements 2.3, 2.4 and 2.5 ---- */

{ id:"d2-2.3-g", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"A synthesis agent holds 14 tools, of which it uses 3 regularly. Selection errors cluster on the 11 it rarely needs. What is the most direct improvement?",
  options:[
    {k:"A", text:"Remove the rarely used tools from its definition."},
    {k:"B", text:"Improve the descriptions of the 11 so they are chosen more accurately when needed."},
    {k:"C", text:"Add a system prompt listing the three tools it should normally prefer."},
    {k:"D", text:"Split the agent into two, each holding seven tools."}
  ],
  correct:["A"],
  explain:{
    why:"Every additional option makes discrimination harder, and eleven near-unused tools are pure decision cost. Scoping to the three the role needs removes the errors at source.",
    distractors:{
      B:"Better descriptions would help if those tools were genuinely needed, but they are not, so you would be paying tokens to improve rarely-correct choices.",
      C:"A preference hint biases selection without removing the eleven distractors from consideration.",
      D:"Splitting halves the menu but creates a second agent and a routing decision, which is a lot of structure for a scoping problem."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.3-h", domain:2, ts:"2.3", scenario:6, type:"single",
  stem:"You need the model to call `extract_metadata` first, then decide freely among enrichment tools on later turns. Which configuration achieves this?",
  options:[
    {k:"A", text:"Force that tool on the first request, then switch to `auto`."},
    {k:"B", text:"Set `any` on every request so a tool is always called."},
    {k:"C", text:"List `extract_metadata` first in the array and use `auto` throughout."},
    {k:"D", text:"Use `auto` throughout, with a system prompt instruction describing the required ordering."}
  ],
  correct:["A"],
  explain:{
    why:"Forced selection guarantees the first call, and relaxing afterwards restores the model's judgement for the enrichment steps. The constraint applies exactly where it is needed.",
    distractors:{
      B:"`any` guarantees some call but not which one, so an enrichment tool could still go first.",
      C:"Array order does not determine call order, so this leaves the first step to chance.",
      D:"A prompt instruction is followed most of the time, which is not a guarantee when a later step depends on it."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.3-i", domain:2, ts:"2.3", scenario:1, type:"single",
  stem:"Your support agent sometimes replies conversationally when it should have looked something up. Which `tool_choice` setting removes that possibility?",
  options:[
    {k:"A", text:"`any`"},
    {k:"B", text:"`auto`"},
    {k:"C", text:"`none`"},
    {k:"D", text:"`{type: 'tool', name: 'get_customer'}`"}
  ],
  correct:["A"],
  explain:{
    why:"`any` requires that some tool be called while leaving the choice open, which is what you want when a lookup is definitely needed but the right one depends on the request.",
    distractors:{
      B:"`auto` is what permits the text-only reply you are trying to eliminate.",
      C:"`none` forbids tools entirely, which is the opposite of the requirement.",
      D:"Forcing one named tool guarantees a call but sends every request to `get_customer`, including ones needing a different lookup."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.3-j", domain:2, ts:"2.3", scenario:1, type:"single",
  stem:"A code agent has both `bash` and a set of narrow tools for reading, writing and searching. It uses `bash` for almost everything. What is the concern?",
  options:[
    {k:"A", text:"A general tool absorbs the work the specific ones were scoped for."},
    {k:"B", text:"`bash` is measurably slower than the narrow tools for equivalent file operations."},
    {k:"C", text:"Narrow tools stop being offered once `bash` is present."},
    {k:"D", text:"`bash` output cannot be returned in a `tool_result` block."}
  ],
  correct:["A"],
  explain:{
    why:"A tool that can do anything will be chosen for everything, which discards the guarantees the narrow tools were built to provide, such as validated paths and bounded effects.",
    distractors:{
      B:"Performance is broadly comparable and would not be the architectural objection.",
      C:"All configured tools remain available; the model is simply preferring one.",
      D:"`bash` output is returned like any other tool result."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.3-k", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"A synthesis agent needs occasional fact verification. Giving it the full research toolset was rejected. Which alternative preserves separation of concerns?",
  options:[
    {k:"A", text:"A single narrow `verify_fact` tool for simple lookups."},
    {k:"B", text:"Permission to invoke the research subagent directly when needed."},
    {k:"C", text:"A cache of everything the research agent retrieved earlier."},
    {k:"D", text:"An instruction to flag unverified claims for the coordinator to check."}
  ],
  correct:["A"],
  explain:{
    why:"One scoped capability covers the common case without turning the synthesis agent into a researcher. The wider toolset stays where it belongs.",
    distractors:{
      B:"Direct peer invocation removes the coordinator's oversight, which is the property hub-and-spoke exists to preserve.",
      C:"A cache only helps if the needed fact happens to be in it, which cannot be predicted in advance.",
      D:"Flagging works but adds a full round trip for every simple date or name check."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.3-l", domain:2, ts:"2.3", scenario:6, type:"single",
  stem:"Several extraction schemas exist and the document type is unknown until the model reads it. Which setting produces structured output without pre-classifying?",
  options:[
    {k:"A", text:"`any`, letting the model pick the schema it judges correct."},
    {k:"B", text:"Forcing the most common schema and correcting mismatches downstream."},
    {k:"C", text:"`auto`, with a prompt instruction to always call an extraction tool."},
    {k:"D", text:"A classification call first, then a forced call to the matching schema."}
  ],
  correct:["A"],
  explain:{
    why:"`any` guarantees a schema-conformant result while leaving the type decision to the model, which is reading the document anyway. One call, no classification step.",
    distractors:{
      D:"Classifying first is a defensible two-step design, but it costs an extra round trip to make a decision the extraction call can make itself.",
      B:"Forcing one schema misclassifies every document that is not that type, and downstream correction cannot recover fields the wrong schema never captured.",
      C:"`auto` permits a text reply, so the guarantee is lost."
    }
  },
  refs:[R_STRUCT] },

{ id:"d2-2.3-m", domain:2, ts:"2.3", scenario:5, type:"single",
  stem:"A CI agent has read-only tools plus `post_comment`. You want it to analyse without commenting during a dry run. What is the cleanest control?",
  options:[
    {k:"A", text:"Omit `post_comment` from the tool set for that run."},
    {k:"B", text:"Keep the tool and set `tool_choice: 'none'` for the run."},
    {k:"C", text:"Keep the tool and instruct the agent not to use it."},
    {k:"D", text:"Keep the tool and discard its output after the run."}
  ],
  correct:["A"],
  explain:{
    why:"A capability that is absent cannot be misused, and the agent's remaining tools still let it do the analysis. Nothing depends on the model's compliance.",
    distractors:{
      B:"`none` blocks every tool, so the analysis cannot run either.",
      C:"An instruction is probabilistic, and a stray comment on a real pull request is visible to the team.",
      D:"Discarding output afterwards does not un-post a comment that has already been created."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.3-n", domain:2, ts:"2.3", scenario:1, type:"single",
  stem:"Which statement about `tool_choice: 'auto'` is correct?",
  options:[
    {k:"A", text:"The model may answer with text instead of calling any tool."},
    {k:"B", text:"The model must call a tool, but may choose which."},
    {k:"C", text:"The model calls tools in the order they are declared."},
    {k:"D", text:"The model may call at most one tool per turn."}
  ],
  correct:["A"],
  explain:{
    why:"`auto` leaves the decision entirely to the model, including the decision not to use a tool at all. That flexibility is useful in conversation and a liability when output must be structured.",
    distractors:{
      B:"That describes `any`, which is the setting that removes the text-only option.",
      C:"Declaration order does not constrain call order under any setting.",
      D:"Multiple tool calls in a single turn are permitted and common."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.3-o", domain:2, ts:"2.3", scenario:1, type:"single",
  stem:"An agent is given `delete_file` for cleanup tasks that occur in roughly 1% of runs. What is the risk-weighted argument against including it by default?",
  options:[
    {k:"A", text:"A rare need does not justify permanent destructive capability."},
    {k:"B", text:"An unused tool measurably slows every request."},
    {k:"C", text:"Deletion tools are unsupported over MCP."},
    {k:"D", text:"The tool would never be selected, making it dead weight."}
  ],
  correct:["A"],
  explain:{
    why:"The cost of a wrong deletion is high and irreversible, while the benefit arrives in one run out of a hundred. Provisioning it on demand keeps the capability without carrying the risk continuously.",
    distractors:{
      D:"It would be selected occasionally, which is precisely the exposure; a tool that never fired would be harmless.",
      B:"One extra definition has a negligible effect on latency, and cost is not the main objection.",
      C:"Deletion tools work over MCP like any other."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.3-p", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"After scoping each subagent's tools tightly, one subagent begins failing on a legitimate task it can no longer perform. What is the right response?",
  options:[
    {k:"A", text:"Add back the one tool that task needs, not the whole original set."},
    {k:"B", text:"Restore the original toolset, on the grounds that scoping caused a regression."},
    {k:"C", text:"Route that task to a different subagent that retains the tool."},
    {k:"D", text:"Accept the failure, since the task falls outside the agent's new scope."}
  ],
  correct:["A"],
  explain:{
    why:"Scoping is meant to be tightened iteratively. A single genuine gap is evidence about one tool, not evidence that the whole restriction was wrong.",
    distractors:{
      C:"Rerouting is reasonable if the task genuinely belongs elsewhere, but here it belongs to this agent and only the capability is missing.",
      B:"Restoring everything discards the selection-reliability gains that motivated the change.",
      D:"The task is legitimate work for this agent, so accepting failure is not an option."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.3-q", domain:2, ts:"2.3", scenario:5, type:"multi",
  stem:"Which two are sound reasons to replace a broad tool with a narrower one? (Select 2.)",
  options:[
    {k:"A", text:"The narrow tool can validate its inputs against the intended use."},
    {k:"B", text:"A narrower description gives the model a clearer selection boundary."},
    {k:"C", text:"Narrow tools execute faster than general-purpose ones."},
    {k:"D", text:"Narrow tools are exempt from the agent's tool-count limits."}
  ],
  correct:["A","B"],
  explain:{
    why:"Constraining the contract lets the tool reject misuse at the boundary, and a specific description makes it clearer when the tool applies. Both improve reliability.",
    distractors:{
      C:"Execution speed depends on the work, not the breadth of the interface.",
      D:"There is no such exemption; every tool counts toward the selection burden."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.3-r", domain:2, ts:"2.3", scenario:1, type:"single",
  stem:"A team sets `tool_choice: 'any'` permanently to stop the agent chatting instead of acting. Customers now receive tool output with no explanation. What was overlooked?",
  options:[
    {k:"A", text:"The agent also needs turns where it explains rather than acts."},
    {k:"B", text:"`any` disables the model's ability to format its output."},
    {k:"C", text:"`any` prevents more than one tool call per conversation."},
    {k:"D", text:"`any` applies only to the first request in a conversation."}
  ],
  correct:["A"],
  explain:{
    why:"Forcing a call on every turn removes the model's ability to speak to the customer at all. The setting suits a request where structured output is required, not a whole conversation.",
    distractors:{
      B:"Formatting is unaffected; the model simply never gets a turn in which to write prose.",
      C:"Multiple calls remain possible; the constraint is that every turn must contain at least one.",
      D:"It applies to whichever requests carry it, which here is all of them."
    }
  },
  refs:[R_TOVR] },

{ id:"d2-2.3-s", domain:2, ts:"2.3", scenario:3, type:"single",
  stem:"An agent with 5 tools is merged with another that has 6, and selection accuracy drops from 94% to 78%. What is the most likely cause?",
  options:[
    {k:"A", text:"Eleven options is a harder discrimination than five."},
    {k:"B", text:"The merged definitions exceeded the maximum payload size."},
    {k:"C", text:"Tool names collided and one set silently overwrote the other."},
    {k:"D", text:"Merged agents lose access to their original system prompts."}
  ],
  correct:["A"],
  explain:{

{ id:"d2-2.3-t", domain:2, ts:"2.3", scenario:5, type:"single",

{ id:"d2-2.4-g", domain:2, ts:"2.4", scenario:4, type:"single",

{ id:"d2-2.4-i", domain:2, ts:"2.4", scenario:4, type:"single",

{ id:"d2-2.4-j", domain:2, ts:"2.4", scenario:4, type:"single",

{ id:"d2-2.4-k", domain:2, ts:"2.4", scenario:2, type:"single",

{ id:"d2-2.4-m", domain:2, ts:"2.4", scenario:1, type:"single",

{ id:"d2-2.4-n", domain:2, ts:"2.4", scenario:2, type:"single",

{ id:"d2-2.4-o", domain:2, ts:"2.4", scenario:3, type:"single",
  stem:"When are the tools from a configured MCP server made available to the agent?",

{ id:"d2-2.4-p", domain:2, ts:"2.4", scenario:3, type:"single",

{ id:"d2-2.4-r", domain:2, ts:"2.4", scenario:5, type:"single",

{ id:"d2-2.4-s", domain:2, ts:"2.4", scenario:4, type:"single",

{ id:"d2-2.4-t", domain:2, ts:"2.4", scenario:5, type:"single",

{ id:"d2-2.5-g", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"You need every file that imports `parseConfig`, across a repository with mixed naming conventions. Which approach is correct?",
  options:[
    {k:"A", text:"Grep for the symbol across the repository."},
    {k:"B", text:"Glob for files whose names contain `config`."},

    {k:"D", text:"Glob for all source files, then Read each one."}

      D:"Reading everything would find them but at enormous context cost for a question Grep answers directly."

  },
  refs:[R_SUB] },

{ id:"d2-2.5-h", domain:2, ts:"2.5", scenario:4, type:"single",
  stem:"An Edit call fails with a report that the anchor text appears three times. What is the reliable next step?",
  options:[
    {k:"A", text:"Read the file, then Write it back with the change applied."},
    {k:"B", text:"Retry the Edit, since matching is sometimes non-deterministic."},
    {k:"C", text:"Edit each of the occurrences in turn until the right one has changed."},
    {k:"D", text:"Delete the file and recreate it from the intended content."}
  ],
  correct:["A"],
  explain:{
    why:"Edit needs a unique anchor. When uniqueness cannot be achieved, reading the exact current content and writing back the intended result is the documented fallback and is fully deterministic.",
    distractors:{
      C:"Expanding the anchor with surrounding context to make it unique is a legitimate alternative, but blindly editing occurrences in turn risks changing the wrong one.",
      B:"The failure is deterministic; the anchor is still ambiguous on a retry.",
      D:"Recreating from memory risks losing content that was never read into context."
    }
  },
  refs:[R_SUB] },

{ id:"d2-2.5-j", domain:2, ts:"2.5", scenario:4, type:"single",

{ id:"d2-2.5-k", domain:2, ts:"2.5", scenario:4, type:"single",

{ id:"d2-2.5-l", domain:2, ts:"2.5", scenario:2, type:"single",

{ id:"d2-2.5-m", domain:2, ts:"2.5", scenario:4, type:"single",

  },
  refs:[R_CTX] },

{ id:"d2-2.5-n", domain:2, ts:"2.5", scenario:1, type:"single",

{ id:"d2-2.5-r", domain:2, ts:"2.5", scenario:4, type:"single",
