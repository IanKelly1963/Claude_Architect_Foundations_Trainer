  explain:{
    why:"Passing tests bound the observed failure rate, not the true one. When the requirement is zero tolerance, the only sound design is one where a violation is structurally impossible, and that means intercepting the call in code.",
    distractors:{
      B:"A clean test run raises confidence but cannot establish that the failure rate is zero, and production inputs will be more varied than the test set.",
      C:"Extended thinking improves reasoning quality on hard problems. It does not convert a probabilistic behaviour into a guarantee.",
      D:"Temperature 0 makes sampling greedy, not instruction-following guaranteed. The model can still deterministically choose to do the wrong thing on an input it reads differently."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.5-e", domain:1, ts:"1.5", scenario:1, type:"multi",
  stem:"Which two tasks are appropriate uses of a `PostToolUse` hook? (Select 2.)",
  options:[
    {k:"A", text:"Converting heterogeneous status codes from several different backends into one consistent vocabulary."},
    {k:"B", text:"Trimming a verbose tool response down to the fields the agent actually needs."},
    {k:"C", text:"Preventing a refund above a policy threshold from being issued."},
    {k:"D", text:"Deciding whether the agent should be permitted to call a particular tool before the call executes."}
  ],
  correct:["A","B"],
  explain:{
    why:"Both are transformations of a result on its way back to the model, which is precisely what `PostToolUse` intercepts. Normalising formats and trimming payloads both happen after execution and before the model reads the output.",
    distractors:{
      C:"Blocking an action must happen before it executes, which is `PreToolUse`. By `PostToolUse` the refund has already been issued.",
      D:"Permission to call a tool is decided pre-execution, via the `permissionDecision` returned from `PreToolUse`."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.5-f", domain:1, ts:"1.5", scenario:1, type:"single",
  stem:"When a hook blocks a policy-violating refund, what should happen next for the best customer outcome?",
  options:[
    {k:"A", text:"Redirect to an alternative workflow such as human escalation."},
    {k:"B", text:"Return a generic error to the agent so it informs the customer the request cannot be processed."},
    {k:"C", text:"Silently downgrade the refund to the maximum permitted amount and proceed."},
    {k:"D", text:"End the conversation immediately to prevent any further policy risk."}
  ],
  correct:["A"],
  explain:{
    why:"The block exists because this case needs a human, not because the customer's request is invalid. Redirecting into escalation means the policy holds and the customer still gets their issue resolved.",
    distractors:{
      B:"A dead end leaves a legitimate request unresolved and the customer with no path forward.",
      C:"Silently altering the amount is worse than refusing. The customer is told they received a full refund when they did not.",
      D:"Ending the conversation abandons a customer with a valid high-value claim, which is the case most in need of careful handling."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.5-g", domain:1, ts:"1.5", scenario:2, type:"single",
  stem:"A team wants Claude Code to always run `make lint` before any commit, without exception. They have added the instruction to CLAUDE.md but it is followed roughly 90% of the time. What is the correct mechanism?",
  options:[
    {k:"A", text:"A hook, because hooks execute at fixed lifecycle events regardless of what Claude decides."},
    {k:"B", text:"Moving the instruction from CLAUDE.md to a `.claude/rules/` file with `paths` frontmatter."},
    {k:"C", text:"Repeating the instruction at both the top and bottom of CLAUDE.md so it appears twice in context."},
    {k:"D", text:"Moving the instruction to the user-level `~/.claude/CLAUDE.md`, which has higher precedence."}
  ],
  correct:["A"],
  explain:{
    why:"The Claude Code documentation is explicit on this: CLAUDE.md is context rather than enforced configuration, and an instruction that must run at a specific point should be written as a hook, which executes as a shell command at a fixed lifecycle event.",
    distractors:{
      B:"Path-scoped rules change when an instruction loads, not whether it is obeyed. It is still context.",
      C:"Duplicating text raises salience marginally and consumes more context. It provides no guarantee.",
      D:"User-level files load before project files and have lower, not higher, precedence, and either way remain non-binding context."
    }
  },
  refs:[{label:"Claude Code: Memory", url:"https://code.claude.com/docs/en/memory"}] },

{ id:"d1-1.6-a", domain:1, ts:"1.6", scenario:5, type:"single",
  stem:"A pull request modifies 14 files across the stock tracking module. Your single-pass review produces detailed feedback on some files, superficial comments on others, misses obvious bugs, and flags a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?",
  options:[
    {k:"A", text:"Split into per-file passes for local issues, plus a separate cross-file integration pass."},
    {k:"B", text:"Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs."},
    {k:"C", text:"Switch to a model with a larger context window so all 14 files receive adequate attention in one pass."},
    {k:"D", text:"Run three independent review passes over the full pull request, and only report issues that appear in at least two of the three separate runs."}
  ],
  correct:["A"],
  explain:{
    why:"Inconsistent depth and self-contradictory findings across one diff are the signature of attention dilution. Per-file passes give every file the same focused treatment, and a dedicated integration pass covers what only becomes visible across file boundaries.",
    distractors:{
      B:"This moves the burden to developers without improving the system, and large PRs will still arrive.",
      C:"Attention quality and context capacity are different things. The files already fit; the problem is how attention is distributed across them.",
      D:"Consensus filtering suppresses real bugs. An issue caught in one pass out of three is quite likely a genuine subtle bug, and this rule discards exactly those."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d1-1.6-b", domain:1, ts:"1.6", scenario:4, type:"single",
  stem:"You are asked to 'add comprehensive tests to this legacy codebase' with no further specification. Which decomposition strategy fits best?",
  options:[
    {k:"A", text:"Dynamic decomposition: map the structure, find high-impact areas, then build an adapting plan."},
    {k:"B", text:"A fixed pipeline: enumerate every source file in the repository, then generate exactly one test file per source file, working in alphabetical order."},
    {k:"C", text:"Prompt chaining with three fixed stages: unit tests, then integration tests, then end-to-end tests."},
    {k:"D", text:"Delegate the entire task to a single subagent with a large context window and no intermediate checkpoints."}
  ],
  correct:["A"],
  explain:{
    why:"The task is open-ended and its shape is unknown until you look. Mapping first, prioritising by impact, then adapting as coupling and dependencies surface is what produces valuable tests rather than uniform coverage of trivia.",
    distractors:{
      B:"One test file per source file, alphabetically, spends equal effort on a config constant and on the payment engine. Coverage rises; risk barely moves.",
      C:"A fixed three-stage chain presumes you already know which components warrant which test level, which is exactly what the mapping phase is for.",
      D:"A single large delegation with no checkpoints gives no opportunity to redirect when the map reveals that most risk sits in two modules."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.6-c", domain:1, ts:"1.6", scenario:5, type:"single",
  stem:"Which task is best served by prompt chaining with fixed sequential steps rather than dynamic decomposition?",
  options:[
    {k:"A", text:"A code review covering a fixed set of aspects: style, security, performance, test coverage."},
    {k:"B", text:"Diagnosing an intermittent production outage of unknown cause."},
    {k:"C", text:"Exploring an unfamiliar codebase to understand how a feature is implemented."},
    {k:"D", text:"Researching an open-ended topic where the relevant subdomains cannot be known before the research begins."}
  ],
  correct:["A"],
  explain:{
    why:"Prompt chaining suits predictable, multi-aspect work where the steps are known in advance and do not depend on what earlier steps found. A review with a fixed checklist is exactly that shape.",
    distractors:{
      B:"Outage diagnosis is the archetypal adaptive task: each finding determines what to examine next, and a fixed sequence would investigate irrelevant subsystems.",
      C:"Codebase exploration is driven by what you discover; the next file to read depends on the imports you just saw.",
      D:"When subdomains are unknown upfront, a fixed chain will encode whatever assumptions you started with, which is how coverage gaps get baked in."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d1-1.6-d", domain:1, ts:"1.6", scenario:5, type:"single",
  stem:"After splitting a 14-file review into per-file passes, cross-file bugs start slipping through: a function signature changed in one file while three callers in other files were not updated. What is missing?",
  options:[
    {k:"A", text:"A separate integration pass examining cross-file data flow and interface consistency across files."},
    {k:"B", text:"A larger per-file context window so each pass can also see the files that import it."},
    {k:"C", text:"A rule that per-file passes should flag any exported symbol as potentially breaking."},
    {k:"D", text:"Reverting to a single-pass review, on the grounds that cross-file correctness matters more than per-file depth."}
  ],
  correct:["A"],
  explain:{
    why:"Per-file passes are designed to catch local issues, and by construction cannot see across boundaries. The complete pattern is local passes plus an explicit integration pass whose entire job is the interactions between files.",
    distractors:{
      B:"Widening each pass to include importers recreates the attention-dilution problem the split was introduced to solve.",
      C:"Flagging every exported symbol produces enormous noise, and still does not verify whether callers were actually updated.",
      D:"Reverting reintroduces inconsistent depth and contradictory findings. The fix is to add the missing pass, not to abandon the approach."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d1-1.6-e", domain:1, ts:"1.6", scenario:3, type:"single",
  stem:"A research coordinator uses a fixed three-subtask decomposition for every topic. For 'the effects of remote work', it produces solid coverage; for 'the impact of AI on creative industries', it misses entire sectors. What does this reveal?",
  options:[
    {k:"A", text:"Fixed decomposition width cannot adapt to topics whose breadth varies."},
    {k:"B", text:"The subagents assigned to the AI topic performed worse and need better system prompts."},
    {k:"C", text:"Three subtasks is too few in general and the fixed count should be raised to six."},
    {k:"D", text:"The topic string was too short, and a longer, more explicit topic description would have produced a better decomposition from the coordinator."}
  ],
  correct:["A"],
  explain:{
    why:"Some topics genuinely decompose into three parts and others into eight. A fixed width either wastes effort on narrow topics or truncates broad ones. The coordinator should determine breadth from the topic rather than from a constant.",
    distractors:{
      B:"The subagents completed their assignments correctly in both cases. Their prompts are not the variable that changed.",
      C:"Six is just a different constant, and would over-decompose narrow topics while still capping genuinely broad ones.",
      D:"Topic length is not the issue. 'The impact of AI on creative industries' is perfectly clear; the coordinator simply read 'creative industries' too narrowly."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.6-f", domain:1, ts:"1.6", scenario:4, type:"single",
  stem:"An engineer suggests that any task decomposition problem can be solved by moving to a model with a larger context window. For which of these problems is that actually true?",
  options:[
    {k:"A", text:"None of them; capacity governs how much fits, not how attention is spread across it."},
    {k:"B", text:"Inconsistent review depth across many files, which is caused by exceeding the window."},
    {k:"C", text:"Contradictory findings within one review, which occur when older content is evicted."},
    {k:"D", text:"Missed cross-file bugs, which occur because the related files cannot all be held in context simultaneously."}
  ],
  correct:["A"],
  explain:{
    why:"These symptoms come from attention dilution, not capacity exhaustion. The material already fits; the model is simply not attending to all of it evenly. Decomposition into focused passes addresses that, and a bigger window does not.",
    distractors:{
      B:"Fourteen source files fit comfortably in a modern context window. The unevenness appears well below the limit.",
      C:"Contradictory findings within a single pass are not caused by eviction; all the content was present throughout.",
      D:"Cross-file bugs are missed because no pass was tasked with looking across files, which remains true however large the window is."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d1-1.6-g", domain:1, ts:"1.6", scenario:6, type:"single",
  stem:"Which pairing of task type to decomposition strategy is correct?",
  options:[
    {k:"A", text:"Predictable multi-aspect review to prompt chaining; open-ended investigation to dynamic decomposition."},
    {k:"B", text:"Predictable multi-aspect review to dynamic decomposition; open-ended investigation to prompt chaining."},
    {k:"C", text:"Both to prompt chaining, since sequential steps are easier to observe and debug."},
    {k:"D", text:"Both to dynamic decomposition, since adaptivity is never a disadvantage."}
  ],
  correct:["A"],
  explain:{
    why:"Prompt chaining fits work whose steps are known in advance and independent of intermediate findings. Dynamic decomposition fits work where each step's results determine what to do next. Matching the strategy to which of those you have is the whole skill.",
    distractors:{
      B:"This is exactly inverted. Adaptivity is wasted on a fixed checklist, and a fixed chain is actively harmful on an investigation.",
      C:"Observability is a real benefit of chaining, but forcing it onto open-ended investigation bakes in assumptions before you have any evidence.",
      D:"Adaptivity costs tokens and latency, and adds nondeterminism where a predictable checklist would have been simpler and cheaper."
    }
  },
  refs:[{label:"API: Prompting best practices", url:"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}] },

{ id:"d1-1.7-a", domain:1, ts:"1.7", scenario:4, type:"single",
  stem:"You spent yesterday's session having Claude analyse a payments module. Overnight, a colleague refactored three of those files substantially. You want to continue the investigation today. What is the best approach?",
  options:[
    {k:"A", text:"Resume the session and tell it explicitly which three files changed, so it re-analyses only those."},
    {k:"B", text:"Resume the session and continue asking questions, since the agent will notice any discrepancies itself."},
    {k:"C", text:"Start a fresh session and re-explore the entire module from scratch to guarantee accuracy."},
    {k:"D", text:"Resume the session and immediately run `/compact` to clear the stale file contents out of context."}
  ],
  correct:["A"],
  explain:{
    why:"Most of yesterday's analysis is still valid, so resuming preserves genuine value. Naming the changed files converts the stale portion into a targeted re-read rather than a full re-exploration.",
    distractors:{
      B:"The agent has no way to notice. It holds yesterday's file contents in context and no signal that anything on disk moved, so it will answer confidently from stale reads.",
      C:"This is safe but wasteful, discarding a full session of valid analysis to fix a three-file problem.",
      D:"`/compact` summarises context to reduce usage. It does not selectively evict stale file contents, and may well preserve the stale conclusions in summary form."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.7-b", domain:1, ts:"1.7", scenario:4, type:"single",
  stem:"A week-old investigation session analysed 40 files. Since then the team has completed a major refactor touching most of them. You need to continue the work. What is the better choice and why?",
  options:[
    {k:"A", text:"Start a new session with a structured summary of the prior conclusions, discarding the stale tool results."},
    {k:"B", text:"Resume the old session, because session resumption always preserves more useful context than starting fresh and re-injecting a written summary of it."},
    {k:"C", text:"Resume the old session and ask it to re-read all 40 files before answering anything further."},
    {k:"D", text:"Fork the old session, because forking discards stale tool results while keeping conclusions."}
  ],
  correct:["A"],
  explain:{
    why:"Resumption is worth it when prior context is mostly still valid. Once most of the tool results describe code that no longer exists, that context is a liability, and the conclusions worth keeping can be carried forward as an injected summary instead.",
    distractors:{
      B:"Preserving more context is only a benefit when the context is true. Here most of it is not.",
      C:"Re-reading all 40 files inside the resumed session leaves both the stale and fresh versions in context, which is a reliable way to produce confused, contradictory answers.",
      D:"Forking copies the session including its stale tool results. It creates a branch; it does not clean anything."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.7-c", domain:1, ts:"1.7", scenario:2, type:"single",
  stem:"Which flag continues a specific, previously named conversation in Claude Code?",
  options:[
    {k:"A", text:"`--resume <session-name>`, which continues that specific named conversation."},
    {k:"B", text:"`--continue`, which loads the most recent conversation in the current directory."},
    {k:"C", text:"`--session-id <uuid>`, which assigns an identifier when starting a conversation."},
    {k:"D", text:"`--restore <session-name>`, which recovers an archived conversation."}
  ],
  correct:["A"],
  explain:{
    why:"`--resume` accepts a session name or ID and continues that specific prior conversation, which is what makes named investigation sessions usable across days.",
    distractors:{
      B:"`--continue` is a real flag and a close call, but it loads whichever conversation was most recent in the directory. That is resumption without selection, so it cannot target a session by name.",
      C:"`--session-id` is also real, but it assigns an identifier to a conversation you are starting rather than selecting one you have already had.",
      D:"There is no `--restore` flag. Recovering an archived or deleted session is a different concern from continuing an existing one."
    }
  },
  refs:[{label:"Claude Code: CLI reference", url:"https://code.claude.com/docs/en/cli-reference"}] },

{ id:"d1-1.7-d", domain:1, ts:"1.7", scenario:4, type:"single",
  stem:"You want to compare two testing strategies for the same module, each explored in depth, without either exploration influencing the other, and without repeating the shared codebase analysis. What is the right mechanism?",
  options:[
    {k:"A", text:"`fork_session` from the completed analysis, creating two independent branches."},
    {k:"B", text:"One session where you ask for both strategies in sequence and compare at the end."},
    {k:"C", text:"Two fresh sessions, each performing its own codebase analysis before exploring one strategy."},
    {k:"D", text:"One session with `/compact` between the two explorations to clear the first from context."}
  ],
  correct:["A"],
  explain:{
    why:"Forking gives both branches the identical analysis baseline while keeping their subsequent reasoning independent. That is precisely the comparison you want: same starting evidence, divergent exploration.",
    distractors:{
      B:"Sequential exploration in one session means the second proposal is anchored on the first, which is the contamination you are trying to avoid.",
      C:"This achieves independence but pays for the analysis twice, and the two baselines may differ, weakening the comparison.",
      D:"`/compact` summarises rather than erases. Traces of the first strategy survive into the second exploration."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.7-e", domain:1, ts:"1.7", scenario:4, type:"single",
  stem:"What is the main risk of resuming a long session whose tool results no longer match the state of the code?",
  options:[
    {k:"A", text:"The agent reasons confidently from stale file contents, producing authoritative-looking errors."},
    {k:"B", text:"The session fails to load, because Claude Code validates file checksums on resume."},
    {k:"C", text:"Tool results older than 24 hours are automatically discarded from the session, so the resumed context comes back silently empty."},
    {k:"D", text:"Resumed sessions run at reduced context capacity, so the stale content crowds out anything new."}
  ],
  correct:["A"],
  explain:{
    why:"Stale context is worse than absent context. The agent has no signal that what it holds is out of date, so it answers with full confidence from a version of the code that no longer exists.",
    distractors:{
      B:"There is no checksum validation gate on resume; the session loads regardless of what changed on disk.",
      C:"Tool results do not expire on a timer. They persist in the conversation as long as it does.",
      D:"Resumption does not reduce context capacity."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.7-f", domain:1, ts:"1.7", scenario:4, type:"single",
  stem:"A multi-day investigation keeps losing findings between sessions. The team wants findings to survive regardless of whether a session is resumed. What is the most robust addition?",
  options:[
    {k:"A", text:"Have the agent maintain a scratchpad file of key findings on disk."},
    {k:"B", text:"Increase the session retention period so old sessions remain resumable for longer."},
    {k:"C", text:"Always resume with `--resume` rather than ever starting new sessions."},
    {k:"D", text:"Raise the context window size so that a single session can span the entire multi-day investigation without truncation."}
  ],
  correct:["A"],
  explain:{
    why:"A file on disk outlives context windows, sessions and compaction alike. Writing findings there and reading them back at session start makes persistence independent of session mechanics entirely.",
    distractors:{
      B:"Retention keeps sessions resumable, but the findings still degrade with context pressure and go stale as code changes.",
      C:"Always resuming is the wrong default; when tool results are stale, a fresh session with a summary is more reliable.",
      D:"No context window makes a multi-day investigation fit in one session, and everything is still lost when it ends."
    }
  },
  refs:[{label:"API: Context windows", url:"https://platform.claude.com/docs/en/build-with-claude/context-windows"}] },

{ id:"d1-1.7-g", domain:1, ts:"1.7", scenario:4, type:"multi",
  stem:"Which two situations favour starting a fresh session with an injected summary over resuming the prior one? (Select 2.)",
  options:[
    {k:"A", text:"Most files analysed in the prior session have since been substantially rewritten."},
    {k:"B", text:"The prior session accumulated verbose tool output with little remaining relevance."},
    {k:"C", text:"The prior session ended cleanly yesterday afternoon, and no code in the repository has changed since."},
    {k:"D", text:"You want to compare two approaches from a shared analysis baseline."}
  ],
  correct:["A","B"],
  explain:{
    why:"Both describe context whose value has decayed. Rewritten files make prior reads misleading, and accumulated irrelevant output crowds the window. In each case a compact summary of the conclusions is worth more than the raw history.",
    distractors:{
      C:"This is the ideal case for resumption: the prior context is still accurate and directly useful.",
      D:"That is what `fork_session` is for. Forking preserves the shared baseline, which starting fresh would discard."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

/* ---- Domain 1 expansion: task statements 1.1 and 1.2 ---- */

{ id:"d1-1.1-h", domain:1, ts:"1.1", scenario:1, type:"single",
  stem:"Your loop executes the requested tool, then sends a fresh request containing only the tool result and the original system prompt. The agent asks the customer for their order number a second time. What is missing?",
  options:[
    {k:"A", text:"Every prior turn, including the assistant's tool calls, must be resent alongside the new result."},
    {k:"B", text:"The system prompt should be repeated at the end of the request as well as the beginning."},
    {k:"C", text:"The tool result needs a `cache_control` marker so the model retains it across requests."},
    {k:"D", text:"The session identifier from the first response must be echoed back to restore server-side state."}
  ],
  correct:["A"],
  explain:{
    why:"The API is stateless. A request containing only the newest result gives the model no record of what the customer already said, so it re-asks. Conversation history is the agent's entire memory and has to travel with every call.",
    distractors:{
      B:"Repeating the system prompt is a real technique for keeping instructions salient in long contexts, but it carries no conversational content, so the order number is still absent.",
      C:"`cache_control` reduces the cost of resending a stable prefix. It is an optimisation over history you are already sending, not a substitute for sending it.",
      D:"This is a reasonable instinct from stateful APIs, but there is no server-side conversation state to restore; the identifier would carry nothing."
    }
  },
  refs:[R_CTX] },

{ id:"d1-1.1-i", domain:1, ts:"1.1", scenario:3, type:"single",
  stem:"A research agent's loop treats any response containing a text block as final. Roughly one turn in six, Claude writes 'Let me search for that' and emits a `tool_use` block in the same turn. What happens?",
  options:[
    {k:"A", text:"The loop stops with the search unexecuted and presents the narration as the answer."},
    {k:"B", text:"The loop executes the search but discards the result, because the text block was seen first."},
    {k:"C", text:"The API rejects the response outright, since text and `tool_use` blocks cannot appear together in one turn."},
    {k:"D", text:"The loop retries the same request until a turn arrives with no text block."}
  ],
  correct:["A"],
  explain:{
    why:"Treating text presence as completion terminates a turn that was in fact requesting a tool. The user receives the model's narration of what it intended to do, with none of it done, which reads as a confident but empty answer.",
    distractors:{
      B:"Nothing executes the search. The loop has already exited on seeing text, so no tool call is dispatched at all.",
      C:"Mixed text and `tool_use` in a single turn is normal and expected; the API returns it happily.",
      D:"There is no retry in this design. The loop treats the turn as complete and returns, which is precisely the bug."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-j", domain:1, ts:"1.1", scenario:4, type:"single",
  stem:"A code-exploration tool fails and your handler returns the error as ordinary text in the `tool_result`. The agent proceeds as though the file were empty. How should a failed tool execution be returned?",
  options:[
    {k:"A", text:"As a `tool_result` marked as an error, so the model can distinguish failure from an empty result."},
    {k:"B", text:"By omitting the `tool_result` block entirely, so the model retries the call."},
    {k:"C", text:"By raising the exception to the caller and terminating the loop for that request."},
    {k:"D", text:"As a `tool_result` containing an empty string, leaving the model to infer that nothing was found."}
  ],
  correct:["A"],
  explain:{
    why:"An error and an empty file are different facts, and the model can only act on the difference if you signal it. Marking the result as an error lets it retry, try another path, or report the problem instead of reasoning from a false premise.",
    distractors:{
      B:"Omitting the block leaves the tool call unanswered, which breaks the pairing the turn requires and typically causes the model to re-request rather than recover.",
      C:"Terminating on any tool failure throws away an otherwise healthy session for something the model could often route around.",
      D:"An empty string is exactly the ambiguity to avoid: it is indistinguishable from a genuinely empty file, which is how the agent reached the wrong conclusion."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-k", domain:1, ts:"1.1", scenario:1, type:"single",
  stem:"Your support loop caps iterations at five. A refund case legitimately needs seven tool calls: verify customer, look up two orders, check policy, calculate, process, confirm. What does the student need to understand about the cap?",
  options:[
    {k:"A", text:"It is a runaway guard, and using it to terminate normal work truncates legitimate cases."},
    {k:"B", text:"It should be raised to match the longest workflow, then left as the termination condition."},
    {k:"C", text:"It is the only bound on cost, so `stop_reason` checking becomes redundant once it is set."},
    {k:"D", text:"It should be applied per tool rather than per loop, so that each tool gets five attempts."}
  ],
  correct:["A"],
  explain:{
    why:"A cap answers 'has something gone wrong?', not 'is the model finished?'. When it fires during legitimate work the case ends half-processed, which with a refund means money moved but never confirmed.",
    distractors:{
      B:"Raising it helps this case but reinstates the same failure at a higher number, and the next unusual case exceeds it too. The cap should not be the thing deciding completion.",
      C:"This has it backwards. `stop_reason` is what detects completion; the cap only bounds pathological behaviour, and relying on it alone truncates every long task.",
      D:"Per-tool retry budgets are a sensible idea for transient failures, but they do not address when the overall loop should end."
    }
  },
  refs:[R_TOVR] },

{ id:"d1-1.1-l", domain:1, ts:"1.1", scenario:3, type:"single",
  stem:"Claude returns one turn containing four `tool_use` blocks: three web searches and one document fetch. Your loop executes them and sends four separate user messages, one per result. What goes wrong?",
  options:[
    {k:"A", text:"Each message leaves the remaining calls unanswered, breaking the pairing within that turn."},
    {k:"B", text:"The four results arrive out of order, so the model attributes them to the wrong calls."},
    {k:"C", text:"Only the last message is retained, because each new user message supersedes the one before it."},
    {k:"D", text:"The searches execute sequentially rather than in parallel, costing latency but nothing else."}
  ],
  correct:["A"],
  explain:{
    why:"A turn requesting four tools is answered by one user message carrying all four `tool_result` blocks. Splitting it sends a message that answers one call while three remain outstanding, which is not a valid continuation of that turn.",
    distractors:{
      B:"Ordering is not the risk, since each result carries the `tool_use_id` of the call it answers; the problem is structural rather than a mix-up.",
      C:"User messages accumulate in the conversation rather than replacing one another, so nothing is superseded.",
      D:"Execution order is your choice and unrelated to how results are returned. The defect here is the message structure, not the latency."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-m", domain:1, ts:"1.1", scenario:4, type:"single",
  stem:"A developer proposes a loop that inspects the arguments of each `tool_use` block and, if the agent asks to read a file it has already read, substitutes a cached result rather than re-reading. What is the main risk?",
  options:[
    {k:"A", text:"The file may have changed since the first read, so the agent reasons from stale content."},
    {k:"B", text:"Caching breaks the `tool_use_id` pairing, so the model cannot match the result to its call."},
    {k:"C", text:"The model will detect the substitution and re-request the file with different arguments."},
    {k:"D", text:"Cached results cannot be placed in a `tool_result` block, so the turn cannot be completed."}
  ],
  correct:["A"],
  explain:{
    why:"Agents often re-read a file precisely because they have just edited it. Serving a cached copy hands back the pre-edit content, and the agent then reasons confidently from a version that no longer exists on disk.",
    distractors:{
      B:"The pairing is preserved as long as you return the result under the same `tool_use_id`; the cache is invisible at that level.",
      C:"The model has no way to tell a cached result from a fresh one, which is what makes the staleness dangerous rather than self-correcting.",
      D:"A cached string goes into a `tool_result` exactly like a fresh one; there is no structural obstacle."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-n", domain:1, ts:"1.1", scenario:6, type:"single",
  stem:"An extraction agent loops over a 200-page document, calling a page-reader tool. After 40 iterations the responses start omitting details from pages read early in the run. What is the most likely cause?",
  options:[
    {k:"A", text:"Accumulated tool results have filled the context, so early pages are no longer well attended."},
    {k:"B", text:"The loop has exceeded the maximum number of `tool_result` blocks a conversation can hold."},
    {k:"C", text:"`stop_reason` has switched to `max_tokens`, silently truncating the earlier history."},
    {k:"D", text:"The tool is returning pages in a different format after the fortieth call."}
  ],
  correct:["A"],
  explain:{
    why:"Forty pages of tool output is a large amount of context, and material in the middle of a long input is the least reliably attended. The fix is to extract what matters from each page as you go rather than carrying every page forward whole.",
    distractors:{
      B:"There is no cap on the number of `tool_result` blocks in a conversation; the constraint is the context window, which is a different thing.",
      C:"`max_tokens` bounds the length of a single response and does not retroactively remove earlier history from the conversation you send.",
      D:"A format change would show as parsing failures or obviously wrong values on recent pages, not as gradual loss of detail from early ones."
    }
  },
  refs:[R_CTX] },

{ id:"d1-1.1-o", domain:1, ts:"1.1", scenario:1, type:"single",
  stem:"Which sequence correctly describes one full iteration of an agentic loop?",
  options:[
    {k:"A", text:"Send history, read `stop_reason`, execute any requested tools, append results, send again."},
    {k:"B", text:"Send history, execute the tools named in the system prompt, read `stop_reason`, append results."},
    {k:"C", text:"Execute the next tool in the configured sequence, send the result, then read `stop_reason`."},
    {k:"D", text:"Send history, wait for `end_turn`, execute all tools the model mentioned, then send again."}
  ],
  correct:["A"],
  explain:{
    why:"The model decides what to call, so nothing is executed until its response has been read. `stop_reason` tells you whether tools were requested, the results are appended, and the enlarged conversation goes back for the next decision.",
    distractors:{
      B:"Tools are requested by the model in its response, not enumerated in the system prompt, so there is nothing to execute before reading the reply.",
      C:"A configured sequence is a pipeline rather than an agentic loop, and it removes the model's ability to choose the next action from what it has learned.",
      D:"`end_turn` means the model has finished and is requesting nothing, so waiting for it before executing tools means no tool ever runs."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-p", domain:1, ts:"1.1", scenario:5, type:"single",
  stem:"A CI review agent runs a loop over a pull request. It sometimes ends after a single turn with a partial review, and the logs show `stop_reason: \"max_tokens\"`. What should the loop do?",
  options:[
    {k:"A", text:"Treat it as truncated rather than complete, and continue generation."},
    {k:"B", text:"Treat it as equivalent to `end_turn`, since the model has stopped producing output either way."},
    {k:"C", text:"Retry the identical request, since truncation is a transient sampling artefact."},
    {k:"D", text:"Discard the turn and reduce the number of files in the request until the response fits."}
  ],
  correct:["A"],
  explain:{
    why:"`max_tokens` means the response hit its output limit mid-thought. It is neither a finished turn nor a tool request, and presenting it ships a review that stops in the middle of a sentence.",
    distractors:{
      B:"Both stop generation, but only `end_turn` means the model considered itself finished. Conflating them is how truncated output reaches the user as though it were complete.",
      C:"Truncation is deterministic given the same input and limit, so an identical retry truncates at the same place.",
      D:"Reducing scope is a reasonable longer-term response to persistently oversized reviews, but it discards work already generated and does not handle the case in front of you."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-q", domain:1, ts:"1.1", scenario:2, type:"single",
  stem:"Your loop appends tool results but reconstructs the assistant's turn from scratch, keeping only its text and dropping the `tool_use` blocks. What breaks?",
  options:[
    {k:"A", text:"The results answer calls with no matching request, so the conversation is inconsistent."},
    {k:"B", text:"Nothing breaks; `tool_use` blocks are only needed at the moment of execution."},
    {k:"C", text:"The model loses its system prompt, since it is carried on the assistant turn."},
    {k:"D", text:"Token usage rises, because the model regenerates the dropped blocks on the following turn."}
  ],
  correct:["A"],
  explain:{
    why:"A `tool_result` refers back to a `tool_use_id`. Removing the assistant's `tool_use` blocks leaves results pointing at calls that no longer appear anywhere in the history, so the record of what the agent did is incoherent.",
    distractors:{
      B:"This is a tempting simplification because execution is already finished, but the blocks are also the conversational record of what was requested, and the results depend on them.",
      C:"The system prompt is a separate top-level parameter and is unaffected by what the assistant turn contains.",
      D:"The model does not regenerate prior turns. The consequence is an inconsistent history, not extra generation."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-r", domain:1, ts:"1.1", scenario:3, type:"multi",
  stem:"Your loop must decide what to do with a response. Which two `stop_reason` values mean the loop should NOT execute any tools for that turn? (Select 2.)",
  options:[
    {k:"A", text:"`end_turn`"},
    {k:"B", text:"`max_tokens`"},
    {k:"C", text:"`tool_use`"},
    {k:"D", text:"`pause_turn`"}
  ],
  correct:["A","B"],
  explain:{
    why:"`end_turn` means the model has finished and requested nothing. `max_tokens` means it was cut off mid-response, so any partially formed request is not something to act on. Neither is an instruction to run a tool.",
    distractors:{
      C:"`tool_use` is precisely the case where tools should be executed and their results returned.",
      D:"`pause_turn` indicates a long-running turn that should be continued by sending the response back, so the turn is not finished and work does continue."
    }
  },
  refs:[R_TOOL] },

{ id:"d1-1.1-s", domain:1, ts:"1.1", scenario:4, type:"single",
  stem:"An engineer wants the agent to always call `list_files` before `read_file`, and proposes enforcing it inside the loop by rejecting any `read_file` call that arrives first. What is the trade-off?",
  options:[
    {k:"A", text:"It is deterministic, but it removes the model's ability to skip a listing it does not need."},
    {k:"B", text:"It cannot work, because the loop has no visibility of which tool the model requested."},
    {k:"C", text:"It is equivalent to a system prompt instruction, so it adds complexity for no gain."},
    {k:"D", text:"It guarantees ordering only when both tools appear in the same turn."}
  ],
  correct:["A"],
  explain:{
    why:"Loop-level gating does give a hard guarantee, which is right when the ordering is a genuine safety requirement. The cost is that a model given an exact path it already knows now has to make a redundant call first.",
    distractors:{
      B:"The loop reads every `tool_use` block before executing it, so it has full visibility of the tool name and arguments.",
      C:"The two are not equivalent at all: the prompt version is followed most of the time, and the gate is followed every time. That difference is the whole reason to consider it.",
      D:"A gate can track what has already been called across the whole conversation, so it is not limited to a single turn."
    }
  },
  refs:[R_HOOK] },

{ id:"d1-1.1-t", domain:1, ts:"1.1", scenario:6, type:"single",
  stem:"An extraction loop sends `tool_choice: \"any\"` on every iteration to guarantee structured output. After the extraction succeeds the loop never terminates. Why?",
  options:[
    {k:"A", text:"`any` forbids a text-only reply, so `end_turn` can never be reached."},
    {k:"B", text:"`any` disables `stop_reason`, so the loop has nothing to test against."},
    {k:"C", text:"`any` retries the same tool until its output validates against the schema."},
    {k:"D", text:"`any` is only valid on the first request and is silently ignored afterwards."}
  ],
  correct:["A"],
  explain:{
    why:"Forcing a tool call on every turn removes the model's only way to say it has finished. The setting is right for the extraction request itself and wrong as a permanent loop-wide default; relax it once the structured output has been captured.",
    distractors:{
      B:"`stop_reason` is returned on every response regardless of `tool_choice`; it simply keeps reporting `tool_use`.",
      C:"`tool_choice` does not validate output or drive retries; schema validation is something you do with the result.",
      D:"The parameter applies to whichever request carries it, so sending it every time keeps forcing a call every time."
    }
  },
  refs:[R_TOVR] },

{ id:"d1-1.2-h", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Your coordinator delegates to four subagents and aggregates their output, but when the document-analysis subagent returns nothing usable the coordinator still runs synthesis and ships the report. What is missing from the coordinator's role?",
  options:[
    {k:"A", text:"Evaluating results before deciding the next step, rather than aggregating whatever arrives."},
    {k:"B", text:"A longer timeout on the document-analysis subagent so it has more chance to succeed."},
    {k:"C", text:"Instructions to the synthesis subagent to refuse input it judges insufficient."},
    {k:"D", text:"A larger context window on the coordinator so it can hold all four outputs at once."}
  ],
  correct:["A"],
  explain:{
    why:"Aggregation is only half the coordinator's job. It also has to judge whether what came back is good enough to proceed on, and re-delegate when it is not. Without that step the pipeline runs to completion regardless of quality.",
    distractors:{
      B:"A longer timeout helps if the cause was slowness, but it does nothing about the coordinator proceeding on a poor result once it arrives.",
      C:"Pushing the judgement downstream puts it in the agent with the least context about what was requested, and the synthesis agent still has to produce something.",
      D:"Context capacity is not the constraint; the coordinator received all four outputs and chose to proceed."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-i", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"A coordinator dispatches the same broad query to three research subagents and merges the results, reasoning that three attempts beat one. Cost triples and coverage improves by under 5%. What went wrong?",
  options:[
    {k:"A", text:"Identical assignments produce overlapping work rather than additional coverage."},
    {k:"B", text:"The three subagents shared a context window, so later ones saw the earlier results."},
    {k:"C", text:"Merging by union discards findings that appear in only one of the three."},
    {k:"D", text:"Three subagents exceed the recommended fan-out, so the third was silently dropped."}
  ],
  correct:["A"],
  explain:{
    why:"Parallel capacity only buys coverage if the assignments differ. Given the same query, three agents largely retrace the same ground, so you pay three times for close to one agent's result.",
    distractors:{
      B:"Subagents have isolated context by design, so none of them could see what the others were finding.",
      C:"A union merge keeps everything including singletons; the shortfall is in what was gathered, not in how it was combined.",
      D:"There is no such fan-out limit, and all three ran, which is exactly why the cost tripled."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-j", domain:1, ts:"1.2", scenario:1, type:"single",
  stem:"A support coordinator delegates a billing question to a specialist subagent, which returns a correct but bare figure. The customer reply omits the context they asked for. Where should the shortfall be addressed?",
  options:[
    {k:"A", text:"In the coordinator, which owns composing the customer-facing response from subagent output."},
    {k:"B", text:"In the billing subagent, which should write the full customer reply itself."},
    {k:"C", text:"In the system prompt, by asking every one of the subagents to write in a customer-friendly register."},
    {k:"D", text:"In the customer's original message, which should be rewritten before delegation."}
  ],
  correct:["A"],
  explain:{
    why:"Subagents return findings; the coordinator turns findings into a resolution. It is the only component that saw the whole customer message, so it is the only one that knows which parts of the question remain unanswered.",
    distractors:{
      B:"A specialist writing the final reply has only its own slice of the case, so it cannot address the concerns handled elsewhere in the same message.",
      C:"Register is a reasonable thing to standardise, but tone was not the gap; the missing context was.",
      D:"Rewriting the customer's words risks discarding the very detail that is missing from the reply."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-k", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Which responsibility belongs to the coordinator rather than to a subagent?",
  options:[
    {k:"A", text:"Deciding which subagents a given query actually requires."},
    {k:"B", text:"Choosing which search terms to use for an assigned subtopic."},
    {k:"C", text:"Recovering locally from a transient timeout on its own tool call."},
    {k:"D", text:"Judging whether a retrieved source is relevant to its assigned scope."}
  ],
  correct:["A"],
  explain:{
    why:"Only the coordinator sees the whole query and the full roster, so routing is its decision. The others are judgements a specialist makes within the scope it was given.",
    distractors:{
      B:"Query formulation is exactly what a search subagent is specialised for, and dictating terms from above removes its ability to adapt.",
      C:"Local recovery from transient failures is the subagent's job; escalating every retry would flood the coordinator with noise it cannot act on.",
      D:"Relevance within an assigned scope is a specialist judgement, and the coordinator lacks the retrieved material to make it."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-l", domain:1, ts:"1.2", scenario:4, type:"single",
  stem:"A codebase-exploration coordinator spawns a subagent per directory. On a repository with 300 directories the run costs far more than reading the code directly. What principle was missed?",
  options:[
    {k:"A", text:"Decomposition should follow the shape of the question, not the shape of the filesystem."},
    {k:"B", text:"Subagents should always be spawned sequentially rather than in parallel."},
    {k:"C", text:"Each subagent should have been given the full repository for context."},
    {k:"D", text:"Directory-level work should sit with the coordinator and file-level work be delegated out."}
  ],
  correct:["A"],
  explain:{
    why:"Delegation earns its cost when a subtask is substantial and self-contained. Mapping one subagent onto each directory ignores whether that directory has anything to do with the question, so most of the fan-out investigates nothing relevant.",
    distractors:{
      B:"Sequential execution would make the same 300 investigations slower without making any of them more useful.",
      C:"Giving each subagent the whole repository multiplies the context cost by 300 and still does not make the irrelevant directories worth visiting.",
      D:"Swapping which layer handles which granularity leaves the same problem: the work is being divided by structure rather than by relevance."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-m", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"After adding an iterative refinement loop, your coordinator re-delegates and re-synthesises up to twelve times on broad topics before it is satisfied. What should bound it?",
  options:[
    {k:"A", text:"An explicit coverage criterion, so the loop ends on the goal being met."},
    {k:"B", text:"A hard cap of two refinement rounds, applied to every topic regardless of breadth."},
    {k:"C", text:"Removing refinement entirely, since the first synthesis is usually adequate."},
    {k:"D", text:"Delegating the stopping decision to the synthesis subagent, which sees the report."}
  ],
  correct:["A"],
  explain:{
    why:"A refinement loop needs a definition of done. Stated coverage criteria let a narrow topic finish in one round and a broad one take four, and both terminate for the same principled reason.",
    distractors:{
      B:"A flat cap is simple and predictable, but it truncates genuinely broad topics at the same point it comfortably fits narrow ones.",
      C:"Removing refinement returns you to shipping whatever the first pass produced, which is the gap the loop was added to close.",
      D:"The synthesis subagent sees only the findings it was handed, so it cannot tell whether the topic as a whole has been covered."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-n", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Two subagents report contradictory findings on the same sub-question. What should the coordinator do?",
  options:[
    {k:"A", text:"Carry both forward with attribution and let synthesis present the disagreement."},
    {k:"B", text:"Re-run both subagents until they converge on the same answer."},
    {k:"C", text:"Accept the finding from whichever subagent returned more sources."},
    {k:"D", text:"Drop the sub-question from the report, since the evidence is unreliable."}
  ],
  correct:["A"],
  explain:{
    why:"Two credible agents disagreeing is usually a real disagreement in the sources, not a bug. Preserving both with attribution tells the reader something true; silently resolving it invents a certainty the evidence does not support.",
    distractors:{
      B:"Re-running until agreement selects for consensus rather than accuracy, and may simply converge on whichever answer is easier to find.",
      C:"Source count measures how much was written, not which account is correct; a well-covered error is still an error.",
      D:"Dropping the sub-question hides a genuine finding, and contested points are often the ones most worth reporting."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-o", domain:1, ts:"1.2", scenario:1, type:"single",
  stem:"A customer message needs an order lookup and a policy check. Your coordinator runs them sequentially because the policy check 'might depend on' the order. Inspection shows it never does. What is the cost?",
  options:[
    {k:"A", text:"Latency roughly doubles for no benefit, since the two are genuinely independent."},
    {k:"B", text:"The policy check receives stale order data, because it runs after the lookup completes."},
    {k:"C", text:"The coordinator cannot aggregate results that arrived at different times."},
    {k:"D", text:"Sequential delegation prevents the two subagents from sharing customer context."},
  ],
  correct:["A"],
  explain:{
    why:"Two independent lookups run concurrently in the time of the slower one. Serialising them on a dependency that does not exist is a straight latency loss, which matters when a customer is waiting.",
    distractors:{
      B:"Running later means fresher data, not staler, so ordering does not harm correctness here.",
      C:"Aggregation is unaffected by arrival time; the coordinator simply waits for both.",
      D:"Shared context comes from what the coordinator puts in each prompt, and is available whether the calls are concurrent or not."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-p", domain:1, ts:"1.2", scenario:5, type:"single",
  stem:"A CI coordinator delegates per-file review to subagents, then asks a final subagent to write the summary comment. The summary contradicts individual file findings. What is the likely cause?",
  options:[
    {k:"A", text:"The summariser was given the files rather than the findings, so it reviewed afresh."},
    {k:"B", text:"The per-file subagents ran in parallel, so their findings arrived in a non-deterministic order."},
    {k:"C", text:"The summary subagent inherited the coordinator's context and merged it with its own."},
    {k:"D", text:"Contradictions are unavoidable when more than one subagent reviews the same pull request."}
  ],
  correct:["A"],
  explain:{
    why:"A summariser handed source files does the review again, in a single pass, with none of the depth the per-file agents applied. Give it the findings and its job becomes combining them, which is what you actually wanted.",
    distractors:{
      B:"Arrival order affects how you assemble the list, not whether the conclusions conflict.",
      C:"Subagents do not inherit coordinator context; whatever this one saw was placed in its prompt deliberately.",
      D:"Contradictions are avoidable precisely by having the summary work from the findings rather than forming independent ones."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-q", domain:1, ts:"1.2", scenario:3, type:"multi",
  stem:"Which two are genuine reasons to route all subagent communication through the coordinator? (Select 2.)",
  options:[
    {k:"A", text:"One component sees every delegation, so failures are observable in a single place."},
    {k:"B", text:"Error handling stays consistent, rather than each agent inventing its own recovery."},
    {k:"C", text:"It reduces total token usage, because messages travel a shorter path."},
    {k:"D", text:"It allows subagents to share a single context window and avoid duplication."}
  ],
  correct:["A","B"],
  explain:{
    why:"Hub-and-spoke buys observability and consistency. Every delegation and every failure passes through one component, so behaviour can be seen and error policy applied uniformly.",
    distractors:{
      C:"Routing through a hub adds a hop rather than removing one, so token usage goes up slightly, not down.",
      D:"Subagents keep isolated context under any topology; the coordinator does not merge their windows."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-r", domain:1, ts:"1.2", scenario:4, type:"single",
  stem:"An engineer proposes that the coordinator write its delegation decisions to a log the subagents can read, so they know what the others are doing. What is the strongest objection?",
  options:[
    {k:"A", text:"It rebuilds shared state, reintroducing the coupling isolation removes."},
    {k:"B", text:"Subagents cannot perform file reads at all, so they would have no way to access the log."},
    {k:"C", text:"The log would exceed the context window of any subagent that tried to read it."},
    {k:"D", text:"Delegation decisions are not knowable until every subagent has returned."}
  ],
  correct:["A"],
  explain:{
    why:"Isolation is what keeps a subagent's behaviour a function of its prompt alone, which makes it testable and its failures local. A shared log recreates a channel between peers with none of the coordinator's oversight.",
    distractors:{
      B:"Subagents routinely have file tools, so access is a configuration matter rather than an obstacle.",
      C:"A delegation log is small, and size would not be the reason to reject the design.",
      D:"The coordinator makes each decision before dispatching, so they are available to write down at the time."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-s", domain:1, ts:"1.2", scenario:6, type:"single",
  stem:"An extraction pipeline uses a coordinator with one subagent per document type. A new document type appears and is routed to the closest existing subagent, producing confidently wrong output. What should change?",
  options:[
    {k:"A", text:"The coordinator should recognise when no subagent fits and route the document for review."},
    {k:"B", text:"The closest subagent should be broadened until it covers every document type."},
    {k:"C", text:"A subagent should be created for every document type the business might ever receive."},
    {k:"D", text:"The document should be reformatted to match the nearest supported type before it is routed."}
  ],
  correct:["A"],
  explain:{
    why:"Forced routing turns an unknown into a plausible-looking error. A coordinator that can say 'none of these fit' converts a silent extraction failure into a visible one a human can resolve.",
    distractors:{
      B:"A subagent broad enough for everything loses the specialisation that made per-type extraction accurate in the first place.",
      C:"Enumerating future document types in advance is not achievable, and the next unanticipated one recreates the problem.",
      D:"Reshaping a document to fit a schema it does not match discards or distorts exactly the fields that differ."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.2-t", domain:1, ts:"1.2", scenario:2, type:"single",
  stem:"A developer asks why the coordinator should decide which subagents to run, rather than running all of them and letting each decide whether it has anything to contribute. What is the strongest answer?",
  options:[
    {k:"A", text:"An agent asked whether it is relevant will usually find something to say."},
    {k:"B", text:"Subagents cannot decline an invocation once it has been dispatched."},
    {k:"C", text:"Running every subagent exceeds the maximum concurrent delegations allowed."},
    {k:"D", text:"Only the coordinator has permission to invoke tools on the subagents' behalf."}
  ],
  correct:["A"],
  explain:{
    why:"Self-selection is weak: a document-analysis agent handed an irrelevant query tends to produce a thin, plausible answer rather than an abstention, and that output then flows into synthesis as though it were a finding.",
    distractors:{
      B:"An agent can certainly return an empty result; the difficulty is that it usually will not.",
      C:"There is no such concurrency ceiling, and the objection would be about cost rather than correctness.",
      D:"Subagents invoke their own tools; the coordinator does not proxy for them."
    }
  },
  refs:[R_SUB] },

/* ---- Domain 1 expansion: task statements 1.3 and 1.4 ---- */

{ id:"d1-1.3-h", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"Your coordinator passes the synthesis subagent a 40,000-token dump of raw search results. The subagent's report is shallow and misses several findings buried in the middle. What should the coordinator pass instead?",
  options:[
    {k:"A", text:"Structured findings pairing claim, excerpt and source, not raw retrieved text."},
    {k:"B", text:"The same dump, split across several sequential Task calls to the same subagent."},
    {k:"C", text:"A summary the coordinator writes itself, discarding the underlying source material."},
    {k:"D", text:"The raw dump unchanged, with an instruction to read through it twice before drawing any conclusions."}
  ],
  correct:["A"],
  explain:{
    why:"Raw retrieval is mostly noise, and material in the middle of a very long input is the least reliably attended. Structured findings carry what synthesis needs at a fraction of the tokens, and keep attribution attached to each claim.",
    distractors:{
      B:"Splitting helps with sheer length, but each call still receives unstructured text, and the subagent now cannot see all the findings together to combine them.",
      C:"A coordinator-written summary is more compact, but it strips the evidence and sources that make a synthesised report citable.",
      D:"Instructing more careful reading does not change the attention profile of a very long input; the middle stays weakest."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-i", domain:1, ts:"1.3", scenario:4, type:"single",
  stem:"A coordinator spawns an exploration subagent with the prompt 'Investigate the authentication module.' The subagent returns a general description of authentication patterns rather than findings about this codebase. What is missing?",
  options:[
    {k:"A", text:"The paths, entry points and specific questions that make the task concrete."},
    {k:"B", text:"A tool restriction limiting the subagent to read-only operations."},
    {k:"C", text:"A larger model, since the assigned model lacked the depth for code analysis."},
    {k:"D", text:"An instruction to avoid drawing on background knowledge of authentication patterns."}
  ],
  correct:["A"],
  explain:{
    why:"A subagent inherits nothing, so 'the authentication module' names something it cannot locate. With no starting path and no specific question, describing authentication in general is the only response the prompt actually supports.",
    distractors:{
      B:"Read-only restrictions are good hygiene for exploration, but they constrain what the subagent may do rather than telling it where to look.",
      C:"Model capability is not the limit here; no model can investigate a module it has not been pointed at.",
      D:"Forbidding background knowledge removes the fallback without supplying the specifics, so the subagent would have even less to work with."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-j", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"You define a subagent whose description reads 'Handles analysis tasks.' The coordinator routes document analysis, statistical work and code review to it indiscriminately. What is the fix?",
  options:[
    {k:"A", text:"Rewrite the description to state the specific work it does and what it should not receive."},
    {k:"B", text:"Add a tool restriction so it can only perform document analysis."},
    {k:"C", text:"Give the coordinator a routing table mapping task keywords to subagent names."},
    {k:"D", text:"Rename the subagent to `document_analysis_agent` and leave the description as it is."}
  ],
  correct:["A"],
  explain:{
    why:"The description is what the coordinator reads when choosing, and 'handles analysis tasks' matches all three kinds of work. Naming the intended scope and the boundary against neighbours is what makes the choice determinate.",
    distractors:{
      B:"Restricting tools stops the subagent doing the wrong work well, but it is still selected for it, so those tasks now fail instead of being routed elsewhere.",
      C:"A keyword table is brittle and duplicates a decision the description should already support, though it is a reasonable fallback when descriptions genuinely cannot disambiguate.",
      D:"A better name helps a little, but the description is the primary signal and it still claims all analysis work."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-k", domain:1, ts:"1.3", scenario:1, type:"single",
  stem:"A support coordinator invokes a refund subagent with 'Process the refund we discussed.' The subagent asks which order it should refund. Why?",
  options:[
    {k:"A", text:"It has no access to the conversation, so 'we discussed' refers to nothing it can see."},
    {k:"B", text:"The refund tool requires an order ID that this particular subagent lacks permission to look up."},
    {k:"C", text:"The coordinator's context exceeded the size that can be inherited on invocation."},
    {k:"D", text:"Subagents receive the conversation history only on their second and later invocations."}
  ],
  correct:["A"],
  explain:{
    why:"The prompt is the only channel into a subagent. A reference back to a shared conversation is empty from inside an isolated context, so the subagent asks for the one fact it needs and was not given.",
    distractors:{
      B:"A permissions problem would surface as a tool error rather than a clarifying question about which order was meant.",
      C:"Nothing is inherited at any size, so there is no threshold that was crossed here.",
      D:"No invocation inherits history, first or later; each one starts from its prompt alone."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-l", domain:1, ts:"1.3", scenario:4, type:"single",
  stem:"You want two subagents to explore the same repository concurrently, one tracing data flow and one cataloguing tests. Which coordinator behaviour achieves that?",
  options:[
    {k:"A", text:"Both Task calls emitted in one assistant turn, each with its own scoped prompt."},
    {k:"B", text:"One Task call whose prompt asks a single subagent to perform both investigations."},
    {k:"C", text:"Two Task calls in consecutive turns, with the second one referencing the first."},
    {k:"D", text:"One Task call repeated twice with the same prompt, relying on sampling variation."}
  ],
  correct:["A"],
  explain:{
    why:"Concurrency comes from multiple Task calls within a single assistant turn. Separate scoped prompts also keep each subagent's context focused on one question rather than two.",
    distractors:{
      B:"A single subagent doing both runs them sequentially inside one context, which is the serialisation you were trying to avoid.",
      C:"Calls in consecutive turns are sequential by construction, since each turn must return before the next begins.",
      D:"Identical prompts produce overlapping work rather than two different investigations, whatever the sampling does."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-m", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"Your subagent definitions all specify the same broad tool set. The document-analysis agent begins issuing web searches when its assigned sources are thin. What does this illustrate?",
  options:[
    {k:"A", text:"An agent given tools beyond its role will use them when its own path is blocked."},
    {k:"B", text:"Tool definitions leak between subagents when they share a coordinator."},
    {k:"C", text:"Document analysis cannot be performed without a web search capability."},
    {k:"D", text:"The coordinator failed to specify which tool each of the subagents ought to call first."}
  ],
  correct:["A"],
  explain:{
    why:"Availability drives use. Faced with thin sources and a search tool in reach, the agent takes the path that produces an answer, which quietly turns your analysis specialist into a second-rate researcher.",
    distractors:{
      B:"Each subagent's tools come from its own definition; nothing is inherited from a sibling.",
      C:"Document analysis operates on supplied documents, and needing to search for more is a sign the assignment was underspecified.",
      D:"Dictating call order would constrain the symptom without removing the capability that made it possible."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-n", domain:1, ts:"1.3", scenario:1, type:"single",
  stem:"A coordinator prompt for an escalation subagent reads: 'Escalate this. Include everything relevant.' Handoffs vary widely in what they contain. What would improve consistency most?",
  options:[
    {k:"A", text:"Naming the required fields, so every handoff carries the same structure."},
    {k:"B", text:"Asking the subagent to be thorough and to double-check before submitting."},
    {k:"C", text:"Giving the subagent access to the full transcript so it can decide what matters."},
    {k:"D", text:"Increasing the subagent's output token limit so that nothing is truncated."}
  ],
  correct:["A"],
  explain:{
    why:"'Everything relevant' is a judgement the subagent re-makes each time. Listing customer ID, root cause, amount and recommended action turns it into a form to complete, which is why the output stops varying.",
    distractors:{
      B:"Thoroughness instructions raise effort without defining what a complete handoff contains, so the variation persists.",
      C:"More material to sift through widens the judgement rather than narrowing it, and the human receiving the handoff still gets a different shape each time.",
      D:"Truncation is not the issue; the handoffs differ in what they choose to include, not in being cut off."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-o", domain:1, ts:"1.3", scenario:4, type:"single",
  stem:"An engineer argues that since subagents cannot see the parent conversation, the coordinator should paste its entire history into every subagent prompt. What is the objection?",
  options:[
    {k:"A", text:"It spends the subagent's context on material irrelevant to its narrow task."},
    {k:"B", text:"Conversation history cannot be embedded in a Task prompt for structural reasons."},
    {k:"C", text:"The subagent would then inherit the coordinator's tools along with its history."},
    {k:"D", text:"Pasted history is treated as instructions, so the subagent would follow the user's earlier requests."}
  ],
  correct:["A"],
  explain:{
    why:"Isolation exists so a subagent works in a clean window on one question. Pasting everything in forfeits that benefit and pushes the relevant instruction into the middle of a long input, where it is least reliably read.",
    distractors:{
      B:"History is just text and embeds fine; the objection is about what it costs, not whether it is possible.",
      C:"Tools come from the subagent's own definition and are unaffected by what its prompt contains.",
      D:"This is a real hazard worth care in prompt construction, but it is a framing problem rather than the primary reason to avoid wholesale pasting."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-p", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"You need the synthesis subagent to keep source attribution intact. Which prompt structure best supports that?",
  options:[
    {k:"A", text:"Discrete records pairing claim, source and excerpt."},
    {k:"B", text:"Findings as prose, with a numbered bibliography appended at the end."},
    {k:"C", text:"Findings as prose, with an instruction to cite carefully throughout."},
    {k:"D", text:"Findings as prose, followed by the full text of every source consulted."}
  ],
  correct:["A"],
  explain:{
    why:"Attribution survives a hop when the claim-to-source link is a structural property of the input rather than something to be inferred. Discrete records make the mapping explicit and hard to lose in compression.",
    distractors:{
      B:"A detached bibliography lists what was read without saying which entry supports which claim, so the mapping must be guessed.",
      C:"An instruction to cite carefully cannot recover a mapping the input never contained.",
      D:"Full source text is expensive and still leaves the subagent to work out which passage backs which statement."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-q", domain:1, ts:"1.3", scenario:1, type:"single",
  stem:"Which statement about the `AgentDefinition` tools field is correct?",
  options:[
    {k:"A", text:"It bounds what the subagent may do, but not whether it is selected."},
    {k:"B", text:"It is the primary signal the coordinator uses when choosing between subagents."},
    {k:"C", text:"It is merged with the coordinator's own tool set at invocation time."},
    {k:"D", text:"It must list every tool the coordinator holds, or the invocation is rejected."}
  ],
  correct:["A"],
  explain:{
    why:"Selection happens before invocation and is driven by the description. The tool list takes effect afterwards, constraining what the chosen subagent can actually do.",
    distractors:{
      B:"The description carries the selection signal; the tool list is not what the coordinator reads when deciding.",
      C:"Tool sets are per-definition and are not merged, which is precisely how scoped access is achieved.",
      D:"A subagent normally holds a narrower set than its coordinator, and that difference is the point."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-r", domain:1, ts:"1.3", scenario:6, type:"single",
  stem:"An extraction coordinator invokes a validation subagent after each document. The validator reports every document as valid, including ones with obvious field errors. Its prompt contains only the extracted JSON. What is missing?",
  options:[
    {k:"A", text:"The source document, without which there is nothing to check against."},
    {k:"B", text:"A stricter instruction emphasising that it should look hard for errors."},
    {k:"C", text:"The JSON schema, so the validator can confirm the structure is well formed."},
    {k:"D", text:"Field-level confidence scores from the extraction step to guide its attention."}
  ],
  correct:["A"],
  explain:{
    why:"Validation is a comparison. Given only the output, the validator can confirm it looks like a well-formed record but has nothing to check the values against, so everything passes.",
    distractors:{
      C:"A schema catches structural problems, but tool-use extraction has already guaranteed those; the errors here are in the values.",
      B:"Exhortation cannot supply the missing half of a comparison, so the validator would look hard at the only thing it has.",
      D:"Confidence scores help route attention, but with no source to compare against there is still nothing to verify."
    }
  },
  refs:[R_STRUCT] },

{ id:"d1-1.3-s", domain:1, ts:"1.3", scenario:2, type:"single",
  stem:"You are exploring two refactoring strategies from a shared codebase analysis, and want each branch to inherit that analysis without seeing the other's reasoning. Which mechanism fits?",
  options:[
    {k:"A", text:"Forking once the analysis is complete, so both branches share a baseline."},
    {k:"B", text:"Spawning two subagents, each passed the analysis in its prompt."},
    {k:"C", text:"Running both strategies in one session and comparing at the end."},
    {k:"D", text:"Resuming the analysis session twice in sequence, once per strategy."}
  ],
  correct:["A"],
  explain:{
    why:"Forking is built for divergent exploration from a common point: both branches carry the completed analysis and then evolve independently, which is exactly the comparison you want.",
    distractors:{
      B:"Subagents would work, but each pays to re-ingest the analysis through its prompt and returns a summary rather than an explorable branch you can continue.",
      C:"One session means the second strategy is anchored on the first, which is the contamination the requirement rules out.",
      D:"Sequential resumption of the same session carries the first exploration into the second, so the branches are not independent."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.3-t", domain:1, ts:"1.3", scenario:4, type:"single",
  stem:"A coordinator emits three Task calls in one turn. Two subagents succeed and one fails. What should the coordinator receive?",
  options:[
    {k:"A", text:"All three results together, with the failure reported as such alongside the two successes."},
    {k:"B", text:"Only the two successful results, with the failure retried transparently before anything is returned to the coordinator."},
    {k:"C", text:"An error for the whole turn, since one call in the batch did not complete."},
    {k:"D", text:"The two successes immediately and the failure in a later turn once it resolves."}
  ],
  correct:["A"],
  explain:{
    why:"Every call in the turn is answered, and a failure is a legitimate answer. The coordinator can then decide whether to proceed on partial results, re-delegate, or annotate a gap.",
    distractors:{
      B:"Silent retries hide information the coordinator may want, and if the retry also fails you have delayed the decision without improving it.",
      C:"Failing the whole turn discards two successful investigations over one problem that may well be routable around.",
      D:"Deferring part of a turn leaves calls unanswered within it, which is not a valid continuation of that turn."
    }
  },
  refs:[R_SUB] },

{ id:"d1-1.4-h", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"Your prerequisite gate blocks `process_refund` until `get_customer` succeeds. A customer with a verified identity is refused because the verification happened three turns earlier and the gate only inspects the current turn. What is the defect?",
  options:[
    {k:"A", text:"The gate should evaluate conversation state, not a single turn."},
    {k:"B", text:"The gate should be removed, since it now blocks legitimate refunds."},
