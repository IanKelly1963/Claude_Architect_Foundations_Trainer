<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Architect Trainer</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  /* Single dark palette. High-contrast by measurement, not by eye:
     tools/contrast.js checks every foreground/background pair this
     stylesheet actually uses against WCAG AA and fails the build below it.

     Ground is near-black rather than #000 so that panels can step up in
     lightness to express elevation, and so pure-white text does not halate
     against it on OLED. The neutral ramp carries a slight warm cast to sit
     with the terracotta accent instead of fighting it. */
  --bg:#0b0b0a; --panel:#141413; --panel-2:#1c1c1a; --panel-3:#262623;
  --ink:#f7f5f1; --ink-2:#d0ccc4; --ink-3:#aea9a0;
  --line:#302f2c; --line-2:#67655e;
  --accent:#ff9166; --accent-ink:#1a0d06;
  /* Status hues are lifted and desaturated relative to their light-mode
     equivalents: fully saturated colour vibrates against a dark ground and
     cannot reach 4.5:1 as text. Each pairs a light foreground for use on
     panels with a deep tinted background and a mid-tone border. */
  --good:#5fdca1; --good-bg:#0e2418; --good-line:#3a7a5a; --good-ink:#04170d;
  --warn:#f6c058; --warn-bg:#251c0c; --warn-line:#856728; --warn-ink:#1d1403;
  --bad:#ff9184;  --bad-bg:#2a1310;  --bad-line:#a64c40;  --bad-ink:#210806;
  --info:#7ac8f4; --info-bg:#0d1f2a; --info-line:#347192; --info-ink:#04161f;
  --focus:#ffd08a;
  --r:10px; --r-sm:7px;
  /* On a dark ground a drop shadow reads as dirt rather than lift, so
     elevation comes from the --panel/--panel-2/--panel-3 lightness ramp and
     the shadow only anchors the card edge. */
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.34);
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.25; margin:0; font-weight:640; letter-spacing:-.011em}
p{margin:0 0 .7em}
code,kbd{font-family:var(--mono); font-size:.88em; background:var(--panel-3);
  border:1px solid var(--line-2); border-radius:5px; padding:.08em .34em; color:var(--ink)}
a{color:var(--accent); text-underline-offset:2px}
::selection{background:rgba(255,145,102,.28); color:var(--ink)}
/* The app is fully keyboard-driven (1-4 to answer, Enter to submit, arrows
   to move between exam questions) but had no visible focus indication at
   all. One ring, on :focus-visible so a mouse click does not draw it. */
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
.btn:focus-visible,.opt:focus-visible,nav.tabs button:focus-visible,
.note-nav button:focus-visible,.tstable tbody tr:focus-visible{outline-offset:2px}
.opt:focus-visible{border-color:var(--focus)}
.topbar{position:sticky; top:0; z-index:40; background:rgba(11,11,10,.86);
  backdrop-filter:saturate(140%) blur(10px); -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px; margin:0 auto; padding:0 20px}
.tb-row{display:flex; align-items:center; gap:16px; padding:12px 0 10px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-size:24px; font-weight:660; letter-spacing:-.02em; white-space:nowrap}
.brand span{font-size:24px; color:var(--ink-3); font-family:var(--mono); white-space:nowrap}
.readypill{display:flex; align-items:center; gap:9px; background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:4px 13px 4px 13px}
.readypill .lbl{font-size:20px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; font-weight:640}
.readypill .val{font-size:20px; font-weight:680; font-variant-numeric:tabular-nums}
nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--ink-2); font:inherit; font-size:13.5px; font-weight:560;
  padding:9px 13px 10px; cursor:pointer; white-space:nowrap; margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
main{max-width:1120px; margin:0 auto; padding:26px 20px 90px}
.view{display:none} .view.on{display:block}
.btn{appearance:none; font:inherit; font-size:13.5px; font-weight:560; cursor:pointer;
  background:var(--panel); color:var(--ink); border:1px solid var(--line-2);
  border-radius:var(--r-sm); padding:7px 13px; transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-3); border-color:var(--ink-3)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{font-size:12.5px; padding:5px 10px}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-3); color:var(--ink)}
/* Same domain colours as .tag.d1-d5, reused rather than a second colour
   system, for domain-filter buttons (Flashcards, Practice's "drill one
   domain"). Hover brightens by filter rather than swapping to a new
   background, so text and fill scale together and contrast holds. */
.btn.d1{background:var(--info-bg); color:var(--info); border-color:var(--info-line)}
.btn.d2{background:var(--good-bg); color:var(--good); border-color:var(--good-line)}
.btn.d3{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line)}
.btn.d4{background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line)}
.btn.d5{background:var(--panel-3); color:var(--ink-2); border-color:var(--line-2)}
.btn.d1:hover,.btn.d2:hover,.btn.d3:hover,.btn.d4:hover,.btn.d5:hover{filter:brightness(1.18)}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.stat-good{color:var(--good)} .stat-warn{color:var(--warn)} .stat-bad{color:var(--bad)}
.small{font-size:13px} .xs{font-size:12px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
.sec-head{margin:0 0 13px}
.sec-head h2{font-size:17px}
.sec-head p{margin:3px 0 0; font-size:13.5px; color:var(--ink-2); max-width:76ch}
hr.sep{border:0; border-top:1px solid var(--line); margin:22px 0}
.tag{display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:600;
  padding:2px 6px; border-radius:5px; background:var(--panel-3); color:var(--ink-2);
  border:1px solid var(--line); letter-spacing:.02em}
.tag.d1{background:var(--info-bg); color:var(--info); border-color:var(--info-line)}
.tag.d2{background:var(--good-bg); color:var(--good); border-color:var(--good-line)}
.tag.d3{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line)}
.tag.d4{background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line)}
.tag.d5{background:var(--panel-3); color:var(--ink-2)}
.callout{border:1px solid var(--line); border-left-width:3px; border-radius:var(--r-sm);
  padding:11px 14px; margin:12px 0; font-size:13.5px; background:var(--panel-2)}
.callout .ct{font-weight:660; font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px}
.callout.warn{background:var(--warn-bg); border-color:var(--warn-line); border-left-color:var(--warn)}
.callout.warn .ct{color:var(--warn)}
.callout.info{background:var(--info-bg); border-color:var(--info-line); border-left-color:var(--info)}
.callout.info .ct{color:var(--info)}
.callout.good{background:var(--good-bg); border-color:var(--good-line); border-left-color:var(--good)}
.callout.good .ct{color:var(--good)}
.callout.bad{background:var(--bad-bg); border-color:var(--bad-line); border-left-color:var(--bad)}
.callout.bad .ct{color:var(--bad)}
.callout p:last-child{margin-bottom:0}
.bar{height:6px; border-radius:99px; background:var(--panel-3); overflow:hidden;
  position:relative; box-shadow:inset 0 0 0 1px var(--line)}
.bar > i{display:block; height:100%; border-radius:99px; background:var(--ink-3);
  transition:width .45s cubic-bezier(.3,.9,.3,1)}
.bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.hero{display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center}
.ring{position:relative; width:132px; height:132px; flex:none}
.ring svg{transform:rotate(-90deg); display:block}
.ring .rt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .rt b{font-size:29px; font-weight:680; letter-spacing:-.03em; line-height:1}
.ring .rt span{font-size:10px; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.07em; font-weight:640; margin-top:4px}
.hero-txt h2{font-size:19px; margin-bottom:5px}
.hero-txt p{font-size:13.5px; color:var(--ink-2); max-width:64ch; margin-bottom:0}
.hero-cta{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap}
.dgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:12px; margin-top:16px}
.dcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px; box-shadow:var(--shadow)}
.dcard .dh{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.dcard .dn{font-size:12.5px; font-weight:620; line-height:1.3}
.dcard .dv{font-size:19px; font-weight:680; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.dcard .dm{font-size:11.5px; color:var(--ink-3); margin:5px 0 8px; display:flex; justify-content:space-between}
.tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}
.tstable{width:100%; border-collapse:collapse; font-size:13.5px; min-width:340px}
.tstable th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-3); font-weight:660; padding:0 10px 7px; border-bottom:1px solid var(--line); white-space:nowrap}
.tstable td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
.tstable tr:last-child td{border-bottom:0}
.tstable tbody tr{cursor:pointer}
.tstable tbody tr:hover td{background:var(--panel-2)}
.tstable .tsid{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); font-weight:600}
.tstable .tsname{font-weight:540}
.tstable .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tstable .barcell{width:110px}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
.chip{display:inline-block; font-size:10px; font-weight:680; padding:2px 7px; border-radius:99px;
  white-space:nowrap; text-transform:uppercase; letter-spacing:.04em; border:1px solid transparent}
.chip.ok{background:var(--good-bg); color:var(--good); border-color:var(--good-line)}
.chip.near{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line)}
.chip.weak{background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line)}
.chip.new{background:var(--panel-3); color:var(--ink-3); border-color:var(--line)}
.qwrap{max-width:840px; margin:0 auto}
.qprog{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.qprog .bar{flex:1; min-width:150px}
.qmeta{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:11px}
.scenario{background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--info);
  border-radius:var(--r-sm); padding:11px 14px; margin-bottom:14px; font-size:13.5px; color:var(--ink-2)}
.scenario b{color:var(--ink); display:block; font-size:12px; text-transform:uppercase;
  letter-spacing:.05em; margin-bottom:4px; color:var(--info)}
.stem{font-size:16px; line-height:1.5; margin-bottom:16px; font-weight:500}
.opts{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
.opt{display:flex; gap:11px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--panel); cursor:pointer; transition:border-color .12s,background .12s;
  font-size:14px; line-height:1.5; text-align:left; width:100%; font-family:inherit; color:var(--ink)}
.opt:hover:not(.locked){border-color:var(--accent); background:var(--panel-2)}
.opt .k{flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:680;
  font-family:var(--mono); color:var(--ink-2); margin-top:1px}
.opt.sel{border-color:var(--accent); background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.opt.locked{cursor:default}
.opt.right{border-color:var(--good); background:var(--good-bg)}
.opt.right .k{background:var(--good); color:var(--good-ink); border-color:transparent}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad); color:var(--bad-ink); border-color:transparent}
.opt.missed{border-color:var(--good); border-style:dashed; background:var(--good-bg)}
.opt.missed .k{border-color:var(--good); color:var(--good)}
.verdict{display:flex; align-items:center; gap:9px; font-weight:660; font-size:14.5px; margin-bottom:10px}
.verdict.right{color:var(--good)} .verdict.wrong{color:var(--bad)}
.expl{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel-2);
  padding:14px 16px; font-size:13.5px; margin-bottom:16px}
.expl h4{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin-bottom:6px}
.expl .why{margin-bottom:12px}
.expl ul{margin:0; padding-left:18px}
.expl li{margin-bottom:5px; color:var(--ink-2)}
.expl li b{color:var(--ink); font-family:var(--mono); font-size:.9em}
.refs{margin-top:12px; padding-top:11px; border-top:1px solid var(--line); font-size:12.5px}
.refs a{margin-right:12px; white-space:nowrap}
.timer{font-family:var(--mono); font-size:14px; font-weight:660; font-variant-numeric:tabular-nums;
  padding:4px 11px; border-radius:99px; background:var(--panel-3);
  border:1px solid var(--line-2); color:var(--ink-2)}
.timer.low{background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line)}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.note-nav{display:flex; flex-direction:column; gap:9px; margin-bottom:18px}
.note-nav-group{display:flex; flex-direction:column; gap:6px}
.note-nav-group > .tag{align-self:flex-start}
.note-nav-tasks{display:flex; flex-wrap:wrap; gap:6px}
.note-nav button{appearance:none; font:inherit; font-size:11.5px; font-family:var(--mono); font-weight:600;
  padding:4px 9px; border-radius:99px; border:1px solid var(--line-2); background:var(--panel);
  color:var(--ink-2); cursor:pointer}
.note-nav button:hover{background:var(--panel-3); color:var(--ink)}
.note-nav button.on{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.note h3{font-size:17px; margin-bottom:3px}
.note .nsub{font-size:12px; color:var(--ink-3); font-family:var(--mono); margin-bottom:14px}
.note h4{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); margin:18px 0 7px}
.note ul{margin:0; padding-left:19px}
.note li{margin-bottom:7px; font-size:14px}
.note .core{font-size:14.5px; color:var(--ink); border-left:3px solid var(--accent);
  padding-left:13px; margin:0 0 4px}
.fcard{max-width:620px; margin:0 auto; min-height:230px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:34px 30px; cursor:pointer}
.fcard .ff{font-size:19px; font-weight:600; line-height:1.4}
.fcard .fb{font-size:15px; color:var(--ink-2); margin-top:16px; padding-top:16px;
  border-top:1px solid var(--line); line-height:1.55; width:100%}
.fcard .hint{font-size:11.5px; color:var(--ink-3); margin-top:18px; text-transform:uppercase; letter-spacing:.06em}
.sess{width:100%; border-collapse:collapse; font-size:13px; min-width:420px}
.sess th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-3); font-weight:660; padding:0 10px 7px; border-bottom:1px solid var(--line)}
.sess td{padding:7px 10px; border-bottom:1px solid var(--line)}
.sess tr:last-child td{border-bottom:0}
.empty{text-align:center; padding:46px 20px; color:var(--ink-3)}
.empty p{max-width:44ch; margin:0 auto .9em}
@media (max-width:720px){
  .hero{grid-template-columns:1fr; gap:18px; justify-items:start}
  main{padding:20px 15px 80px} .topbar-in{padding:0 15px}
  .stem{font-size:15px} .tstable .barcell{display:none} .tstable th.barcell{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="tb-row">
      <div class="brand">
        <b>Architect Trainer</b>
        <span>CCAR-F &middot; Foundations</span>
      </div>
      <div class="readypill" title="Task statements at or above the 85% mastery gate">
        <span class="lbl">Readiness</span>
        <span class="val" id="tbReady">&ndash;</span>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-v="dashboard" aria-selected="true">Dashboard</button>
      <button role="tab" data-v="learn" aria-selected="false">Learn</button>
      <button role="tab" data-v="practice" aria-selected="false">Practice</button>
      <button role="tab" data-v="exam" aria-selected="false">Mock Exam</button>
      <button role="tab" data-v="cards" aria-selected="false">Flashcards</button>
      <button role="tab" data-v="progress" aria-selected="false">Progress</button>
    </nav>
  </div>
</header>

<main>
  <div id="banner"></div>
  <section class="view on" id="v-dashboard"></section>
  <section class="view" id="v-learn"></section>
  <section class="view" id="v-practice"></section>
  <section class="view" id="v-exam"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-progress"></section>
</main>

<script>
/* ============================================================================
   CCAR-F Architect Trainer
   Standalone study + assessment app for the Claude Certified Architect
   Foundations exam. No network calls; all content is inline. Progress is
   persisted to localStorage and can be exported/imported as JSON.
   ============================================================================ */

"use strict";

/* --- Blueprint taxonomy (from the official exam guide, v1.0 July 2026) --- */

const DOMAINS = [
  { d:1, name:"Agentic Architecture & Orchestration", weight:27, exam:16 },
  { d:2, name:"Tool Design & MCP Integration",        weight:18, exam:11 },
  { d:3, name:"Claude Code Configuration & Workflows",weight:20, exam:12 },
  { d:4, name:"Prompt Engineering & Structured Output",weight:20, exam:12 },
  { d:5, name:"Context Management & Reliability",     weight:15, exam:9  }
];

const TASKS = [
  { ts:"1.1", d:1, name:"Design and implement agentic loops" },
  { ts:"1.2", d:1, name:"Orchestrate coordinator-subagent systems" },
  { ts:"1.3", d:1, name:"Subagent invocation, context passing, spawning" },
  { ts:"1.4", d:1, name:"Multi-step workflows: enforcement and handoff" },
  { ts:"1.5", d:1, name:"Agent SDK hooks for interception and normalisation" },
  { ts:"1.6", d:1, name:"Task decomposition strategies" },
  { ts:"1.7", d:1, name:"Session state, resumption, and forking" },
  { ts:"2.1", d:2, name:"Tool interfaces, descriptions, and boundaries" },
  { ts:"2.2", d:2, name:"Structured error responses for MCP tools" },
  { ts:"2.3", d:2, name:"Tool distribution and tool_choice configuration" },
  { ts:"2.4", d:2, name:"Integrating MCP servers into Claude Code" },
  { ts:"2.5", d:2, name:"Selecting built-in tools effectively" },
  { ts:"3.1", d:3, name:"CLAUDE.md hierarchy, scoping, modular organisation" },
  { ts:"3.2", d:3, name:"Custom slash commands and skills" },
  { ts:"3.3", d:3, name:"Path-specific rules for conditional loading" },
  { ts:"3.4", d:3, name:"Plan mode vs direct execution" },
  { ts:"3.5", d:3, name:"Iterative refinement techniques" },
  { ts:"3.6", d:3, name:"Claude Code in CI/CD pipelines" },
  { ts:"4.1", d:4, name:"Explicit criteria to reduce false positives" },
  { ts:"4.2", d:4, name:"Few-shot prompting for consistency" },
  { ts:"4.3", d:4, name:"Structured output via tool use and JSON schemas" },

{ ts:"1.1", title:"Design and implement agentic loops",
  core:"The agentic loop is driven by `stop_reason`, not by reading what the model wrote. Send a request, inspect `stop_reason`, execute any requested tools, append the results, send again. Stop when `stop_reason` is `end_turn`.",
  facts:[
    "The cycle: a request goes to Claude and you inspect `stop_reason`. If it is `tool_use`, execute the requested tool or tools, append the results to the conversation, and send the whole thing again. If it is `end_turn`, the model has finished and you present the answer.",
    "Tool results are returned as a `user` message containing `tool_result` blocks, each keyed to the `tool_use_id` from the assistant's request. That is how the model connects a result to the call that produced it.",

    "Control flow is model-driven: Claude reasons about which tool to call next from accumulated context, rather than following a pre-configured decision tree or fixed tool sequence.",

{ ts:"2.1", title:"Tool interfaces, descriptions, and boundaries",
  core:"The tool description is the primary mechanism the model uses to choose a tool. When selection is unreliable between similar tools, the description is almost always the root cause and the cheapest fix.",

{ ts:"2.2", title:"Structured error responses for MCP tools",
  core:"An error is information the agent has to act on. A uniform 'Operation failed' string tells it nothing, so it cannot choose between retrying, rephrasing, and explaining to the user.",
  facts:[
    "MCP communicates tool failure with the `isError` flag, so the model knows execution failed and can reason about recovery.",
    "Four categories matter and behave differently: transient (timeouts, service unavailable, rate limits), validation (bad input), business (policy violations) and permission (access denied).",
    "Return structured metadata: an `errorCategory`, an `isRetryable` boolean, and a human-readable description.",
    "Transient errors are retryable, ideally with backoff. Business-rule violations never are, so mark them `retriable: false` and include a customer-friendly explanation the agent can relay.",
    "Subagents should recover locally from transient failures and propagate to the coordinator only what they cannot resolve, along with partial results and what was attempted.",
    "Distinguish an access failure (the query could not run) from a valid empty result (the query ran and matched nothing). They demand opposite responses."
  ],
  traps:[
    "Returning the same generic failure message for every error type, which forces the agent to guess.",
    "Retrying a validation error. It will fail identically every time.",

{ ts:"2.3", title:"Tool distribution and tool_choice configuration",

{ ts:"3.1", title:"CLAUDE.md hierarchy, scoping, modular organisation",

{ ts:"3.4", title:"Plan mode vs direct execution",
  core:"Plan mode earns its cost when the change is large, architectural, or has several defensible approaches. A well-scoped fix does not need it.",

{ ts:"3.5", title:"Iterative refinement techniques",
  core:"When prose is being interpreted inconsistently, stop rewriting the prose. Show two or three concrete input/output pairs instead.",
  facts:[

    "For an edge case, give the specific input and the expected output rather than describing the rule."

{ ts:"3.6", title:"Claude Code in CI/CD pipelines",
  core:"`-p` makes it non-interactive. `--output-format json` with `--json-schema` makes the result machine-parseable. CLAUDE.md supplies the project context CI cannot infer.",
  facts:[
    "The `-p` (or `--print`) flag runs Claude Code non-interactively: it processes the prompt, prints the result to stdout and exits. Without it, a pipeline job waiting for interactive input hangs.",
    "`--output-format json` wraps the response in structured JSON with the assistant message, tool calls, token usage and session metadata. Adding `--json-schema` constrains output to your schema, returned in a `structured_output` field.",

    "CLAUDE.md is how CI-invoked Claude Code gets testing standards, fixture conventions and review criteria. Documenting these reduces low-value test output.",
    "When re-running a review after new commits, include the prior findings and instruct Claude to report only new or still-unaddressed issues, so it does not repost duplicates.",

{ ts:"4.1", title:"Explicit criteria to reduce false positives",
  core:"Vague calibration instructions like 'be conservative' do not improve precision. Categorical criteria that name what to report and what to skip do.",
  facts:[
    "Specific criteria beat vague instruction. 'Flag a comment only when the claimed behaviour contradicts the actual code behaviour' works; 'check that comments are accurate' does not.",
    "General instructions such as 'be conservative' or 'only report high-confidence findings' fail to improve precision, because the model's confidence is not well calibrated to correctness.",
    "Define which categories to report (bugs, security) and which to skip (minor style, local conventions), rather than filtering on confidence.",
    "Define explicit severity criteria with a concrete code example at each level to get consistent classification.",
    "False positives are contagious to trust: one noisy category undermines developer confidence in the accurate ones. Temporarily disabling a high-false-positive category while you improve its prompt is a legitimate move to restore trust."
  ],
  traps:[
    "Asking for a confidence score and thresholding on it. The model is often confidently wrong.",
    "Assuming a more capable model fixes precision when the criteria themselves are ambiguous."
  ],
  refs:[R_PROMPT] },

{ ts:"4.2", title:"Few-shot prompting for consistency",
  core:"When detailed instructions still produce inconsistent output, examples are the highest-leverage fix. They also teach judgement on ambiguous cases in a way rules cannot.",
  facts:[
    "Few-shot examples are the most effective technique for consistently formatted, actionable output when instructions alone are not landing.",
    "Two to four targeted examples for ambiguous scenarios work best, and should show the reasoning for why one action was chosen over a plausible alternative.",
    "Examples let the model generalise judgement to novel patterns, rather than matching only the cases you enumerated.",
    "They demonstrate the desired output shape concretely: location, issue, severity, suggested fix.",
    "In extraction they reduce hallucination and handle structural variety: inline citations versus bibliographies, methodology sections versus details embedded in prose, narrative descriptions versus structured tables.",
    "Examples that contrast an acceptable pattern with a genuine issue reduce false positives while preserving generalisation."
  ],
  traps:[
    "Adding examples when the real defect is a thin tool description. Examples cost tokens on every call and leave the root cause in place.",
    "Providing only positive examples when the difficulty is telling acceptable from unacceptable."
  ],
  refs:[R_PROMPT] },

{ ts:"4.3", title:"Structured output via tool use and JSON schemas",
  core:"Tool use with a JSON schema is the reliable way to guarantee schema-compliant output. It removes syntax errors entirely; it does not remove semantic errors.",
  facts:[
    "Define the extraction contract as a tool whose `input_schema` is your JSON schema, then read the structured data out of the `tool_use` response.",
    "`tool_choice: \"auto\"` lets the model answer with text instead of calling the tool. `any` forces some tool call but lets the model pick which. `{\"type\":\"tool\",\"name\":\"...\"}` forces one named tool.",
    "Use `any` to guarantee structured output when several extraction schemas exist and the document type is not known in advance.",
    "Use forced selection to make a specific extraction run first, such as `extract_metadata` before enrichment steps.",
    "Strict schemas eliminate JSON syntax errors but not semantic ones: line items that do not sum to the stated total, or a value placed in the wrong field, still validate.",
    "Make fields optional or nullable when the source may genuinely not contain them. A required field pressures the model to fabricate a value to satisfy the schema.",
    "Design enums for the real world: add `unclear` for ambiguous cases, and an `other` value paired with a detail string for extensible categories.",
    "Put format normalisation rules in the prompt alongside the schema to handle inconsistent source formatting."
  ],
  traps:[
    "Marking everything required and then wondering why absent information comes back invented.",
    "Believing schema validation catches arithmetic or placement mistakes."
  ],
  note:"Tool use with a JSON schema is the exam's answer and remains valid. Current Anthropic docs also offer native **Structured Outputs** through the `output_format` parameter, which constrains generation to a schema directly. If an exam item offers only the tool-use route, that is the intended answer.",
  refs:[R_TOVR, R_STRUCT] },

{ ts:"4.4", title:"Validation, retry, and feedback loops",
  core:"Retry works when the model got the shape wrong. It cannot work when the information was never in the document.",
  facts:[
    "Retry with error feedback: send a follow-up containing the original document, the failed extraction and the specific validation errors, so the model can self-correct.",
    "Retries succeed on format mismatches and structural output errors. They fail on missing information, for example a value that exists only in an external document you did not provide. Re-asking cannot conjure it.",
    "Semantic validation errors (values that do not sum, fields transposed) are distinct from schema syntax errors, which tool use has already eliminated.",
    "Build self-correction into the schema: extract `calculated_total` alongside `stated_total` so a discrepancy is visible, and add a `conflict_detected` boolean for inconsistent source data.",
    "Add a `detected_pattern` field to structured findings so you can analyse which code constructs trigger dismissals and fix false-positive patterns systematically."
  ],
  traps:[

{ ts:"4.5", title:"Efficient batch processing strategies",
  core:"Batch trades latency for cost. Anything a human is actively waiting on cannot use it.",
  facts:[
    "The Message Batches API gives 50% cost savings, with a processing window of up to 24 hours and no guaranteed latency SLA.",
    "It suits non-blocking, latency-tolerant work: overnight reports, weekly audits, nightly test generation. It is unsuitable for blocking workflows such as a pre-merge check a developer is waiting on.",
    "The batch API does not support multi-turn tool calling within a single request; you cannot execute tools mid-request and feed results back.",
    "`custom_id` correlates each request with its response, and must be unique within a batch.",
    "Size submission frequency from the SLA. To guarantee a 30-hour turnaround against a 24-hour worst case, submit every 4 hours rather than once daily.",
    "On failure, resubmit only the failed documents by `custom_id`, with modifications such as chunking anything that exceeded the context limit.",
    "Refine the prompt on a small sample before batching large volumes, to maximise first-pass success and avoid paying for resubmission cycles."
  ],
  traps:[
    "Justifying batch for a blocking check on the grounds that it is 'usually faster than the SLA'. Usually is not a guarantee.",
    "Believing batch results cannot be correlated. That is what `custom_id` is for.",
    "Adding a real-time fallback when batches run long, which is more complexity than simply matching each API to its workload."
  ],
  refs:[R_BATCH] },

{ ts:"4.6", title:"Multi-instance and multi-pass review architectures",
  core:"A model reviewing its own output in the same session carries the reasoning that produced it, and is unlikely to question its own decisions. Use a fresh instance.",
  facts:[
    "Self-review is weak because the generating session retains its own justifications. Asking it to check its work, or enabling extended thinking, does not remove that bias.",
    "An independent review instance, with no prior reasoning context, catches subtle issues more effectively.",
    "Split a large multi-file review into per-file passes for local issues, plus a separate integration pass for cross-file data flow. This avoids attention dilution and the contradictory findings it produces.",

{ ts:"5.1", title:"Managing conversation context over long interactions",
  core:"Summarisation is lossy in exactly the places that matter: numbers, dates and what the customer actually asked for. Keep those in a separate structured layer that is never summarised.",
  facts:[
    "Progressive summarisation condenses numerical values, percentages, dates and customer-stated expectations into vague prose. Those are the facts a resolution depends on.",
    "The fix is a persistent 'case facts' block, carrying amounts, dates, order numbers and statuses, included in every prompt and held outside the summarised history.",
    "For multi-issue sessions, persist structured issue data (order IDs, amounts, statuses) into that separate context layer.",
    "The 'lost in the middle' effect: models process the beginning and end of a long input reliably, but may omit findings from the middle. Put key-findings summaries at the start of aggregated inputs and use explicit section headers.",
    "Tool results accumulate and consume tokens out of all proportion to their relevance, for example 40+ fields returned per order lookup when 5 matter. Trim verbose outputs to relevant fields before they enter context.",
    "The API is stateless, so complete conversation history must be passed in each request to maintain coherence.",
    "Require subagents to include metadata (dates, source locations, methodological context) in structured output so downstream synthesis is accurate.",
    "When a downstream agent has a limited context budget, have upstream agents return structured data (key facts, citations, relevance scores) rather than verbose content and reasoning chains."
  ],
  traps:[
    "Summarising more aggressively when detail is being lost. That accelerates the problem.",
    "Assuming a long-context model reads the middle as reliably as the ends."
  ],
  refs:[R_CTX] },

{ ts:"5.2", title:"Escalation and ambiguity resolution",
  core:"Escalate on explicit request, on policy gaps, and on genuine inability to progress. Do not escalate on sentiment, and do not trust the model's own confidence score.",
  facts:[
    "The legitimate triggers are: the customer asks for a human, the policy has an exception or a gap, or the agent cannot make meaningful progress.",
    "When a customer explicitly demands a human, honour it immediately rather than investigating first.",
    "When the issue is straightforward and within capability, acknowledge frustration and offer resolution; escalate only if the customer reiterates the preference for a human.",
    "Escalate when policy is silent or ambiguous on the specific request, for example competitor price matching when the policy addresses only your own site's adjustments. A gap is not the same as a hard case.",
    "When a lookup returns multiple matches, instruct the agent to ask for an additional identifier rather than picking by heuristic.",
    "Explicit escalation criteria plus few-shot examples showing escalate-versus-resolve is the proportionate first fix for poor calibration."
  ],
  traps:[
    "Self-reported confidence thresholds. An agent that mishandles hard cases is precisely the agent that is confidently wrong about them.",
    "Sentiment-triggered escalation. Frustration does not correlate with complexity, which is the actual variable.",
    "Training a separate classifier before trying prompt fixes. That is ML infrastructure for a prompt problem."
  ],
  refs:[R_PROMPT] },

{ ts:"5.3", title:"Error propagation across multi-agent systems",
  core:"An error crossing an agent boundary should carry enough context for the coordinator to make a decision: what failed, what was attempted, what partial results exist, and what else might work.",
  facts:[
    "Return structured error context: failure type, the query attempted, any partial results, and potential alternative approaches.",
    "Distinguish access failures (a timeout needing a retry decision) from valid empty results (a successful query with no matches). Conflating them destroys the coordinator's ability to respond correctly.",
    "Generic statuses such as 'search unavailable' hide the context the coordinator needs.",

    "Retrying inside the subagent and then reporting only a generic failure. The retries were fine; discarding the context was not."

{ ts:"5.4", title:"Context in large codebase exploration",
  core:"Long sessions degrade in a recognisable way: the agent starts describing typical patterns instead of the specific classes it found earlier. Persist findings outside the context window.",
  facts:[

    "Summarise the key findings of one exploration phase before spawning subagents for the next, and inject that summary into their initial context.",

{ ts:"5.5", title:"Human review workflows and confidence calibration",
  core:"A high aggregate accuracy number can hide a document type that fails badly. Segment before you automate.",
  facts:[
    "Aggregate metrics such as 97% overall can mask poor performance on a specific document type or a specific field.",
    "Analyse accuracy by document type and by field, confirming consistency across all segments, before reducing human review.",
    "Use stratified random sampling of high-confidence extractions to keep measuring the error rate and to detect novel error patterns after automation.",
    "Have the model output field-level confidence scores, then calibrate the review thresholds against a labelled validation set rather than trusting raw scores.",
    "Route low-confidence extractions, and those from ambiguous or self-contradictory documents, to human review so limited reviewer capacity goes where it pays."
  ],

    "Sampling only what failed. You learn nothing about the errors hiding in the high-confidence bucket."
  ],

{ ts:"5.6", title:"Provenance and uncertainty in multi-source synthesis",
  core:"Attribution is lost at summarisation steps unless claim-to-source mappings are made explicit and required to survive each hop.",
  facts:[

  ],
  traps:[

{ id:"d1-1.1-a", domain:1, ts:"1.1", scenario:1, type:"single",
  stem:"Your support agent's loop terminates by checking whether the assistant's text contains a completion phrase such as 'Let me know if you need anything else.' In production, roughly 8% of conversations end while a `tool_use` block is still pending, leaving refunds initiated but never confirmed. What is the correct loop termination condition?",
  options:[
    {k:"A", text:"Continue while `stop_reason` is `tool_use`; terminate when `stop_reason` is `end_turn`."},
    {k:"B", text:"Terminate when the assistant returns any text content block, since text signals a user-facing answer."},
    {k:"C", text:"Cap the loop at 10 iterations and return whatever the last assistant message contained."},
    {k:"D", text:"Ask the model to emit a sentinel token such as `<DONE>` and terminate when that token appears."}
  ],
  correct:["A"],
  explain:{
    why:"`stop_reason` is the API's explicit, deterministic statement of whether the model is waiting on tool results or has finished its turn. Reading it removes the guesswork entirely: `tool_use` means execute the requested tools and iterate, `end_turn` means present the answer.",
    distractors:{
      B:"A single assistant turn can contain both text and `tool_use` blocks. The model often narrates what it is about to do and then calls a tool in the same turn, so text presence is not a completion signal.",
      C:"An iteration cap is a reasonable runaway guard but a poor primary stopping rule. It terminates mid-task on legitimately long workflows and does nothing to detect genuine completion.",
      D:"A sentinel token is still parsing natural language output to infer control flow. It is probabilistic, and it can be omitted or emitted early, when the API already reports the state deterministically."
    }
  },
  refs:[{label:"API: How tool use works", url:"https://platform.claude.com/docs/en/agents-and-tools/tool-use/how-tool-use-works"}] },

{ id:"d1-1.1-b", domain:1, ts:"1.1", scenario:4, type:"single",

  stem:"To cut latency, a developer proposes letting the document-analysis subagent call the web-search subagent directly whenever it needs a source, bypassing the coordinator. What is the strongest architectural objection?",
  options:[
    {k:"A", text:"Routing all communication through the coordinator preserves observability and error handling."},
    {k:"B", text:"Subagents are technically incapable of invoking other subagents under any configuration."},
    {k:"C", text:"Direct calls would cause the two subagents to share one context window, exhausting it faster."},
    {k:"D", text:"The coordinator would no longer receive `stop_reason` values from the delegated calls, so it could not tell when the subagent had actually finished."}
  ],
  correct:["A"],
  explain:{
    why:"Hub-and-spoke exists so one component sees everything: which delegations happened, which failed, what partial results exist, and how information moved. Peer-to-peer calls create paths the coordinator cannot see, so failures inside them are invisible and error handling becomes inconsistent.",
    distractors:{
      B:"It is a design constraint you impose, not a technical impossibility; a subagent granted the Task tool could spawn others.",
      C:"Subagents have isolated context by design. Direct invocation does not merge context windows.",
      D:"`stop_reason` is a per-request API field, unaffected by which component issues the request."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.2-c", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Your coordinator routes every query through all four subagents. For a simple factual query like 'What year was the transformer architecture published?', this costs four delegations and 90 seconds. What change best addresses this without weakening complex-query handling?",
  options:[
    {k:"A", text:"Have the coordinator analyse query requirements and dynamically select which subagents to invoke."},
    {k:"B", text:"Add a caching layer keyed on the query text so that repeated simple questions skip the pipeline entirely."},
    {k:"C", text:"Reduce the number of subagents from four to two by merging search with analysis and synthesis with reporting."},
    {k:"D", text:"Run all four subagents in parallel so total latency is bounded by the slowest rather than the sum."}
  ],
  correct:["A"],
  explain:{
    why:"Deciding which subagents a query actually needs is a core coordinator responsibility. A simple factual lookup needs search, not document analysis and full synthesis. Dynamic selection cuts the cost of easy queries while leaving the full pipeline available for hard ones.",
    distractors:{
      B:"Caching helps only on repeats. The first instance of every simple query still pays the full four-delegation cost.",
      C:"Merging specialised agents broadens each one's remit and tool set, which degrades tool selection reliability, and it still runs everything for every query.",
      D:"Parallelism reduces wall-clock time but not token cost, and the pipeline is partly sequential anyway since synthesis depends on search and analysis output."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.2-d", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Two search subagents working the same topic return heavily overlapping sources: 60% of retrieved URLs are duplicated between them. What is the most effective coordinator-level fix?",
  options:[
    {k:"A", text:"Partition research scope explicitly, giving each subagent distinct subtopics or source types."},
    {k:"B", text:"Deduplicate the merged result set by URL before the combined findings are passed to the synthesis agent for report generation."},
    {k:"C", text:"Reduce to a single search subagent, since parallel search inherently duplicates work."},
    {k:"D", text:"Instruct each search subagent to avoid sources that another subagent might also find."}
  ],
  correct:["A"],
  explain:{
    why:"Duplication here is a delegation problem: both agents were pointed at the same ground. Assigning disjoint subtopics or source types (one takes academic literature, one takes industry reporting) means the parallel capacity buys genuinely additional coverage.",
    distractors:{
      B:"Deduplicating afterwards cleans the output but you have already paid twice for the same searches, and the coverage gap those wasted calls could have filled remains unfilled.",
      C:"This throws away parallel capacity to solve a scoping problem. Properly partitioned parallel search is strictly better than serial search.",
      D:"A subagent has no visibility into what its peers are finding, so it cannot act on this instruction. It has isolated context by design."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.2-e", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Your synthesis agent produces a report covering four of the six subtopics the coordinator identified; two are thin because sources were sparse. You want the system to close such gaps automatically rather than shipping a partial report. What pattern should the coordinator implement?",
  options:[
    {k:"A", text:"An iterative refinement loop: evaluate the synthesis for gaps, re-delegate, then re-invoke it."},
    {k:"B", text:"Instruct the synthesis agent to expand thin sections using its own background knowledge, so every subtopic reaches comparable depth and length in the final report."},
    {k:"C", text:"Increase the number of parallel search subagents from two to six, one per subtopic, on every run."},
    {k:"D", text:"Have the synthesis agent return an error whenever any subtopic falls below a source-count threshold."}
  ],
  correct:["A"],
  explain:{
    why:"The coordinator is the component that can see the whole picture and re-delegate. Evaluating the synthesis for gaps and issuing targeted follow-up queries closes them with focused extra work, rather than blanket effort or an unfinished report.",
    distractors:{
      B:"Filling gaps from model background knowledge produces unsourced claims in a report whose whole purpose is to be cited. That trades a visible gap for an invisible accuracy risk.",
      C:"Always running six searches spends the maximum on every topic regardless of need, and still offers no mechanism for noticing a gap that remains after they run.",
      D:"Failing the run discards four good sections. Partial results with an annotated gap are more useful than an error, and the coordinator could have filled the gap instead."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.2-f", domain:1, ts:"1.2", scenario:1, type:"single",
  stem:"A customer message raises three issues at once: a damaged item, a duplicate charge, and a question about upgrading their plan. Your agent resolves the damaged item and ignores the other two. Which coordinator-level approach best fixes this?",
  options:[
    {k:"A", text:"Decompose into distinct items, investigate each in parallel, then synthesise one unified reply."},
    {k:"B", text:"Instruct the agent to handle the highest-priority issue first and ask the customer to open separate tickets for the rest."},
    {k:"C", text:"Add a preprocessing classifier that routes the message to whichever single specialist queue best matches its dominant topic, discarding the secondary concerns."},
    {k:"D", text:"Increase the maximum response length so there is room to address all three concerns."}
  ],
  correct:["A"],
  explain:{
    why:"Multi-concern messages need explicit decomposition, or the agent latches onto the first issue and treats the turn as complete. Investigating each item against shared customer context and then synthesising one reply resolves everything in a single contact, which is what the first-contact-resolution target measures.",
    distractors:{
      B:"Asking the customer to file more tickets pushes work onto them and directly harms first-contact resolution.",
      C:"Routing to one queue by dominant topic structurally guarantees the other two issues are dropped. It formalises the bug.",
      D:"Length is not the constraint. The agent is not truncating a three-part answer; it never investigated the other two issues."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.2-g", domain:1, ts:"1.2", scenario:3, type:"single",
  stem:"Which statement about subagent context in a coordinator-subagent system is correct?",
  options:[
    {k:"A", text:"Subagents operate with isolated context and do not inherit the coordinator's history."},
    {k:"B", text:"Subagents inherit the coordinator's full conversation history automatically, which is why prompts can stay brief."},
    {k:"C", text:"Subagents share a single context window with the coordinator, so total usage is the sum across all agents."},
    {k:"D", text:"Subagents inherit context only on their first invocation; subsequent invocations start empty."}
  ],
  correct:["A"],
  explain:{
    why:"Context isolation is the defining property of subagent delegation, and the reason it helps with context management: the coordinator stays clean while a subagent does verbose work. The corollary is that anything the subagent needs must be written into its prompt.",
    distractors:{
      B:"This is the single most consequential misconception in this domain. Assuming inheritance produces subagents that act on nothing, because their prompt omitted the facts they needed.",
      C:"A shared window would defeat the purpose. Isolation is what prevents verbose subagent work from consuming the coordinator's context.",
      D:"There is no first-invocation special case. No invocation inherits parent context, and nothing is shared between invocations either."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-a", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"Your coordinator's system prompt instructs it to delegate research to specialised subagents, but at runtime it never delegates; it attempts all the work itself. The AgentDefinitions are correctly declared. What should you check first?",
  options:[
    {k:"A", text:"That the coordinator's `allowedTools` includes `Task`, without which it cannot delegate."},
    {k:"B", text:"That each subagent's `description` field is long enough for the coordinator to match against."},
    {k:"C", text:"That the coordinator and subagents are configured with the same model."},
    {k:"D", text:"That the coordinator's context window is large enough to hold all subagent definitions simultaneously."}
  ],
  correct:["A"],
  explain:{
    why:"Task is the mechanism for spawning subagents. If it is absent from `allowedTools`, the coordinator has no way to delegate no matter what its prompt says, so it falls back to doing the work directly. That is exactly the symptom described.",
    distractors:{
      B:"Thin descriptions cause the coordinator to pick the wrong subagent, not to skip delegation entirely while defined agents are available.",
      C:"Coordinator and subagents routinely run different models; a cheaper model for narrow subtasks is a common and valid choice.",
      D:"Agent definitions are small. Running out of context would produce errors or truncation, not a silent refusal to delegate."
    }
  },
  note:"The guide names this tool **Task**, which is the exam answer. Claude Code v2.1.63 renamed it **Agent**, though the SDK still reports `Task` in the `system:init` tool list.",
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-b", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"Your synthesis subagent produces reports that reference 'the study' and 'recent research' without naming sources, even though the web-search and document-analysis subagents both captured URLs and titles. The coordinator invokes synthesis with the prompt 'Synthesise the research findings into a report.' What is the fix?",
  options:[
    {k:"A", text:"Include the prior subagents' findings directly in the synthesis prompt, with metadata kept separate."},
    {k:"B", text:"Instruct the synthesis subagent in its system prompt to always cite sources for every claim it makes."},
    {k:"C", text:"Give the synthesis subagent direct access to the web-search tool so that it can look up citations for its own claims while it is combining the findings it receives."},
    {k:"D", text:"Have the coordinator append citations to the finished report by matching claims against the source list."}
  ],
  correct:["A"],
  explain:{
    why:"The synthesis subagent has isolated context, so the only research it can see is what the prompt hands it. Told merely to 'synthesise the research findings' with no findings attached, it writes from background knowledge and hedges. Passing the actual findings, with source metadata kept structurally separate from claims, is what makes attribution possible.",
    distractors:{
      B:"You cannot cite sources you were never given. The instruction would either be ignored or push the model to fabricate plausible citations, which is worse.",
      C:"This re-researches ground already covered, wastes the earlier subagents' work, and over-provisions a synthesis agent with tools outside its specialisation.",
      D:"Post-hoc matching of claims to a source list is guesswork; the coordinator does not know which source actually supported which claim once that link was lost."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-c", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"You want three independent search subagents to run concurrently. Your coordinator currently emits one Task call, waits for the result, emits the next, and so on. Total latency is 3x a single search. What change achieves parallelism?",
  options:[
    {k:"A", text:"Emit all three Task tool calls within a single coordinator response."},
    {k:"B", text:"Set `disable_parallel_tool_use` to false in the coordinator's request configuration."},
    {k:"C", text:"Define the three subagents with the same `description` so the coordinator treats them as an interchangeable pool."},
    {k:"D", text:"Increase the coordinator's `max_tokens` so it has room to hold three concurrent result sets."}
  ],
  correct:["A"],
  explain:{
    why:"Concurrency comes from multiple Task calls in one assistant turn. Calls issued in separate turns are inherently sequential, because each turn must complete and return before the next begins.",
    distractors:{
      B:"That setting governs whether the model may emit multiple tool calls per turn; it does not cause a coordinator that emits one call per turn to start batching them, which is a prompting and orchestration matter.",
      C:"Identical descriptions destroy the coordinator's ability to choose between subagents, and does nothing to make invocation concurrent.",
      D:"`max_tokens` bounds the response length. It has no bearing on whether calls execute concurrently."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-d", domain:1, ts:"1.3", scenario:4, type:"single",
  stem:"A coordinator prompt reads: 'Step 1, call search_codebase with the module name. Step 2, call read_file on each result. Step 3, summarise.' Subagents follow it exactly but perform poorly on unfamiliar repository layouts. What principle is being violated?",
  options:[
    {k:"A", text:"Coordinator prompts should state goals and quality criteria rather than step-by-step procedure."},
    {k:"B", text:"Coordinator prompts must never name specific tools, because tool availability varies between subagent definitions and can change between runs."},
    {k:"C", text:"Procedural prompts must be placed in the subagent's system prompt rather than in the Task invocation."},
    {k:"D", text:"Each step should be issued as a separate Task call so the coordinator can validate output between steps."}
  ],
  correct:["A"],
  explain:{
    why:"Rigid procedure removes the subagent's ability to respond to what it actually encounters. A repository with an unusual layout may need a different search strategy entirely. Specifying the goal and what a good answer looks like lets the subagent adapt while still being held to a standard.",
    distractors:{
      B:"Naming tools is fine and often helpful. The problem is dictating the sequence, not mentioning the tools.",
      C:"Relocating the same rigid procedure to the system prompt makes it apply to every invocation, which is worse rather than better.",
      D:"Splitting a rigid sequence into separately-invoked steps makes it more rigid, adds round trips, and still prevents adaptation."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-e", domain:1, ts:"1.3", scenario:2, type:"single",
  stem:"You have analysed a legacy service and want to explore two competing refactoring strategies without repeating that analysis for each. Which session mechanism fits?",
  options:[
    {k:"A", text:"`fork_session`, to create independent branches from the shared analysis baseline."},
    {k:"B", text:"`--resume` with the same session name for both explorations, run one after the other."},
    {k:"C", text:"`/compact` after the analysis, then continue both explorations in the compacted session."},
    {k:"D", text:"Two separate fresh sessions, each re-running the analysis with an identical prompt."}
  ],
  correct:["A"],
  explain:{
    why:"Forking is designed for exactly this: divergent exploration from a common baseline. Each branch inherits the completed analysis and then evolves independently, so the two strategies can be compared without contaminating one another.",
    distractors:{
      B:"Resuming the same session sequentially means the second exploration inherits the first one's reasoning and conclusions, which biases the comparison.",
      C:"`/compact` reduces context usage within one continuing session. It creates no branches, so the two explorations still interleave.",
      D:"This duplicates the analysis cost and risks the two baselines differing, which undermines the comparison you are trying to make."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-f", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"Which element of an `AgentDefinition` most directly determines whether a coordinator picks the right subagent for a given subtask?",
  options:[
    {k:"A", text:"The `description`, which states when the subagent should be used."},
    {k:"B", text:"The system prompt, which defines how the subagent behaves once invoked."},
    {k:"C", text:"The tool restrictions, which bound what the subagent can do."},
    {k:"D", text:"The model selection, which determines the subagent's reasoning capability."}
  ],
  correct:["A"],
  explain:{
    why:"Selection happens before invocation, and the description is what the coordinator reads to make that choice. This mirrors the tool-description principle: the text that says when to use something is what drives selection between similar options.",
    distractors:{
      B:"The system prompt shapes behaviour after the subagent has already been chosen, so it cannot influence the choice itself.",
      C:"Tool restrictions constrain what happens post-invocation and guard against misuse, but they do not tell the coordinator which agent to pick.",
      D:"Model selection affects quality of execution, not which subagent the coordinator routes to."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.3-g", domain:1, ts:"1.3", scenario:3, type:"single",
  stem:"A subagent is invoked twice in one research run. On the second invocation it repeats work it completed on the first. What explains this, and what is the correct remedy?",
  options:[
    {k:"A", text:"Subagents share no memory between invocations, so the coordinator must pass earlier results forward."},
    {k:"B", text:"The subagent's memory was evicted under context pressure; raise its context limit so that state survives between separate invocations."},
    {k:"C", text:"The two invocations used different session IDs; reuse one ID so the subagent recognises the continuation."},
    {k:"D", text:"The subagent's `description` is ambiguous, causing the coordinator to invoke it for a task it already completed."}
  ],
  correct:["A"],
  explain:{
    why:"Each invocation starts clean. There is no persistence between them, so unless the coordinator passes forward what was already established, the second run legitimately has no idea the first happened.",
    distractors:{
      B:"This is not eviction under pressure. Nothing was ever carried between the invocations to evict.",
      C:"Subagent invocations are not continued by reusing an identifier in this way; the prompt is the channel for continuity.",
      D:"A vague description could cause a redundant invocation, but the question describes the subagent redoing work inside an invocation the coordinator intended, which is a context-passing failure."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.4-a", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"Production data shows that in 12% of cases your agent skips `get_customer` entirely and calls `lookup_order` using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change most effectively addresses this?",
  options:[
    {k:"A", text:"Add a programmatic prerequisite that blocks `lookup_order` and `process_refund` until `get_customer` returns a verified customer ID."},
    {k:"B", text:"Enhance the system prompt to state that customer verification via `get_customer` is mandatory before any order operations."},
    {k:"C", text:"Add few-shot examples showing the agent always calling `get_customer` first, even when customers volunteer order details."},
    {k:"D", text:"Implement a routing classifier that analyses each incoming request and enables only the subset of tools appropriate to that request type."}
  ],
  correct:["A"],
  explain:{
    why:"When a tool sequence is required for critical business logic, programmatic enforcement gives a deterministic guarantee that prompting cannot. A gate that refuses `process_refund` without a verified customer ID takes the 12% failure rate to zero.",
    distractors:{
      B:"A stronger prompt lowers the failure rate but never eliminates it. With money moving on the outcome, a residual few percent is the entire problem.",
      C:"Few-shot examples have the same probabilistic ceiling as the prompt fix, and add token cost to every request.",
      D:"This changes which tools are available, but the defect is the order in which they are called. Both tools are legitimately needed for this request type."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.4-b", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"Your agent escalates a billing dispute to a human with the message: 'Customer is upset about a charge and wants it resolved. Please assist.' The human agent, who cannot see the conversation, spends eight minutes re-gathering basics. What should the handoff include?",
  options:[
    {k:"A", text:"A structured summary carrying the customer ID, root cause, disputed amount and recommended action."},
    {k:"B", text:"The full verbatim conversation transcript, so the human can read everything the agent saw."},
    {k:"C", text:"A confidence score indicating how certain the agent is about the diagnosis, to guide how much the human should re-check."},
    {k:"D", text:"A link to the customer record in the CRM, so the human can look up whatever they need."}
  ],
  correct:["A"],
  explain:{
    why:"The receiving human has no transcript, so the handoff must be self-contained and actionable. Identity, diagnosed root cause, the amount and a recommendation let them verify and act immediately instead of restarting the investigation.",
    distractors:{
      B:"A raw transcript makes the human do the analysis the agent already did. It is a dump, not a handoff, and it is slower to consume than a structured summary.",
      C:"A self-reported confidence score is poorly calibrated and, on its own, tells the human nothing about what the case actually is.",
      D:"A CRM link provides identity but none of the diagnosis, so the human still has to work out what happened and what to do."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.4-c", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"Company policy caps automated refunds at $500; anything higher needs human approval. Which implementation gives a deterministic guarantee?",
  options:[
    {k:"A", text:"A hook that intercepts `process_refund`, blocks amounts over $500 and redirects to escalation."},
    {k:"B", text:"A system prompt rule stating that refunds over $500 must always be escalated to a human agent."},
    {k:"C", text:"A validation note in the `process_refund` tool description that explains the $500 limit and the policy rationale behind it."},
    {k:"D", text:"A post-processing audit that flags any refund over $500 for next-day human review."}
  ],
  correct:["A"],
  explain:{
    why:"A hard monetary threshold is precisely the case for interception. A PreToolUse-style hook evaluates the actual argument before the call executes and can deny it outright, so the policy holds every time regardless of how the model reasoned.",
    distractors:{
      B:"Prompt rules are followed most of the time, which is not the same as always. The exceptions here are unauthorised payments.",
      C:"A tool description informs the model's choice but does not constrain it. Nothing stops a call with a larger amount.",
      D:"Reviewing the next day means the money has already left. This detects violations rather than preventing them."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.4-d", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"Which statement best captures when to choose programmatic enforcement over prompt-based guidance for workflow ordering?",
  options:[
    {k:"A", text:"When deterministic compliance is required, since prompt instructions have a non-zero failure rate."},
    {k:"B", text:"When the workflow has more than three steps, because prompts cannot reliably encode longer sequences."},
    {k:"C", text:"When the model being used is smaller, since larger models follow prompt instructions reliably enough to skip enforcement."},
    {k:"D", text:"When the tools involved come from MCP servers rather than being built in, since MCP calls bypass prompt constraints."}
  ],
  correct:["A"],
  explain:{
    why:"The criterion is the consequence of failure, not the shape of the workflow. If a single violation is unacceptable, as with verifying identity before moving money, only code-level enforcement gives that guarantee.",
    distractors:{
      B:"Step count is not the deciding factor. A two-step sequence can absolutely require deterministic enforcement if the second step is a payment.",
      C:"Larger models comply more often, but more often is still not always. The residual rate remains unacceptable for critical operations.",
      D:"MCP tool calls are subject to the same hooks and gates as any other. Tool origin is irrelevant to this decision."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.4-e", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"A customer writes: 'My order arrived damaged AND I was charged twice AND I want to know if I can switch to annual billing.' What processing approach best supports first-contact resolution?",
  options:[
    {k:"A", text:"Decompose into three items, investigate each in parallel, then synthesise a single response."},
    {k:"B", text:"Process the items strictly sequentially, fully closing each one before reading the next, to avoid confusing the tool calls."},
    {k:"C", text:"Answer the billing question immediately since it needs no tool calls, and escalate the other two to a human."},
    {k:"D", text:"Ask the customer which of the three issues they would like to address first in this conversation."}
  ],
  correct:["A"],
  explain:{
    why:"All three concerns share the same customer context, so investigating them in parallel and answering once resolves the contact in a single turn. That is what the first-contact resolution metric rewards.",
    distractors:{
      B:"Strict sequencing wastes the shared context and adds latency, and in practice is where agents lose track and drop the later items.",
      C:"The damage claim and duplicate charge are both routine, well within the agent's tool capability. Escalating them wastes human capacity and fails the resolution target.",
      D:"Making the customer triage their own ticket is poor service and structurally guarantees the contact cannot resolve everything."
    }
  },
  refs:[{label:"Agent SDK: Subagents", url:"https://code.claude.com/docs/en/agent-sdk/subagents"}] },

{ id:"d1-1.4-f", domain:1, ts:"1.4", scenario:1, type:"single",
  stem:"You add a prerequisite gate blocking `process_refund` until `get_customer` succeeds. In testing, the agent now hits the block, receives a denial, and replies to the customer with a raw error string. What is missing from the design?",
  options:[
    {k:"A", text:"The block should return an actionable reason, so the agent calls `get_customer` and retries."},
    {k:"B", text:"The gate should silently drop the call, so the agent continues without noticing a problem occurred."},
    {k:"C", text:"The gate should be removed and replaced with a prompt instruction, since a hard block confuses the model and produces unhelpful customer-facing errors."},
    {k:"D", text:"The gate should terminate the conversation and escalate to a human whenever it fires."}
  ],
  correct:["A"],
  explain:{
    why:"A denial is information the agent has to act on. Saying why the call was refused, and what would unblock it, turns the gate into a corrective nudge: the agent verifies the customer, then retries successfully.",
    distractors:{
      B:"Silently dropping a call is the worst option. The agent believes the refund happened and tells the customer so.",
      C:"Removing the gate reintroduces the exact defect it was added to prevent. The problem is the denial's ergonomics, not its existence.",
      D:"Escalating on every fire wastes human capacity on cases the agent could resolve itself in one extra tool call."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.4-g", domain:1, ts:"1.4", scenario:5, type:"single",
  stem:"Your CI pipeline requires that a security scan tool always runs before Claude Code is allowed to post review comments on a pull request. Which mechanism enforces this ordering reliably?",
  options:[
    {k:"A", text:"A programmatic prerequisite gating the comment step on the scan completing successfully."},
    {k:"B", text:"A CLAUDE.md instruction stating that the security scan must always be consulted before any review comment is posted to the pull request."},
    {k:"C", text:"A few-shot example in the review prompt showing a scan result being referenced before comments are written."},
    {k:"D", text:"Ordering the instructions in the prompt so the scan is described first and commenting last."}
  ],
  correct:["A"],
  explain:{
    why:"Ordering guarantees belong to the pipeline, which controls step execution deterministically. Gating the comment step on the scan step's exit status means the ordering cannot be violated regardless of model behaviour.",
    distractors:{
      B:"CLAUDE.md is context, not enforced configuration. It shapes behaviour without guaranteeing it, which the Claude Code documentation states explicitly.",
      C:"An example demonstrates a pattern; it does not constrain execution order.",
      D:"Prompt ordering influences behaviour weakly and is trivially overridden by the model's own reasoning about what to do first."
    }
  },
  refs:[{label:"Claude Code: Memory", url:"https://code.claude.com/docs/en/memory"}] },

{ id:"d1-1.5-a", domain:1, ts:"1.5", scenario:1, type:"single",
  stem:"Your agent reads order data from three MCP tools. One returns dates as Unix timestamps, one as ISO 8601 strings, and one as `MM/DD/YYYY`. The agent frequently miscalculates whether a return window has expired. What is the cleanest fix?",
  options:[
    {k:"A", text:"A `PostToolUse` hook that normalises all date formats before the model reads the results."},
    {k:"B", text:"A system prompt section explaining each tool's date format and how to convert between them."},
    {k:"C", text:"A `PreToolUse` hook that rewrites each tool's input arguments so that every backend is asked for a consistent date format."},
    {k:"D", text:"Few-shot examples showing correct return-window calculations for each of the three formats."}
  ],
  correct:["A"],
  explain:{
    why:"`PostToolUse` intercepts results on their way back, which is exactly where format normalisation belongs. Converting every date to one representation before the model sees it removes the arithmetic ambiguity entirely, deterministically, for every call.",
    distractors:{
      B:"This asks the model to perform format detection and conversion on every reasoning step. It will mostly work, and the failures are silent date errors, which is the current problem.",
      C:"`PreToolUse` acts on outgoing calls. These backends return whatever format they return; you cannot fix an inbound format by rewriting the request.",
      D:"Examples improve the odds of correct conversion but leave the model doing conversion work that code should do once, reliably."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.5-b", domain:1, ts:"1.5", scenario:1, type:"single",
  stem:"Which hook event intercepts an outgoing tool call so it can be blocked before it executes?",
  options:[
    {k:"A", text:"`PreToolUse`, which returns a `permissionDecision` of `allow`, `deny`, `ask` or `defer` before execution."},
    {k:"B", text:"`PostToolUse`, which inspects the call and can veto it retroactively."},
    {k:"C", text:"`Stop`, which runs at the end of the turn and can roll back any tool effects that have already occurred during it."},
    {k:"D", text:"`SubagentStart`, which gates any tool call made inside a delegated task."}
  ],
  correct:["A"],
  explain:{
    why:"`PreToolUse` runs before execution, which is what makes blocking possible. It returns `hookSpecificOutput` carrying a `permissionDecision`, and `deny` prevents the call from running at all.",
    distractors:{
      B:"`PostToolUse` runs after the tool has already executed. It can reshape or replace the output, but the side effects have happened.",
      C:"`Stop` is a lifecycle event at turn end. It cannot undo a refund that was already issued.",
      D:"`SubagentStart` fires when a subagent begins, not per tool call, and it does not gate individual invocations."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.5-c", domain:1, ts:"1.5", scenario:1, type:"single",
  stem:"A `PostToolUse` hook needs to strip 38 irrelevant fields from a verbose order-lookup response so only the 5 return-relevant fields reach the model. Which hook output field accomplishes this?",
  options:[
    {k:"A", text:"`updatedToolOutput`, which replaces the tool's output before Claude sees it."},
    {k:"B", text:"`additionalContext`, which appends the trimmed version alongside the original."},
    {k:"C", text:"`permissionDecision`, set to `allow` with the trimmed payload attached."},
    {k:"D", text:"`updatedInput`, which rewrites the arguments so the tool returns fewer fields."}
  ],
  correct:["A"],
  explain:{
    why:"`updatedToolOutput` substitutes the result the model receives, so the 38 unwanted fields never enter context at all. That is the difference between trimming and merely annotating.",
    distractors:{
      B:"`additionalContext` appends. The original 43-field payload still enters context, so you have made the problem slightly worse rather than better.",
      C:"`permissionDecision` belongs to `PreToolUse` and governs whether a call runs; it is not a mechanism for reshaping results.",
      D:"`updatedInput` rewrites a call's arguments before execution. It cannot help when the backend returns all fields regardless of what you ask for."
    }
  },
  refs:[{label:"Agent SDK: Hooks", url:"https://code.claude.com/docs/en/agent-sdk/hooks"}] },

{ id:"d1-1.5-d", domain:1, ts:"1.5", scenario:1, type:"single",
  stem:"Your compliance team requires that no refund above $500 can ever be issued automatically, with zero tolerance for exceptions. An engineer argues the system prompt already says this clearly and the model has complied in all 400 test cases. How should you respond?",
  options:[
    {k:"A", text:"Prompt compliance is probabilistic; 400 passing cases do not bound the failure rate."},
    {k:"B", text:"400 consecutive passing cases is statistically sufficient evidence of compliance, so the existing system prompt is adequate as written."},
    {k:"C", text:"Add extended thinking so the model reasons more carefully about the threshold before each refund."},
    {k:"D", text:"Raise the temperature setting to 0, which makes instruction-following deterministic."}
  ],
  correct:["A"],
